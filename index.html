<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Juegos de Informática</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect x='6' y='14' width='52' height='36' rx='14' fill='%23ff7a59'/%3E%3Ccircle cx='22' cy='32' r='5' fill='%23fff'/%3E%3Ccircle cx='44' cy='27' r='4' fill='%23ffd23f'/%3E%3Ccircle cx='44' cy='37' r='4' fill='%234fc3f7'/%3E%3C/svg%3E">
<style>
@font-face{font-family:Nunito;font-weight:600;font-display:swap;src:url(fonts/nunito-latin-600-normal.woff2) format('woff2')}
@font-face{font-family:Nunito;font-weight:800;font-display:swap;src:url(fonts/nunito-latin-800-normal.woff2) format('woff2')}
:root{--ink:#24204a;--dim:#6b6790;--bg:#eef3ff;--card:#fff;--line:#d6def5}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--ink);font:600 16px/1.35 Nunito,'Segoe UI',system-ui,sans-serif;overflow-x:hidden}
.blobs{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.blobs i{position:absolute;border-radius:50%;filter:blur(2px);opacity:.55;animation:drift 18s ease-in-out infinite alternate}
@keyframes drift{to{transform:translate(40px,-30px) scale(1.08)}}
header{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:12px;padding:12px 20px;background:rgba(238,243,255,.85);backdrop-filter:blur(8px);flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:10px;font-weight:800;font-size:22px;color:var(--ink);text-decoration:none;background:#fff;padding:8px 16px 8px 10px;border-radius:999px;box-shadow:0 4px 0 var(--line)}
.logo svg{width:38px;height:38px}
.crumbs{display:flex;gap:8px;flex-wrap:wrap}
.crumb{font-weight:800;font-size:16px;padding:9px 16px;border-radius:999px;background:#fff;color:var(--ink);text-decoration:none;box-shadow:0 4px 0 var(--line)}
.crumb.on{background:var(--ink);color:#fff;box-shadow:0 4px 0 #0f0c26}
main{position:relative;z-index:1;max-width:1240px;margin:0 auto;padding:18px 20px 60px}
h1{font-size:clamp(28px,4.5vw,46px);margin:10px 0 4px;font-weight:800;letter-spacing:-.5px}
h2{font-size:clamp(22px,3vw,28px);margin:30px 0 12px;font-weight:800}
.sub{color:var(--dim);margin:0 0 18px;font-size:18px}
.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:0 0 22px}
.chip{display:inline-flex;align-items:center;gap:8px;padding:9px 16px;border-radius:999px;background:#fff;color:var(--ink);font-weight:800;text-decoration:none;box-shadow:0 4px 0 var(--line);transition:transform .15s}
.chip:hover{transform:translateY(-2px)}
.chip i{width:12px;height:12px;border-radius:50%;display:inline-block}
.search{flex:1 1 260px;max-width:420px;position:relative}
.search input{width:100%;font:800 17px Nunito,'Segoe UI',sans-serif;color:var(--ink);padding:12px 18px 12px 46px;border:0;border-radius:999px;background:#fff;box-shadow:0 4px 0 var(--line);outline:none}
.search input:focus{box-shadow:0 4px 0 #9b7bff,0 0 0 3px #e3d9ff}
.search svg{position:absolute;left:16px;top:50%;width:20px;height:20px;transform:translateY(-50%)}
.search kbd{position:absolute;right:14px;top:50%;transform:translateY(-50%);font:800 13px Nunito,sans-serif;color:var(--dim);background:#eef3ff;border-radius:6px;padding:2px 8px}
.grid{display:grid;gap:22px}
.schools{grid-template-columns:repeat(auto-fit,minmax(min(100%,380px),1fr))}
.classes{grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr))}
.games{grid-template-columns:repeat(auto-fill,minmax(min(100%,250px),1fr))}
.recent{grid-template-columns:repeat(auto-fill,minmax(min(100%,220px),1fr))}
.tile{position:relative;display:block;border-radius:28px;text-decoration:none;color:#fff;overflow:hidden;transition:transform .18s cubic-bezier(.34,1.56,.64,1),box-shadow .18s;box-shadow:0 8px 0 rgba(0,0,0,.14)}
.tile:hover,.tile:focus-visible{transform:translateY(-6px) rotate(-.6deg);box-shadow:0 14px 0 rgba(0,0,0,.14);outline:none}
.tile:active{transform:translateY(2px) scale(.98)}
.school{min-height:280px;padding:28px}
.school .big{font-size:clamp(56px,8vw,86px);font-weight:800;line-height:1;letter-spacing:-1px;text-shadow:0 4px 0 rgba(0,0,0,.12)}
.school .place{font-size:22px;opacity:.95}
.school .count,.klass .count{position:absolute;left:24px;bottom:20px;background:rgba(255,255,255,.25);padding:6px 14px;border-radius:999px;font-weight:800}
.school svg.art{position:absolute;right:-6px;bottom:-6px;width:58%;max-width:300px}
.klass{min-height:230px;padding:22px}
.klass .big{font-size:clamp(40px,6vw,58px);font-weight:800;line-height:1.05;text-shadow:0 3px 0 rgba(0,0,0,.12)}
.klass .det{font-size:18px;opacity:.95}
.klass .stack{position:absolute;right:16px;bottom:16px;display:flex}
.klass .stack i{display:grid;place-items:center;width:64px;height:64px;border-radius:16px;border:3px solid #fff;margin-left:-22px;box-shadow:0 4px 10px rgba(0,0,0,.2);color:#fff;font:800 32px Nunito,'Segoe UI',sans-serif;font-style:normal}
.klass .stack i:nth-child(1){transform:rotate(-8deg)}.klass .stack i:nth-child(3){transform:rotate(7deg)}
.game{background:var(--card);color:var(--ink);border-radius:22px;box-shadow:0 7px 0 var(--line)}
.game:hover,.game:focus-visible{box-shadow:0 12px 0 #c9d3f0}
.game .shot{position:relative;aspect-ratio:16/9;background:#dfe6fa center/cover no-repeat;border-radius:22px 22px 0 0;filter:saturate(1.12) contrast(1.03);transition:background-size .3s}
.game .shot::after{content:'';position:absolute;inset:0;border-radius:inherit;box-shadow:inset 0 0 0 1px rgba(0,0,0,.06),inset 0 -40px 40px -30px rgba(20,16,60,.35)}
.game .frame{overflow:hidden;border-radius:22px 22px 0 0}
.game .frame .shot{transition:transform .35s ease}
.game:hover .frame .shot{transform:scale(1.06)}
.game .cover{position:relative;aspect-ratio:16/9;border-radius:22px 22px 0 0;overflow:hidden;display:grid;place-items:center;padding:0 8%;container-type:inline-size;background:radial-gradient(circle at 18% 12%,rgba(255,255,255,.28),transparent 46%),linear-gradient(140deg,var(--c),color-mix(in srgb,var(--c) 70%,#1e1550))}
.game .cover::before{content:'';position:absolute;inset:0;background-image:radial-gradient(rgba(255,255,255,.16) 2px,transparent 2.5px);background-size:22px 22px}
.game .cover::after{content:'';position:absolute;right:-12%;bottom:-38%;width:55%;aspect-ratio:1;border-radius:50%;background:rgba(255,255,255,.12)}
.game .ct{position:relative;z-index:1;color:#fff;font-weight:800;text-align:center;line-height:1.04;letter-spacing:-.02em;font-size:calc(var(--k) * 1cqw);text-shadow:0 .07em 0 rgba(0,0,0,.2);transition:transform .25s cubic-bezier(.34,1.56,.64,1)}
.game:hover .ct{transform:scale(1.07) rotate(-2deg)}
.game .info .d{color:var(--ink);font-size:16px;margin-top:0}.game .info{padding:12px 44px 16px 16px}
.game .t{font-weight:800;font-size:19px;line-height:1.2}
.game .d{color:var(--dim);font-size:15px;margin-top:3px}
.game .where{display:inline-block;margin-top:8px;font-size:13px;font-weight:800;color:#fff;padding:2px 10px;border-radius:999px}
.game .key{position:absolute;bottom:12px;right:12px;font:800 13px Nunito,sans-serif;color:var(--dim);background:#eef3ff;border-radius:6px;padding:1px 7px}
.badge{position:absolute;top:12px;left:12px;background:#ffd23f;color:var(--ink);font-weight:800;font-size:13px;padding:4px 10px;border-radius:999px;box-shadow:0 3px 0 #d6a800;letter-spacing:.5px}
.badge.go{background:#2fbf8f;color:#fff;box-shadow:0 3px 0 #1d8a66}
.play{position:absolute;top:12px;right:12px;width:44px;height:44px;border-radius:50%;background:#fff;display:grid;place-items:center;box-shadow:0 3px 0 rgba(0,0,0,.15);opacity:0;transform:scale(.6);transition:.18s}
.game:hover .play{opacity:1;transform:scale(1)}
.play svg{width:20px;height:20px;margin-left:3px}
.empty{color:var(--dim);font-size:18px;padding:20px 0}
.ideaBtn{position:fixed;right:20px;bottom:20px;z-index:8;display:flex;align-items:center;gap:8px;border:0;cursor:pointer;font:800 17px Nunito,'Segoe UI',sans-serif;color:var(--ink);background:#fff;padding:10px 18px 10px 12px;border-radius:999px;box-shadow:0 5px 0 var(--line),0 10px 24px rgba(36,32,74,.15);transition:transform .18s cubic-bezier(.34,1.56,.64,1)}
.ideaBtn:hover{transform:translateY(-3px) rotate(-2deg)}
.ideaBtn svg{width:30px;height:30px}
.ideaBtn[hidden],.toast[hidden],.modal[hidden]{display:none}
.toast{position:fixed;right:20px;bottom:84px;z-index:8;width:min(340px,calc(100vw - 40px));background:#24204a;color:#fff;border-radius:22px;padding:16px 18px;box-shadow:0 14px 30px rgba(36,32,74,.3);animation:up .4s cubic-bezier(.34,1.56,.64,1)}
.toast b{display:block;font-size:17px;line-height:1.3;margin-bottom:12px}
@keyframes up{from{opacity:0;transform:translateY(20px) scale(.95)}}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.ghost{font:800 16px Nunito,'Segoe UI',sans-serif;border:0;background:none;color:inherit;opacity:.8;cursor:pointer;padding:10px}
.modal{position:fixed;inset:0;z-index:9;background:rgba(36,32,74,.45);display:grid;place-items:center;padding:16px}
.modal .box{position:relative;width:min(520px,100%);background:#fff;border-radius:26px;padding:24px;display:flex;flex-direction:column;gap:14px;box-shadow:0 20px 50px rgba(0,0,0,.25);animation:up .35s cubic-bezier(.34,1.56,.64,1)}
.modal h3{margin:0;font-size:26px;font-weight:800}
.modal textarea{font:600 17px Nunito,'Segoe UI',sans-serif;color:var(--ink);border:2px solid var(--line);border-radius:16px;padding:12px 14px;background:#f7f9ff;outline:none;min-height:130px;resize:vertical}
.modal textarea:focus{border-color:#9b7bff}
.mute{margin-left:auto;width:46px;height:46px;border:0;border-radius:50%;background:#fff;box-shadow:0 4px 0 var(--line);cursor:pointer;display:grid;place-items:center;transition:transform .15s}
.mute:hover{transform:translateY(-2px)}
.mute svg{width:24px;height:24px}
.confeti{position:fixed;z-index:20;width:10px;height:14px;border-radius:3px;pointer-events:none}
.done{position:absolute;inset:0;border-radius:26px;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;text-align:center;padding:20px}
.done[hidden]{display:none}
.done .bulb{position:relative;width:110px;height:110px;animation:bulb .7s cubic-bezier(.34,1.56,.64,1)}
.done .bulb svg{width:100%;height:100%}
.done .bulb .chk{position:absolute;right:-6px;bottom:2px;width:44px;height:44px;animation:chk .5s .35s cubic-bezier(.34,1.56,.64,1) backwards}
.done b{font-size:30px;font-weight:800;animation:up .45s .15s cubic-bezier(.34,1.56,.64,1) backwards}
.done span{color:var(--dim);font-size:18px;animation:up .45s .25s cubic-bezier(.34,1.56,.64,1) backwards}
@keyframes bulb{0%{transform:scale(.2) rotate(-30deg);opacity:0}60%{transform:scale(1.15) rotate(8deg);opacity:1}100%{transform:scale(1) rotate(0)}}
@keyframes chk{from{transform:scale(0) rotate(-90deg)}}
.ideaBtn svg{animation:glow 2.6s ease-in-out infinite}
@keyframes glow{0%,100%{filter:drop-shadow(0 0 0 rgba(255,210,63,0))}50%{filter:drop-shadow(0 0 6px rgba(255,210,63,.9))}}.x{position:absolute;top:12px;right:14px;width:40px;height:40px;border:0;border-radius:50%;background:#eef3ff;font:800 24px Nunito,sans-serif;color:var(--ink);cursor:pointer}.seg{display:flex;gap:8px;flex-wrap:wrap}
.seg label{cursor:pointer}
.seg input{position:absolute;opacity:0}
.seg span{display:inline-block;padding:8px 14px;border-radius:999px;background:#eef3ff;font-weight:800}
.seg input:checked+span{background:#9b7bff;color:#fff}
.send{align-self:flex-start;font:800 17px Nunito,'Segoe UI',sans-serif;border:0;border-radius:999px;padding:11px 22px;background:#ff7a59;color:#fff;cursor:pointer;box-shadow:0 4px 0 #d9532f;transition:transform .15s}
.send:hover{transform:translateY(-2px)}
.send:disabled{opacity:.5;cursor:default;transform:none}
.thanks{font-weight:800;color:#1d8a66;min-height:1.3em}
.note{color:var(--dim);font-size:14px}
footer{position:relative;z-index:1;text-align:center;color:var(--dim);font-size:14px;padding:0 20px 30px}
@media (max-width:560px){header{padding:10px 12px}.logo span{display:none}.school{min-height:220px}.search kbd{display:none}}
/* ---------- Liquid glass ---------- */
.thanks.warn{color:#d6456a}
.modal textarea.shake{animation:shake .45s ease;border-color:#ef8aa3}
@keyframes shake{20%{transform:translateX(-8px)}40%{transform:translateX(7px)}60%{transform:translateX(-5px)}80%{transform:translateX(3px)}}
.search svg,.search kbd{z-index:2}
:root{--glass:linear-gradient(135deg,rgba(255,255,255,.62),rgba(255,255,255,.28));--rim:inset 0 1px 0 rgba(255,255,255,.95),inset 0 -1px 0 rgba(255,255,255,.35),inset 0 0 0 1px rgba(255,255,255,.45);--soft:0 10px 30px rgba(36,32,74,.12),0 2px 6px rgba(36,32,74,.06)}
body{background:#e9eefc}
.blobs i{opacity:.85;filter:blur(40px)}
.blobs i:nth-child(1){background:#ffb59e!important;width:560px!important;height:560px!important}
.blobs i:nth-child(2){background:#9fd3ff!important;width:520px!important;height:520px!important}
.blobs i:nth-child(3){background:#c7b4ff!important;width:520px!important;height:520px!important}
.blobs i:nth-child(4){background:#a8ecd0!important;width:380px!important;height:380px!important}
header{background:rgba(233,238,252,.35);backdrop-filter:blur(22px) saturate(180%);-webkit-backdrop-filter:blur(22px) saturate(180%);border-bottom:1px solid rgba(255,255,255,.55)}
.logo,.crumb,.chip,.search input,.mute,.ideaBtn,.game,.resume{background:var(--glass);backdrop-filter:blur(20px) saturate(180%);-webkit-backdrop-filter:blur(20px) saturate(180%);box-shadow:var(--rim),var(--soft)}
.crumb.on{background:linear-gradient(135deg,rgba(36,32,74,.88),rgba(36,32,74,.7));box-shadow:inset 0 1px 0 rgba(255,255,255,.25),var(--soft)}
.search input:focus{box-shadow:var(--rim),0 0 0 4px rgba(155,123,255,.25),var(--soft)}
.game:hover,.game:focus-visible{box-shadow:var(--rim),0 18px 40px rgba(36,32,74,.18)}
.tile{box-shadow:0 14px 34px rgba(36,32,74,.16),0 2px 6px rgba(36,32,74,.08)}
.tile:hover,.tile:focus-visible{box-shadow:0 22px 46px rgba(36,32,74,.22),0 3px 8px rgba(36,32,74,.1)}
.school::before,.klass::before,.game .cover::before{content:'';position:absolute;inset:0;border-radius:inherit;pointer-events:none;background:linear-gradient(180deg,rgba(255,255,255,.38),rgba(255,255,255,0) 42%),radial-gradient(rgba(255,255,255,.16) 2px,transparent 2.5px) 0 0/22px 22px;box-shadow:inset 0 1px 0 rgba(255,255,255,.6),inset 0 0 0 1px rgba(255,255,255,.25)}
.school .count,.klass .count{background:rgba(255,255,255,.28);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);box-shadow:inset 0 1px 0 rgba(255,255,255,.6)}
.badge{box-shadow:inset 0 1px 0 rgba(255,255,255,.7),0 4px 10px rgba(0,0,0,.15)}
.play{background:rgba(255,255,255,.75);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);box-shadow:var(--rim),0 6px 16px rgba(0,0,0,.18)}
.toast{background:linear-gradient(135deg,rgba(36,32,74,.82),rgba(36,32,74,.62));backdrop-filter:blur(24px) saturate(160%);-webkit-backdrop-filter:blur(24px) saturate(160%);box-shadow:inset 0 1px 0 rgba(255,255,255,.22),0 20px 44px rgba(36,32,74,.3)}
.modal{background:rgba(36,32,74,.22);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.modal .box{background:linear-gradient(135deg,rgba(255,255,255,.82),rgba(255,255,255,.6));backdrop-filter:blur(30px) saturate(180%);-webkit-backdrop-filter:blur(30px) saturate(180%);box-shadow:var(--rim),0 30px 60px rgba(36,32,74,.28)}
.modal textarea{background:rgba(255,255,255,.6);border-color:rgba(255,255,255,.8);box-shadow:inset 0 1px 3px rgba(36,32,74,.08)}
.done{background:linear-gradient(135deg,rgba(255,255,255,.92),rgba(255,255,255,.78))}
.seg span{background:rgba(255,255,255,.6);box-shadow:var(--rim)}
.send{box-shadow:inset 0 1px 0 rgba(255,255,255,.45),0 8px 18px rgba(255,122,89,.35);background:linear-gradient(180deg,#ff8f70,#ff6a45)}
.x{background:rgba(255,255,255,.7);box-shadow:var(--rim)}
.game .key,.search kbd{background:rgba(255,255,255,.6);box-shadow:var(--rim)}</style>
</head>

<script>
(function () {
  'use strict';
  var D = window.JUEGOS, R = window.RINCON || {}, app = document.getElementById('app'), crumbs = document.getElementById('crumbs');
  var esc = function (s) { return String(s).replace(/[<>&"]/g, function (c) { return { '<': '&lt;', '>': '&gt;', '&': '&amp;', '"': '&quot;' }[c]; }); };
  var plural = function (n) { return n + (n === 1 ? ' juego' : ' juegos'); };
  var ls = { get: function (k, d) { try { var v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } }, set: function (k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { } } };

  var find = function (slug, where) { return ALL.filter(function (x) { return x.j.slug === slug && (!where || x.c.id + '/' + x.k.id === where); })[0]; };
  var norm = function (s) { return s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, ''); };
  var schoolArt = function (color) {
    return '<svg class="art" viewBox="0 0 300 220" aria-hidden="true"><rect x="40" y="90" width="220" height="130" rx="10" fill="rgba(255,255,255,.9)"/><path d="M28 98 L150 26 L272 98Z" fill="rgba(255,255,255,.75)"/><rect x="128" y="150" width="44" height="70" rx="8" fill="' + color + '" opacity=".55"/>' +
      [70, 110, 190, 230].map(function (x) { return '<rect x="' + (x - 14) + '" y="118" width="28" height="26" rx="6" fill="' + color + '" opacity=".4"/>'; }).join('') +
      '<circle cx="150" cy="76" r="15" fill="' + color + '" opacity=".5"/><path d="M150 26 V4 M150 4 h26 v14 h-26" stroke="rgba(255,255,255,.9)" stroke-width="5" fill="rgba(255,255,255,.75)"/></svg>';
  };
  var STAR = function (on) { return '<svg viewBox="0 0 24 24"><path d="M12 2.5l2.9 6 6.6.8-4.9 4.6 1.3 6.6L12 17.3 6.1 20.5l1.3-6.6L2.5 9.3l6.6-.8z" fill="' + (on ? '#ffd23f' : '#e3e8f7') + '" stroke="' + (on ? '#d6a800' : '#c9d3f0') + '" stroke-width="1.5" stroke-linejoin="round"/></svg>'; };
  function card(x, o) {
    o = o || {};
    var j = x.j;
    return '<a class="tile game" href="' + esc(j.href) + '" data-slug="' + esc(j.slug) + '" data-where="' + x.c.id + '/' + x.k.id + '">' + cover(j) +
      (o.go ? '<span class="badge go">SEGUIR</span>' : j.nuevo ? '<span class="badge">NUEVO</span>' : '') + '<span class="play"><svg viewBox="0 0 20 20"><path d="M4 2 L18 10 L4 18Z" fill="#24204a"/></svg></span>' +
      '<div class="info"><div class="d">' + esc(j.desc) + '</div>' +
      (o.where ? '<span class="where" style="background:' + x.k.color + '">' + esc(x.c.nombre + ' · ' + x.k.nombre) + '</span>' : '') + '</div>' +
      (o.key ? '<span class="key">' + o.key + '</span>' : '') + '</a>';
  }
  // Portada tipográfica: un color fuerte por juego y el título lo más grande que entre en la tarjeta.
  var PAL = ['#ef476f', '#f3722c', '#5f4bd8', '#06a77d', '#3a86ff', '#c2185b', '#e76f51', '#8e44ad', '#118ab2', '#2a9d8f', '#d6457a', '#6a4c93', '#0096c7', '#43aa8b'];
  ALL.forEach(function (x, i) { x.j.color = PAL[i % PAL.length]; });
  function fitK(t) {
    var words = t.split(' '), longest = Math.max.apply(null, words.map(function (w) { return w.length; }));
    for (var k = 17; k > 6; k -= .5) {
      if (k * .58 * longest > 84) continue;
      var cpl = Math.floor(84 / (k * .58)), lines = 1, cur = 0;
      words.forEach(function (w) { if (cur && cur + 1 + w.length > cpl) { lines++; cur = w.length; } else cur += (cur ? 1 : 0) + w.length; });
      if (lines * k * 1.04 <= 40) return k;
    }
    return 6;
  }
  function cover(j) {
    return '<div class="cover" style="--c:' + j.color + '"><span class="ct" style="--k:' + fitK(j.titulo) + '">' + esc(j.titulo) + '</span></div>';
  }
  function setCrumbs(list) { crumbs.innerHTML = list.map(function (c, i) { return '<a class="crumb' + (i === list.length - 1 ? ' on' : '') + '" href="' + c[1] + '">' + esc(c[0]) + '</a>'; }).join(''); }
  function pop() {
    var tiles = app.querySelectorAll('.tile,.chip,.panel');
    for (var i = 0; i < tiles.length; i++) tiles[i].animate && tiles[i].animate([{ opacity: 0, transform: 'translateY(16px) scale(.96)' }, { opacity: 1, transform: 'none' }], { duration: 380, delay: Math.min(i, 14) * 35, easing: 'cubic-bezier(.34,1.56,.64,1)', fill: 'backwards' });
  }

  // Al abrir un juego se anota en "Seguir jugando".
  app.addEventListener('click', function (e) {
    var a = e.target.closest && e.target.closest('a.game'); if (!a) return;
    var list = ls.get('portalRecientes', []).filter(function (r) { return !(r.s === a.dataset.slug && r.w === a.dataset.where); });
    list.unshift({ s: a.dataset.slug, w: a.dataset.where, t: Date.now() });
    ls.set('portalRecientes', list.slice(0, 8));
  });

  function home() {
    setCrumbs([['Inicio', '#/']]);
    var rec = ls.get('portalRecientes', []).map(function (r) { return find(r.s, r.w); }).filter(Boolean).slice(0, 4);
    var html = '<h1>¡Hola! ¿A qué jugamos?</h1><p class="sub">Elegí tu colegio y tu clase, o seguí donde lo dejaste.</p>';
    if (rec.length) html += '<h2 style="margin-top:6px">Seguir jugando</h2><div class="grid recent">' + rec.map(function (x) { return card(x, { go: true, where: true }); }).join('') + '</div><h2>Atajos</h2>';
    html += '<div class="bar"><label class="search"><svg viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5" fill="none" stroke="#6b6790" stroke-width="2.6"/><path d="M15.5 15.5 L21 21" stroke="#6b6790" stroke-width="2.6" stroke-linecap="round"/></svg><input id="q" type="search" placeholder="Buscar un juego" autocomplete="off" aria-label="Buscar un juego"><kbd>/</kbd></label>' +
      D.colegios.map(function (c) { return c.clases.map(function (k) { return '<a class="chip" href="#/' + c.id + '/' + k.id + '" data-clase="' + c.id + '/' + k.id + '"><i style="background:' + k.color + '"></i>' + esc(c.nombre + ' · ' + k.nombre) + '</a>'; }).join(''); }).join('') + '</div>';
    html += '<div id="results"></div><div id="schools" class="grid schools">' + D.colegios.map(function (c) {
      var n = c.clases.reduce(function (s, k) { return s + k.juegos.length; }, 0);
      return '<a class="tile school" href="#/' + c.id + '" data-colegio="' + c.id + '" style="background:' + c.color + '"><div class="big">' + esc(c.nombre) + '</div><div class="place">' + esc(c.lugar) + '</div><span class="count">' + plural(n) + '</span>' + schoolArt(c.color) + '</a>';
    }).join('') + '</div>';
    app.innerHTML = html;
    var q = document.getElementById('q'), res = document.getElementById('results'), sch = document.getElementById('schools');
    q.addEventListener('input', function () {
      var t = norm(q.value.trim());
      if (!t) { res.innerHTML = ''; sch.style.display = ''; return; }
      var hits = ALL.filter(function (x) { return norm(x.j.titulo + ' ' + x.j.desc + ' ' + x.c.nombre + ' ' + x.k.nombre).indexOf(t) >= 0; });
      sch.style.display = 'none';
      res.innerHTML = hits.length ? '<div class="grid games" style="margin-bottom:22px">' + hits.map(function (x) { return card(x, { where: true }); }).join('') + '</div>' : '<p class="empty">No hay juegos con ese nombre.</p>';
    });
    document.title = 'Juegos de Informática';
  }
  function school(c) {
    setCrumbs([['Inicio', '#/'], [c.nombre, '#/' + c.id]]);
    app.innerHTML = '<h1>' + esc(c.nombre) + '</h1><p class="sub">' + esc(c.lugar) + ' · Elegí tu clase</p><div class="grid classes">' + c.clases.map(function (k) {
      return '<a class="tile klass" href="#/' + c.id + '/' + k.id + '" data-clase="' + c.id + '/' + k.id + '" style="background:' + k.color + '"><div class="big">' + esc(k.nombre) + '</div><div class="det">' + esc(k.detalle) + '</div>' +
        '<span class="count">' + plural(k.juegos.length) + '</span><div class="stack">' + k.juegos.slice(0, 3).map(function (j) { return '<i style="background:' + j.color + '">' + esc(j.titulo.charAt(0)) + '</i>'; }).join('') + '</div></a>';
    }).join('') + '</div>';
    document.title = c.nombre + ' · Juegos de Informática';
  }
  function klass(c, k) {
    ls.set('portalClase', c.id + '/' + k.id);
    setCrumbs([['Inicio', '#/'], [c.nombre, '#/' + c.id], [k.nombre, '#/' + c.id + '/' + k.id]]);
    app.innerHTML = '<h1>' + esc(c.nombre) + ' · ' + esc(k.nombre) + '</h1><p class="sub">' + esc(k.detalle) + ' · ' + plural(k.juegos.length) + ' · con las teclas 1 a ' + Math.min(9, k.juegos.length) + ' se abre cada juego</p><div class="grid games">' +
      k.juegos.map(function (j, i) { return card({ j: j, c: c, k: k }, { key: i < 9 ? String(i + 1) : '' }); }).join('') + '</div>';
    document.title = c.nombre + ' ' + k.nombre + ' · Juegos de Informática';
  }

  // Sonidos propios del portal, cortos y suaves: un "tic" de vidrio al tocar, un deslizamiento al abrir
  // y cerrar, una campanita cristalina y un "fiuu" de envío. Todo pasa por un filtro y un compresor para que suene limpio.
  var Snd = {
    ac: null, bus: null, nb: null, off: ls.get('portalMute', false),
    ctx: function () {
      if (this.off) return null;
      try {
        if (!this.ac) {
          var a = this.ac = new (window.AudioContext || window.webkitAudioContext)();
          var lp = a.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 9000;
          var comp = a.createDynamicsCompressor(); comp.threshold.value = -20; comp.ratio.value = 3;
          this.bus = a.createGain(); this.bus.gain.value = .9;
          this.bus.connect(lp); lp.connect(comp); comp.connect(a.destination);
          var n = a.createBuffer(1, a.sampleRate * .5, a.sampleRate), d = n.getChannelData(0);
          for (var i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
          this.nb = n;
        }
        if (this.ac.state === 'suspended') this.ac.resume();
      } catch (e) { return null; }
      return this.ac;
    },
    // Nota con ataque suave y cola de campana (dos parciales).
    bell: function (f, t, d, v) {
      var a = this.ctx(); if (!a) return;
      var s = a.currentTime + (t || 0);
      [[1, 1], [2.76, .18], [5.4, .05]].forEach(function (p) {
        var o = a.createOscillator(), g = a.createGain();
        o.type = 'sine'; o.frequency.value = f * p[0];
        g.gain.setValueAtTime(.0001, s); g.gain.linearRampToValueAtTime(v * p[1], s + .006); g.gain.exponentialRampToValueAtTime(.0001, s + d / p[0] * 1.2);
        o.connect(g); g.connect(Snd.bus); o.start(s); o.stop(s + d + .05);
      });
    },
    // Ruido filtrado: el "tic" de vidrio y el "fiuu".
    air: function (t, d, f0, f1, v, q) {
      var a = this.ctx(); if (!a) return;
      var s = a.currentTime + (t || 0), src = a.createBufferSource(), bp = a.createBiquadFilter(), g = a.createGain();
      src.buffer = this.nb; bp.type = 'bandpass'; bp.Q.value = q || 1.4;
      bp.frequency.setValueAtTime(f0, s); bp.frequency.exponentialRampToValueAtTime(f1, s + d);
      g.gain.setValueAtTime(.0001, s); g.gain.linearRampToValueAtTime(v, s + Math.min(.01, d / 3)); g.gain.exponentialRampToValueAtTime(.0001, s + d);
      src.connect(bp); bp.connect(g); g.connect(this.bus); src.start(s); src.stop(s + d + .05);
    },
    glide: function (f0, f1, t, d, v) {
      var a = this.ctx(); if (!a) return;
      var s = a.currentTime + (t || 0), o = a.createOscillator(), g = a.createGain();
      o.type = 'sine'; o.frequency.setValueAtTime(f0, s); o.frequency.exponentialRampToValueAtTime(f1, s + d);
      g.gain.setValueAtTime(.0001, s); g.gain.linearRampToValueAtTime(v, s + .015); g.gain.exponentialRampToValueAtTime(.0001, s + d);
      o.connect(g); g.connect(this.bus); o.start(s); o.stop(s + d + .05);
    },
    pop: function () { this.air(0, .035, 4200, 2600, .22, 2.5); this.bell(2350, 0, .07, .035); },
    open: function () { this.glide(520, 980, 0, .16, .05); this.air(0, .18, 900, 3800, .05, .8); },
    close: function () { this.glide(900, 480, 0, .14, .045); this.air(0, .14, 3200, 800, .04, .8); },
    ding: function () { this.bell(1568, 0, .9, .07); this.bell(2093, .11, 1.1, .055); },
    ok: function () { this.air(0, .32, 600, 6000, .09, .7); this.glide(660, 1320, .04, .2, .05); this.bell(1760, .24, 1.2, .07); this.bell(2637, .33, 1.4, .045); },
    no: function () { this.bell(330, 0, .25, .07); this.bell(294, .12, .3, .06); },
  };
  var muteBtn = document.createElement('button');
  muteBtn.className = 'mute'; muteBtn.type = 'button'; muteBtn.setAttribute('aria-label', 'Sonido');
  var drawMute = function () { muteBtn.innerHTML = '<svg viewBox="0 0 24 24"><path d="M4 9h4l5-4v14l-5-4H4z" fill="#24204a"/>' + (Snd.off ? '<path d="M16 9l5 6M21 9l-5 6" stroke="#ef476f" stroke-width="2.4" stroke-linecap="round"/>' : '<path d="M16 8.5a5 5 0 0 1 0 7M18.5 6a8.5 8.5 0 0 1 0 12" stroke="#24204a" stroke-width="2.2" fill="none" stroke-linecap="round"/>') + '</svg>'; };
  drawMute();
  muteBtn.addEventListener('click', function () { Snd.off = !Snd.off; ls.set('portalMute', Snd.off); drawMute(); Snd.pop(); });
  document.querySelector('header').appendChild(muteBtn);
  // Cada tarjeta o botón del portal hace "pop" al tocarlo.
  document.addEventListener('click', function (e) { if (e.target.closest && e.target.closest('a.tile,a.chip,a.crumb,a.logo')) Snd.pop(); });
  // Papelitos de festejo que salen desde un elemento.
  function confetti(from) {
    var r = from.getBoundingClientRect(), cx = r.left + r.width / 2, cy = r.top + r.height / 2, cols = ['#ff7a59', '#ffd23f', '#4fc3f7', '#9b7bff', '#2fbf8f', '#ef476f'];
    for (var i = 0; i < 46; i++) {
      var s = document.createElement('i'); s.className = 'confeti';
      s.style.cssText = 'left:' + cx + 'px;top:' + cy + 'px;background:' + cols[i % cols.length] + (i % 3 ? '' : ';border-radius:50%');
      document.body.appendChild(s);
      var a = Math.random() * Math.PI * 2, d = 90 + Math.random() * 200, dx = Math.cos(a) * d, dy = Math.sin(a) * d - 120;
      var an = s.animate([{ transform: 'translate(-50%,-50%) rotate(0deg) scale(1)', opacity: 1 }, { transform: 'translate(' + dx + 'px,' + dy + 'px) rotate(' + (Math.random() * 720 - 360) + 'deg) scale(1)', opacity: 1, offset: .55 }, { transform: 'translate(' + dx * 1.15 + 'px,' + (dy + 260) + 'px) rotate(' + (Math.random() * 900) + 'deg) scale(.6)', opacity: 0 }], { duration: 1300 + Math.random() * 700, easing: 'cubic-bezier(.2,.7,.4,1)' });
      an.onfinish = (function (el) { return function () { el.remove(); }; })(s);
    }
  }

  // ----- Ideas: ventana que aparece en el inicio. Las ideas van a un formulario privado del profe.
  var ideaUI = null;
  function ideas() {
    if (ideaUI || !R.form) return;
    var wrap = document.createElement('div');
    wrap.innerHTML = '<button class="ideaBtn" id="ideaBtn" type="button"><svg viewBox="0 0 24 24"><path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-3.6 10.8c.7.5 1.1 1.3 1.1 2.2h5c0-.9.4-1.7 1.1-2.2A6 6 0 0 0 12 3z" fill="#ffd23f" stroke="#24204a" stroke-width="1.8" stroke-linejoin="round"/></svg><span>¿Tenés una idea?</span></button>' +
      '<div class="toast" id="ideaToast" hidden><b>¿Se te ocurre un juego nuevo o algo que te gustaría aprender?</b><div class="row"><button class="send" type="button" data-open>Contar mi idea</button><button class="ghost" type="button" data-close>Ahora no</button></div></div>' +
      '<div class="modal" id="ideaModal" hidden><form class="box" id="fIdea" novalidate><button class="x" type="button" data-close aria-label="Cerrar">×</button><h3>Tengo una idea</h3>' +
      '<div class="seg"><label><input type="radio" name="tipo" value="Juego nuevo" checked><span>Un juego nuevo</span></label><label><input type="radio" name="tipo" value="Algo para aprender"><span>Algo para aprender</span></label></div>' +
      '<textarea name="idea" maxlength="500" required placeholder="Contá tu idea: de qué se trata, qué habría que hacer…"></textarea>' +
      '<div class="row"><button class="send" type="submit">Mandar idea</button><span class="thanks" aria-live="polite"></span></div><p class="note">La lee el profe. No hace falta que pongas tu nombre.</p>' +
      '<div class="done" hidden><div class="bulb"><svg viewBox="0 0 24 24"><path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-3.6 10.8c.7.5 1.1 1.3 1.1 2.2h5c0-.9.4-1.7 1.1-2.2A6 6 0 0 0 12 3z" fill="#ffd23f" stroke="#24204a" stroke-width="1.6" stroke-linejoin="round"/></svg><svg class="chk" viewBox="0 0 24 24"><circle cx="12" cy="12" r="11" fill="#2fbf8f"/><path d="M7 12.5l3.2 3.2L17.5 8.5" stroke="#fff" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg></div><b>¡Idea enviada!</b><span>Le llegó al profe. ¡Gracias por pensar!</span></div></form></div>';
    document.body.appendChild(wrap);
    var btn = document.getElementById('ideaBtn'), toast = document.getElementById('ideaToast'), modal = document.getElementById('ideaModal'), form = document.getElementById('fIdea');
    var done = form.querySelector('.done');
    var open = function () { toast.hidden = true; done.hidden = true; modal.hidden = false; Snd.open(); setTimeout(function () { form.idea.focus(); }, 50); };
    var close = function () { if (!modal.hidden) Snd.close(); modal.hidden = true; toast.hidden = true; };
    btn.addEventListener('click', open);
    wrap.addEventListener('click', function (e) { if (e.target.closest('[data-open]')) open(); else if (e.target.closest('[data-close]') || e.target === modal) close(); });
    document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && !modal.hidden) { e.stopImmediatePropagation(); close(); } }, true);
    form.addEventListener('submit', function (e) {
      e.preventDefault();
      var out = form.querySelector('.thanks'), send = form.querySelector('.send');
      var today = new Date().toDateString(), q = ls.get('portalEnvios', { d: today, n: 0 });
      if (q.d !== today) q = { d: today, n: 0 };
      if (q.n >= 5) { out.textContent = 'Por hoy ya está. ¡Gracias!'; return; }
      var fd = new FormData(), last = ls.get('portalClase', '');
      var val = { tipo: form.querySelector('input[name=tipo]:checked').value, clase: last ? last.replace('/', ' ') : 'sin elegir', idea: form.idea.value.trim() };
      if (!val.idea) {
        out.textContent = 'Escribí tu idea antes de mandarla.'; out.className = 'thanks warn'; Snd.no();
        form.idea.classList.remove('shake'); void form.idea.offsetWidth; form.idea.classList.add('shake'); form.idea.focus();
        return;
      }
      out.className = 'thanks';
      Object.keys(R.campos).forEach(function (k) { if (R.campos[k]) fd.append('entry.' + R.campos[k], val[k] || ''); });
      send.disabled = true; out.textContent = 'Mandando…';
      fetch('https://docs.google.com/forms/d/e/' + R.form + '/formResponse', { method: 'POST', mode: 'no-cors', body: fd }).then(function () {
        q.n++; ls.set('portalEnvios', q);
        out.textContent = ''; form.idea.value = '';
        done.hidden = false; Snd.ok(); confetti(done.querySelector('.bulb'));
        setTimeout(function () { send.disabled = false; close(); }, 2800);
      }, function () { send.disabled = false; Snd.no(); out.textContent = 'No se pudo mandar. Probá de nuevo.'; });
    });
    ideaUI = { btn: btn, toast: toast, modal: modal };
  }
  function showIdeas(onHome) {
    ideas(); if (!ideaUI) return;
    ideaUI.btn.hidden = !onHome;
    if (!onHome) { ideaUI.toast.hidden = true; ideaUI.modal.hidden = true; return; }
    // La invitación aparece sola una vez por día en cada compu.
    var today = new Date().toDateString();
    if (ls.get('portalInvitacion', '') !== today) setTimeout(function () { if (!location.hash.replace(/^#\/?/, '') && ideaUI.modal.hidden) { ideaUI.toast.hidden = false; Snd.ding(); ls.set('portalInvitacion', today); } }, 3500);
  }

  function render() {
    var parts = location.hash.replace(/^#\/?/, '').split('/').filter(Boolean);
    var c = D.colegios.filter(function (x) { return x.id === parts[0]; })[0];
    var k = c && c.clases.filter(function (x) { return x.id === parts[1]; })[0];
    window.scrollTo(0, 0);
    if (k) klass(c, k); else if (c) school(c); else home();
    showIdeas(!k && !c);
    pop();
  }
  // Atajos de teclado: "/" busca; en una clase, 1 a 9 abren cada juego; Escape vuelve atrás.
  document.addEventListener('keydown', function (e) {
    var tag = (e.target.tagName || '').toLowerCase();
    if (tag === 'input' || tag === 'textarea' || tag === 'select') { if (e.key === 'Escape') e.target.blur(); return; }
    if (e.ctrlKey || e.metaKey || e.altKey) return;
    if (e.key === '/') { var q = document.getElementById('q'); if (q) { e.preventDefault(); q.focus(); } }
    else if (/^[1-9]$/.test(e.key)) { var g = app.querySelectorAll('a.game')[+e.key - 1]; if (g && location.hash.split('/').length > 2) g.click(); }
    else if (e.key === 'Escape') { var parts = location.hash.replace(/^#\/?/, '').split('/').filter(Boolean); parts.pop(); location.hash = '#/' + parts.join('/'); }
  });
  window.addEventListener('hashchange', render);
  render();
})();
</script>
</body>
</html>
