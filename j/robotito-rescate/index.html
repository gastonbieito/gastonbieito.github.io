<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Robotito al rescate · Colegio Sagrado Corazón</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:#1d2340;font-family:"Segoe UI","Helvetica Neue",Roboto,Arial,sans-serif;color:#2b2b3a;user-select:none;-webkit-user-select:none;cursor:default}
#marco{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
#stage{position:relative;width:1280px;height:720px;flex:none;overflow:hidden;background:#8fd3ff}
.pant{position:absolute;inset:0;display:none}
.pant.on{display:block}
button{font-family:inherit;border:0;background:none;cursor:pointer;outline:none;color:inherit}
svg{display:block}
.btnR{width:84px;height:84px;border-radius:50%;background:#fff;box-shadow:0 6px 0 rgba(0,0,0,.15),0 10px 24px rgba(0,0,0,.12);display:flex;align-items:center;justify-content:center;transition:transform .12s}
.btnR:hover{transform:translateY(-3px)}
.btnR:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(0,0,0,.15)}
.btnR svg{width:46px;height:46px}

/* cielo y nubes */
.cielo{position:absolute;inset:0;background:linear-gradient(#7ccbff,#c9ecff)}
.nubeF{position:absolute;background:#fff;border-radius:60px;opacity:.9;animation:nubeF 60s linear infinite}
.nubeF:before,.nubeF:after{content:"";position:absolute;background:#fff;border-radius:50%}
.nubeF:before{width:60%;height:140%;left:15%;top:-60%}
.nubeF:after{width:40%;height:110%;left:50%;top:-40%}
@keyframes nubeF{from{transform:translateX(-300px)}to{transform:translateX(1600px)}}

/* ---------- inicio: elegir robot ---------- */
#inicio .titulo{position:absolute;left:0;right:0;top:40px;text-align:center}
#inicio .titulo h1{font-size:74px;font-weight:900;color:#fff;letter-spacing:-2px;text-shadow:0 6px 0 #3d8fd9,0 12px 30px rgba(0,0,0,.15)}
#inicio .titulo h1 span{color:#ffd43b}
#robots{position:absolute;left:0;right:0;top:230px;display:flex;justify-content:center;gap:34px}
.robCard{width:220px;height:270px;border-radius:36px;background:rgba(255,255,255,.75);display:flex;align-items:center;justify-content:center;transition:transform .2s,background .2s,box-shadow .2s;box-shadow:0 8px 0 rgba(0,0,0,.08)}
.robCard svg{width:190px;height:190px}
.robCard:hover,.robCard.sel{transform:translateY(-10px) scale(1.04);background:#fff;box-shadow:0 14px 0 rgba(0,0,0,.1),0 0 0 8px #ffd43b}
.robCard.sel .rob{animation:saltito .6s ease-in-out infinite}
#marcaIni{position:absolute;left:24px;bottom:18px;display:flex;align-items:center;gap:10px;font-size:14px;font-weight:700;color:#2b5d8a;background:rgba(255,255,255,.8);padding:8px 16px 8px 8px;border-radius:30px}
#marcaIni svg{width:40px;height:40px}
.manito{position:absolute;width:90px;height:90px;pointer-events:none;z-index:60;filter:drop-shadow(0 6px 8px rgba(0,0,0,.25));transition:left .6s cubic-bezier(.4,0,.2,1),top .6s cubic-bezier(.4,0,.2,1)}
.manito.toca svg{animation:toca .5s ease-in-out}
@keyframes toca{50%{transform:scale(.82) translateY(6px)}}

/* ---------- tutorial de flechas ---------- */
#tuto .tablero{position:absolute;left:290px;top:110px;width:700px;height:460px;border-radius:40px;background:#fff;box-shadow:0 10px 0 rgba(0,0,0,.08)}
#teclado{position:absolute;left:390px;top:300px;width:500px;height:250px}
.tecla{position:absolute;width:140px;height:110px;border-radius:24px;background:#eef1f7;box-shadow:0 10px 0 #c9cfdc;display:flex;align-items:center;justify-content:center;transition:background .2s,transform .1s,box-shadow .1s}
.tecla svg{width:60px;height:60px}
.tecla.brilla{background:#ffd43b;box-shadow:0 10px 0 #e0a800,0 0 0 10px rgba(255,212,59,.35);animation:brillaT 1s ease-in-out infinite}
@keyframes brillaT{50%{box-shadow:0 10px 0 #e0a800,0 0 0 22px rgba(255,212,59,.15)}}
.tecla.ok{background:#69db7c;box-shadow:0 4px 0 #2f9e44;transform:translateY(6px)}
.tecla.mal{animation:sacude .35s}
@keyframes sacude{20%,60%{transform:translateX(-10px)}40%,80%{transform:translateX(10px)}}
#tutoRobot{position:absolute;width:160px;height:160px;left:560px;top:120px;transition:transform .35s cubic-bezier(.3,1.5,.5,1)}
#tutoPuntos{position:absolute;left:0;right:0;top:610px;display:flex;justify-content:center;gap:16px}
#tutoPuntos i{width:30px;height:30px;border-radius:50%;background:rgba(255,255,255,.6);transition:background .3s,transform .3s}
#tutoPuntos i.ok{background:#ffd43b;transform:scale(1.2)}

/* ---------- mapa ---------- */
#mapa .mar{position:absolute;left:0;right:0;top:250px;bottom:0;background:linear-gradient(#5ec2f2,#3aa4e0)}
.ola{position:absolute;left:-40px;right:-40px;top:240px;height:30px;background:radial-gradient(circle at 20px -6px,transparent 22px,#5ec2f2 23px) 0 0/40px 30px repeat-x;animation:olaM 4s linear infinite}
@keyframes olaM{to{transform:translateX(40px)}}
.isla{position:absolute;top:150px;width:380px;height:540px}
.isla .tierra{position:absolute;left:10px;right:10px;top:70px;bottom:20px;border-radius:50% 50% 46% 46%/40% 40% 60% 60%;box-shadow:0 14px 0 rgba(0,0,0,.12)}
.isla .cartelI{position:absolute;left:50%;top:0;transform:translateX(-50%);width:128px;height:128px;border-radius:50%;background:#fff;box-shadow:0 8px 0 rgba(0,0,0,.12);display:flex;align-items:center;justify-content:center}
.isla .cartelI svg{width:96px;height:96px}
.isla .curso{position:absolute;left:50%;top:132px;transform:translateX(-50%);font-size:15px;font-weight:800;color:#fff;background:rgba(0,0,0,.25);padding:3px 12px;border-radius:12px;white-space:nowrap}
.nivBtn{position:absolute;width:82px;height:82px;border-radius:50%;background:#fff;box-shadow:0 7px 0 rgba(0,0,0,.18);display:flex;align-items:center;justify-content:center;transition:transform .15s}
.nivBtn:hover{transform:translateY(-4px) scale(1.06)}
.nivBtn svg.an{width:70px;height:70px}
.nivBtn.bloq{background:rgba(255,255,255,.55);cursor:default}
.nivBtn.bloq:hover{transform:none}
.nivBtn.bloq svg{width:34px;height:34px}
.nivBtn.prox{box-shadow:0 7px 0 rgba(0,0,0,.18),0 0 0 7px #ffd43b;animation:saltito 1s ease-in-out infinite}
.nivBtn .silu{filter:brightness(0) opacity(.25)}
.nivBtn .est{position:absolute;bottom:-12px;left:50%;transform:translateX(-50%);display:flex;gap:1px}
.nivBtn .est i{width:20px;height:20px;display:block}
@keyframes saltito{50%{transform:translateY(-8px)}}
#bRefugio{position:absolute;right:26px;top:22px}
#bPractica{position:absolute;right:126px;top:22px}
#robMapa{position:absolute;left:30px;top:16px;width:110px;height:110px}

/* ---------- nivel ---------- */
#nivel .fondoN{position:absolute;inset:0}
#tablero{position:absolute;border-radius:28px;padding:14px;box-shadow:0 12px 0 rgba(0,0,0,.12)}
.celda{position:absolute;border-radius:14px}
.cosa{position:absolute;display:flex;align-items:center;justify-content:center;transition:transform .3s,opacity .3s}
.cosa svg{width:100%;height:100%}
.cosa.estrella svg{animation:giraE 3s ease-in-out infinite}
@keyframes giraE{0%,100%{transform:rotate(-10deg) scale(1)}50%{transform:rotate(10deg) scale(1.1)}}
.cosa.llave svg{animation:saltito 1.2s ease-in-out infinite}
.cosa.agarrada{transform:scale(1.8);opacity:0}
.cosa.animal .an{animation:pide 1.4s ease-in-out infinite}
@keyframes pide{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px) rotate(-3deg)}}
.cosa.animal .ayuda{position:absolute;right:-6px;top:-10px;width:40%;height:40%;animation:latido .8s ease-in-out infinite}
@keyframes latido{50%{transform:scale(1.25)}}
.cosa .jaula{position:absolute;inset:-4%;transition:transform .5s,opacity .5s}
.cosa .jaula.abre{transform:translateY(-80%) rotate(-20deg);opacity:0}
.cosa.feliz .an{animation:festejaA .7s ease-in-out infinite}
@keyframes festejaA{0%,100%{transform:translateY(0) scale(1)}40%{transform:translateY(-30px) scale(.95,1.08)}70%{transform:translateY(0) scale(1.08,.92)}}
.agua{background:#5ec2f2;overflow:hidden}
.agua:before{content:"";position:absolute;left:-30px;right:-30px;top:30%;height:14px;background:radial-gradient(circle at 10px -3px,transparent 11px,rgba(255,255,255,.6) 12px) 0 0/20px 14px repeat-x;animation:olaM 2s linear infinite}
.agua:after{content:"";position:absolute;left:-30px;right:-30px;top:62%;height:14px;background:radial-gradient(circle at 10px -3px,transparent 11px,rgba(255,255,255,.45) 12px) 0 0/20px 14px repeat-x;animation:olaM 2.6s linear infinite reverse}
#robot{position:absolute;transition:left .3s cubic-bezier(.4,.1,.3,1),top .3s cubic-bezier(.4,.1,.3,1);z-index:5}
#robot .giro{width:100%;height:100%;transition:transform .2s}
#robot .rob{width:100%;height:100%}
#robot.choca .giro{animation:choca .4s}
@keyframes choca{20%{transform:translateX(-8px) rotate(-6deg)}40%{transform:translateX(8px) rotate(6deg)}60%{transform:translateX(-5px)}80%{transform:translateX(4px)}}
#robot.festeja .rob{animation:festejaA .6s ease-in-out infinite}
#robot .llaveR{position:absolute;right:-8%;top:-8%;width:38%;height:38%;display:none}
#robot.conLlave .llaveR{display:block}
.huella{position:absolute;border-radius:50%;background:rgba(255,255,255,.55);transform:scale(.4);animation:huella 1.8s ease-out forwards;pointer-events:none}
@keyframes huella{to{transform:scale(.15);opacity:0}}
.pista{position:absolute;border-radius:50%;background:#ffd43b;opacity:.0;animation:pistaA 1.2s ease-in-out infinite;pointer-events:none}
@keyframes pistaA{0%,100%{opacity:.25;transform:scale(.5)}50%{opacity:.9;transform:scale(.8)}}

#barraSup{position:absolute;left:24px;right:24px;top:18px;height:84px;pointer-events:none}
#barraSup .btnR{pointer-events:auto;position:absolute;top:0}
#bCasa{left:0}
#bRepetir{right:0}
#metaN{position:absolute;left:50%;top:4px;transform:translateX(-50%);height:76px;padding:0 26px 0 12px;border-radius:40px;background:#fff;box-shadow:0 6px 0 rgba(0,0,0,.12);display:flex;align-items:center;gap:12px}
#metaN .an{width:62px;height:62px}
#metaN .est{display:flex;gap:4px}
#metaN .est i{width:36px;height:36px;display:block;opacity:.22;filter:grayscale(1);transition:opacity .3s,filter .3s,transform .3s}
#metaN .est i.si{opacity:1;filter:none;transform:scale(1.15)}
#metaN .llaveM{width:44px;height:44px;opacity:.25;filter:grayscale(1)}
#metaN .llaveM.si{opacity:1;filter:none}

/* panel de flechas y programa */
#panelD{position:absolute;right:30px;top:120px;width:340px;bottom:24px}
#pad{position:absolute;left:30px;top:20px;width:280px;height:280px}
.flecha{position:absolute;width:92px;height:92px;border-radius:24px;background:#fff;box-shadow:0 8px 0 rgba(0,0,0,.15);display:flex;align-items:center;justify-content:center;transition:transform .1s,background .2s,box-shadow .1s}
.flecha svg{width:52px;height:52px}
.flecha.apreta{transform:translateY(6px);box-shadow:0 2px 0 rgba(0,0,0,.15);background:#ffe066}
.flecha.pistaF{animation:pistaFl 1s ease-in-out infinite}
@keyframes pistaFl{0%,100%{box-shadow:0 8px 0 rgba(0,0,0,.15),0 0 0 0 rgba(255,212,59,.9)}50%{box-shadow:0 8px 0 rgba(0,0,0,.15),0 0 0 14px rgba(255,212,59,.0);background:#fff3bf}}
#fArr{left:94px;top:0}#fIzq{left:0;top:94px}#fDer{left:188px;top:94px}#fAba{left:94px;top:188px}
#centroPad{position:absolute;left:94px;top:94px;width:92px;height:92px;border-radius:50%;display:flex;align-items:center;justify-content:center}
#centroPad svg{width:84px;height:84px}
#programa{position:absolute;left:0;right:0;top:282px;display:none}
#programa.on{display:block}
#bandeja{position:relative;width:340px;height:196px;border-radius:24px;background:rgba(255,255,255,.9);box-shadow:inset 0 4px 0 rgba(0,0,0,.06);padding:12px}
.slot{position:absolute;width:60px;height:60px;border-radius:16px;background:#eef1f7;border:3px dashed #cfd5e2}
.carta{position:absolute;width:60px;height:60px;border-radius:16px;background:#7c6cf2;box-shadow:0 5px 0 #5a4bd1;display:flex;align-items:center;justify-content:center;animation:cartaIn .25s cubic-bezier(.3,1.6,.5,1)}
.carta svg{width:36px;height:36px}
.carta.activa{background:#ffd43b;box-shadow:0 5px 0 #e0a800,0 0 0 5px rgba(255,212,59,.4);transform:translateY(-4px)}
.carta.malC{background:#ff6b6b;box-shadow:0 5px 0 #e03131}
@keyframes cartaIn{from{transform:scale(.3)}to{transform:scale(1)}}
#botonesP{display:flex;gap:14px;margin-top:12px;align-items:center}
#bPlay{width:150px;height:84px;border-radius:42px;background:#40c057;box-shadow:0 8px 0 #2b8a3e;display:flex;align-items:center;justify-content:center;transition:transform .1s}
#bPlay svg{width:46px;height:46px}
#bPlay:active,#bPlay.apreta{transform:translateY(6px);box-shadow:0 2px 0 #2b8a3e}
#bPlay.pistaF{animation:pistaPlay 1s ease-in-out infinite}
@keyframes pistaPlay{50%{box-shadow:0 8px 0 #2b8a3e,0 0 0 16px rgba(64,192,87,.3)}}
#bBorrar,#bLimpiar{width:76px;height:76px;border-radius:50%;background:#fff;box-shadow:0 7px 0 rgba(0,0,0,.15);display:flex;align-items:center;justify-content:center}
#bBorrar svg,#bLimpiar svg{width:40px;height:40px}

/* ganaste */
#ganaste{position:absolute;inset:0;background:rgba(20,30,60,.55);display:none;z-index:40}
#ganaste.on{display:block;animation:fadeIn .3s}
@keyframes fadeIn{from{opacity:0}}
#gCaja{position:absolute;left:340px;top:90px;width:600px;height:540px;border-radius:44px;background:#fff;box-shadow:0 16px 0 rgba(0,0,0,.12);animation:popIn .5s cubic-bezier(.3,1.5,.5,1)}
@keyframes popIn{from{transform:scale(.5);opacity:0}}
#gAnimal{position:absolute;left:190px;top:30px;width:220px;height:220px}
#gAnimal .an{animation:festejaA .7s ease-in-out infinite}
#gEst{position:absolute;left:0;right:0;top:270px;display:flex;justify-content:center;gap:16px}
#gEst i{width:96px;height:96px;display:block;opacity:.18;filter:grayscale(1);transform:scale(.6);transition:all .45s cubic-bezier(.3,1.7,.5,1)}
#gEst i.si{opacity:1;filter:none;transform:scale(1)}
#gBot{position:absolute;left:0;right:0;bottom:40px;display:flex;justify-content:center;gap:26px;align-items:center}
#gSig{width:150px;height:100px;border-radius:50px;background:#40c057;box-shadow:0 9px 0 #2b8a3e;display:flex;align-items:center;justify-content:center}
#gSig svg{width:60px;height:60px}
#gSig{animation:latido 1.2s ease-in-out infinite}

/* refugio */
#refugio .pasto{position:absolute;left:0;right:0;bottom:0;height:300px;background:linear-gradient(#8ddc72,#5cbf4a)}
#refAnimales{position:absolute;left:150px;right:150px;top:140px;display:flex;flex-wrap:wrap;gap:12px;justify-content:center}
.refA{width:128px;height:128px;border-radius:28px;background:rgba(255,255,255,.7);display:flex;align-items:center;justify-content:center}
.refA svg{width:110px;height:110px}
.refA.no svg{filter:brightness(0) opacity(.18)}
.refA.si{cursor:pointer}
.refA.si .an{animation:pide 1.6s ease-in-out infinite}
.refA.salta .an{animation:festejaA .6s ease-in-out 2}
#bVolverRef{position:absolute;left:24px;top:22px}

/* docente */
#bloqueo{position:absolute;inset:0;background:rgba(10,15,35,.75);z-index:90;display:none}
#bloqueo.on{display:block}
#pinCaja{position:absolute;left:440px;top:80px;width:400px;height:560px;border-radius:32px;background:#fff;padding:26px;text-align:center}
#pinCaja h2{font-size:22px;color:#2b2b3a}
#pinPuntos{display:flex;justify-content:center;gap:14px;margin:18px 0 20px}
#pinPuntos i{width:22px;height:22px;border-radius:50%;background:#e3e7f0}
#pinPuntos i.si{background:#7c6cf2}
#pinPuntos.mal{animation:sacude .35s}
#pinTeclas{display:grid;grid-template-columns:repeat(3,96px);gap:12px;justify-content:center}
#pinTeclas button{height:74px;border-radius:18px;background:#eef1f7;font-size:30px;font-weight:800;color:#2b2b3a}
#pinTeclas button:active{background:#d9def0}
#docPanel{position:absolute;left:390px;top:70px;width:500px;height:580px;border-radius:32px;background:#fff;padding:30px;display:none}
#docPanel.on{display:block}
#docPanel h2{font-size:24px;margin-bottom:6px}
#docPanel p{font-size:14px;color:#666;margin-bottom:18px}
.docB{display:block;width:100%;height:56px;border-radius:16px;background:#eef1f7;font-size:17px;font-weight:700;margin-bottom:12px;text-align:left;padding:0 20px;color:#2b2b3a}
.docB.prim{background:#7c6cf2;color:#fff}
.docB.peligro{background:#ffe3e3;color:#c92a2a}
#salida{position:absolute;inset:0;background:#1d2340;z-index:95;display:none;color:#fff;text-align:center;padding-top:260px}
#salida.on{display:block}
#salida h2{font-size:40px}
#salida p{font-size:22px;opacity:.8;margin-top:14px}
#pantallaC{position:absolute;inset:0;background:rgba(20,30,60,.7);z-index:85;display:none;align-items:center;justify-content:center}
#pantallaC.on{display:flex}
#pantallaC button{width:200px;height:200px;border-radius:50%;background:#40c057;box-shadow:0 12px 0 #2b8a3e;display:flex;align-items:center;justify-content:center;animation:latido 1.2s ease-in-out infinite}
#pantallaC svg{width:100px;height:100px}
#esquina{position:absolute;left:0;top:0;width:40px;height:40px;z-index:80}
#fx{position:absolute;inset:0;pointer-events:none;z-index:70}

/* animales (los del Teclado mágico) */
.an .ojo{transform-box:fill-box;transform-origin:center;animation:parpadea 3.7s infinite}
@keyframes parpadea{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
.an .ala{transform-box:fill-box;transform-origin:50% 100%;animation:ala .12s linear infinite}
@keyframes ala{50%{transform:scaleY(.75)}}
.an .chorro{transform-box:fill-box;transform-origin:50% 100%;animation:chorro .8s ease-in-out infinite}
@keyframes chorro{50%{transform:scaleY(1.25)}}
.an .pelota{transform-box:fill-box;transform-origin:center;animation:pelota 1s ease-in-out infinite}
@keyframes pelota{50%{transform:translateY(-10px) rotate(180deg)}}
.an .lengua{transform-box:fill-box;transform-origin:50% 0;animation:lengua .5s ease-in-out infinite}
@keyframes lengua{50%{transform:scaleY(1.2)}}
.rob .antena{transform-box:fill-box;transform-origin:50% 100%;animation:antena 2s ease-in-out infinite}
@keyframes antena{0%,100%{transform:rotate(-6deg)}50%{transform:rotate(6deg)}}
.rob .ojosR{transform-box:fill-box;transform-origin:center;animation:parpadea 3.2s infinite}
.rob .luz{animation:luzR 1.4s ease-in-out infinite}
@keyframes luzR{50%{fill:#ff6b6b}}
</style>
</head>
<body>
<div id="marco"><div id="stage">

<div id="inicio" class="pant on">
  <div class="cielo"></div>
  <div class="nubeF" style="width:180px;height:56px;top:120px;animation-delay:-10s"></div>
  <div class="nubeF" style="width:120px;height:40px;top:560px;animation-delay:-35s;animation-duration:80s"></div>
  <div class="titulo"><h1>Robotito <span>al rescate</span></h1></div>
  <div id="robots"></div>
  <div id="marcaIni"></div>
</div>

<div id="tuto" class="pant">
  <div class="cielo"></div>
  <div class="tablero"></div>
  <div id="tutoRobot"></div>
  <div id="teclado"></div>
  <div id="tutoPuntos"></div>
</div>

<div id="mapa" class="pant">
  <div class="cielo"></div>
  <div class="nubeF" style="width:160px;height:50px;top:70px;animation-delay:-20s"></div>
  <div class="nubeF" style="width:110px;height:36px;top:150px;animation-delay:-45s;animation-duration:90s"></div>
  <div class="mar"></div><div class="ola"></div>
  <div id="islas"></div>
  <div id="robMapa"></div>
  <button class="btnR" id="bPractica" aria-label="Practicar flechas"></button>
  <button class="btnR" id="bRefugio" aria-label="Refugio"></button>
</div>

<div id="nivel" class="pant">
  <div class="fondoN" id="fondoN"></div>
  <div id="tablero"></div>
  <div id="barraSup">
    <button class="btnR" id="bCasa" aria-label="Mapa"></button>
    <div id="metaN"></div>
    <button class="btnR" id="bRepetir" aria-label="Empezar de nuevo"></button>
  </div>
  <div id="panelD">
    <div id="pad">
      <button class="flecha" id="fArr" data-d="arr"></button>
      <button class="flecha" id="fIzq" data-d="izq"></button>
      <div id="centroPad"></div>
      <button class="flecha" id="fDer" data-d="der"></button>
      <button class="flecha" id="fAba" data-d="aba"></button>

  var cl = clave(L.i, L.n); P.est[cl] = Math.max(P.est[cl] || 0, est); P.resc[L.def.an] = true; guardar();
  var a = DICHO[L.def.an];
  hablar('¡Rescataste ' + (a[0] === 'el' ? 'al ' : 'a la ') + a[1] + '! ¡Muy bien!');
  $('gAnimal').innerHTML = animalSVG(idxAnimal(L.def.an));
  var g = '', i; for (i = 0; i < 3; i++) g += '<i>' + EST_ON + '</i>'; $('gEst').innerHTML = g;
  $('gCasa').innerHTML = IC.casa; $('gOtra').innerHTML = IC.repetir; $('gSig').innerHTML = IC.play;
  $('ganaste').className = 'on'; FASE = 'ganaste';
  sfx('fiesta'); lluvia(640, 200, 120);
  for (i = 0; i < est; i++) (function (i) { setTimeout(function () { $('gEst').children[i].className = 'si'; sfx('brillo'); notaMagica(true); lluvia(480 + i * 112, 360, 14, 'estrella', ['#ffd43b']); }, 600 + i * 450); })(i);
}
function siguienteNivel() {
  var n = L.n + 1;
  if (n >= L.is.niveles.length) irMapa(true);
  else jugar(L.i, n);
}

/* ---------- refugio ---------- */
function irRefugio() {
  FASE = 'refugio'; pantalla('refugio');
  var s = '', i, j, todos = [];
  for (i = 0; i < ISLAS.length; i++) for (j = 0; j < ISLAS[i].niveles.length; j++) todos.push(ISLAS[i].niveles[j].an);
  for (i = 0; i < todos.length; i++) s += '<div class="refA ' + (P.resc[todos[i]] ? 'si' : 'no') + '" data-a="' + todos[i] + '">' + animalSVG(idxAnimal(todos[i])) + '</div>';
  $('refAnimales').innerHTML = s;
  var cs = $('refAnimales').children;
  for (i = 0; i < cs.length; i++) if (cs[i].className.indexOf('si') >= 0) cs[i].onclick = function () { var e = this; voz(ANIMALES[idxAnimal(e.getAttribute('data-a'))].voz); e.className = 'refA si'; void e.offsetWidth; e.className = 'refA si salta'; };
  $('bVolverRef').innerHTML = IC.casa; $('bVolverRef').onclick = function () { irMapa(); };
  var n = 0; for (i in P.resc) if (P.resc[i]) n++;
  hablar(n ? 'Estos son los animales que rescataste.' : 'Todavía no rescataste ningún animal. ¡Vamos!');
}

/* =========================================================
   TECLADO Y CANDADO DEL DOCENTE
   ========================================================= */
var BLOQ = { activo: true, pin: '', abierto: false, panel: false, fs: false };
function teclaJuego(k) {
  if (FASE === 'inicio') {
    if (k === 37) marcarRobot((selRobot + ROBOTS.length - 1) % ROBOTS.length);
    else if (k === 39) marcarRobot((selRobot + 1) % ROBOTS.length);
    else if (k === 13 || k === 32) elegirRobot(selRobot);
  } else if (FASE === 'tuto') { if (TECLA_DIR[k]) tutoTecla(TECLA_DIR[k]); }
  else if (FASE === 'nivel' && L) {
    var d = TECLA_DIR[k];
    if (d) apretarFlecha(d);
    else if (L.modo === 'programa' && (k === 13 || k === 32)) ejecutar();
    else if (L.modo === 'programa' && k === 8) borrarOrden();
  } else if (FASE === 'ganaste') { if (k === 13 || k === 32 || k === 39) siguienteNivel(); }
  else if (FASE === 'mapa' && (k === 13 || k === 32)) { var p = document.querySelector('.nivBtn.prox'); if (p) p.onclick(); }
}
function apretarFlecha(d) {
  if (!L || L.ganado) return;
  L.ultAccion = Date.now();
  var b = $({ arr: 'fArr', aba: 'fAba', izq: 'fIzq', der: 'fDer' }[d]);
  var bs = document.querySelectorAll('.flecha'), i; for (i = 0; i < bs.length; i++) bs[i].className = 'flecha';
  b.className = 'flecha apreta'; setTimeout(function () { b.className = 'flecha'; }, 160);
  if (L.modo === 'programa') { agregarOrden(d); return; }
  if (L.mov) return;
  L.mov = true; setTimeout(function () { L.mov = false; }, 280);
  intentarMover(d);
}
window.addEventListener('keydown', function (e) {
  var k = e.keyCode;
  primerGesto();
  // combinación del docente: Ctrl + Shift + P
  if (e.ctrlKey && e.shiftKey && k === 80) { e.preventDefault(); e.stopPropagation(); abrirPin(); return; }
  if (BLOQ.abierto) { e.preventDefault(); e.stopPropagation(); if (!BLOQ.panel) { if (k >= 48 && k <= 57) pinDigito(String(k - 48)); else if (k >= 96 && k <= 105) pinDigito(String(k - 96)); else if (k === 8) { BLOQ.pin = BLOQ.pin.slice(0, -1); pintarPin(); } else if (k === 27) cerrarPin(); } else if (k === 27) cerrarPin(); return; }
  if (!BLOQ.activo) return;
  e.preventDefault(); e.stopPropagation();
  if (e.ctrlKey || e.altKey || e.metaKey) return;
  if (e.repeat && !TECLA_DIR[k]) return;
  teclaJuego(k);
}, true);
window.addEventListener('keyup', function (e) { if (BLOQ.activo) { e.preventDefault(); e.stopPropagation(); } }, true);
document.addEventListener('contextmenu', function (e) { e.preventDefault(); });
document.addEventListener('dragstart', function (e) { e.preventDefault(); });
document.addEventListener('selectstart', function (e) { e.preventDefault(); });
window.addEventListener('wheel', function (e) { if (e.ctrlKey) e.preventDefault(); }, { passive: false });
window.addEventListener('beforeunload', function (e) { if (BLOQ.activo) { e.preventDefault(); e.returnValue = ''; return ''; } });
document.addEventListener('mousedown', function (e) { primerGesto(); var t = e.target; while (t && t !== document) { if (t.tagName === 'BUTTON') { e.preventDefault(); return; } t = t.parentNode; } });

var gestoHecho = false;
function primerGesto() {
  auInit(); if (AU.musOn) musicaOn();
  if (gestoHecho) return; gestoHecho = true;
  entrarPantalla();
}
function entrarPantalla() {
  var d = document.documentElement, pr = null;
  try { pr = d.requestFullscreen ? d.requestFullscreen() : (d.webkitRequestFullscreen ? d.webkitRequestFullscreen() : null); } catch (e) {}
  var bloquear = function () { BLOQ.fs = true; try { if (navigator.keyboard && navigator.keyboard.lock) navigator.keyboard.lock(); } catch (e) {} };
  if (pr && pr.then) pr.then(bloquear, function () {}); else setTimeout(bloquear, 300);
}
document.addEventListener('fullscreenchange', function () {
  if (!document.fullscreenElement && BLOQ.activo && BLOQ.fs) $('pantallaC').className = 'on';
});
function salirDelBloqueo() {
  BLOQ.activo = false;
  try { if (navigator.keyboard && navigator.keyboard.unlock) navigator.keyboard.unlock(); } catch (e) {}
  try { if (document.fullscreenElement && document.exitFullscreen) document.exitFullscreen(); } catch (e) {}
  musicaOff(); try { speechSynthesis.cancel(); } catch (e) {}
  $('bloqueo').className = ''; $('salida').className = 'on';
  try { window.close(); } catch (e) {}
}
/* clave */
function abrirPin() {
  BLOQ.abierto = true; BLOQ.panel = false; BLOQ.pin = '';
  $('bloqueo').className = 'on'; $('pinCaja').style.display = ''; $('docPanel').className = '';
  var s = '', i, ns = [1, 2, 3, 4, 5, 6, 7, 8, 9, 'x', 0, '<'];
  for (i = 0; i < ns.length; i++) s += '<button data-k="' + ns[i] + '">' + (ns[i] === 'x' ? '&#10005;' : ns[i] === '<' ? '&#9003;' : ns[i]) + '</button>';
  $('pinTeclas').innerHTML = s;
  var bs = $('pinTeclas').children;
  for (i = 0; i < bs.length; i++) bs[i].onclick = function () { var k = this.getAttribute('data-k'); if (k === 'x') cerrarPin(); else if (k === '<') { BLOQ.pin = BLOQ.pin.slice(0, -1); pintarPin(); } else pinDigito(k); };
  pintarPin();
}
function pintarPin() { var p = $('pinPuntos').children, i; for (i = 0; i < 4; i++) p[i].className = i < BLOQ.pin.length ? 'si' : ''; }
function pinDigito(d) {
  if (BLOQ.pin.length >= 4) return;
  BLOQ.pin += d; pintarPin();
  if (BLOQ.pin.length === 4) {
    if (BLOQ.pin === CLAVE) setTimeout(abrirPanel, 200);
    else setTimeout(function () { var pp = $('pinPuntos'); pp.className = 'mal'; setTimeout(function () { pp.className = ''; BLOQ.pin = ''; pintarPin(); }, 400); }, 200);
  }
}
function cerrarPin() { BLOQ.abierto = false; BLOQ.panel = false; $('bloqueo').className = ''; }
function abrirPanel() {
  BLOQ.panel = true; $('pinCaja').style.display = 'none'; $('docPanel').className = 'on';
  $('dMus').innerHTML = 'Música: ' + (AU.musOn ? 'sí' : 'no'); $('dVoz').innerHTML = 'Voz: ' + (VOZ.on ? 'sí' : 'no');
  $('dBorrar').innerHTML = 'Borrar el progreso (empezar de cero)'; $('dBorrar')._conf = false;
  $('dTodos').innerHTML = P.todos ? 'Volver a ordenar los niveles (uno por uno)' : 'Abrir todos los niveles';
}
function armarDocente() {
  $('dSeguir').onclick = cerrarPin;
  $('dTodos').onclick = function () { P.todos = !P.todos; guardar(); abrirPanel(); if (FASE === 'mapa') irMapa(); };
  $('dMus').onclick = function () { setMus(!AU.musOn); if (AU.musOn) musicaOn(); abrirPanel(); };
  $('dVoz').onclick = function () { VOZ.on = !VOZ.on; abrirPanel(); };
  $('dBorrar').onclick = function () {
    if (!this._conf) { this._conf = true; this.innerHTML = 'Tocá otra vez para confirmar'; return; }
    P = { robot: 0, est: {}, todos: false, tuto: false, resc: {} }; guardar(); cerrarPin(); irInicio();
  };
  $('dSalir').onclick = salirDelBloqueo;
  // atajo con el mouse: 5 toques seguidos en la esquina de arriba a la izquierda
  var toques = [];
  $('esquina').onclick = function () { var t = Date.now(); toques.push(t); toques = toques.filter(function (x) { return t - x < 3000; }); if (toques.length >= 5) { toques = []; abrirPin(); } };
  $('bPantC').innerHTML = IC.play; $('bPantC').onclick = function () { $('pantallaC').className = ''; entrarPantalla(); };
}

/* ---------- botones del nivel ---------- */
function armarBotones() {
  var fl = { fArr: 'arr', fAba: 'aba', fIzq: 'izq', fDer: 'der' }, k;
  for (k in fl) (function (id, d) { $(id).onclick = function () { apretarFlecha(d); }; })(k, fl[k]);
  $('bCasa').onclick = function () { clearInterval(IDLE); irMapa(); };
  $('bRepetir').onclick = function () { if (L && !L.corriendo) { sfx('whoosh'); reiniciarNivel(); } };
  $('bPlay').onclick = function () { if (L) { L.ultAccion = Date.now(); ejecutar(); } };
  $('bBorrar').onclick = function () { if (L) { L.ultAccion = Date.now(); borrarOrden(); } };
  $('bLimpiar').onclick = function () { if (L) { L.ultAccion = Date.now(); limpiarOrdenes(); } };
  $('gSig').onclick = siguienteNivel;
  $('gOtra').onclick = function () { jugar(L.i, L.n); };
  $('gCasa').onclick = function () { irMapa(); };
}

/* ---------- arranque ---------- */
cargar();
escalar();
fxIniciar();
armarBotones();
armarDocente();
irInicio();
</script>
</body></html>
