<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>El ciber de Don Atajo</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;background:#05070f;overflow:hidden;font-family:"Segoe UI","Helvetica Neue",Roboto,Arial,sans-serif;color:#eef2ff;-webkit-font-smoothing:antialiased}
body{user-select:none;-webkit-user-select:none}
textarea,input{user-select:text;-webkit-user-select:text}
#marco{position:fixed;left:0;top:0;right:0;bottom:0;display:flex;align-items:center;justify-content:center}
#stage{position:relative;width:1280px;height:720px;flex:none;transform-origin:center center;overflow:hidden;background:#0a0f1f}
.pant{position:absolute;left:0;top:0;right:0;bottom:0;display:none}
.pant.on{display:block}
button{font-family:inherit;cursor:pointer;border:0;background:none;color:inherit;outline:none}
button:focus{outline:none}

/* ---------- teclas ---------- */
.kc{display:inline-block;min-width:34px;padding:5px 11px;border-radius:8px;background:#fff4dc;color:#2a2110;font-weight:800;font-size:17px;text-align:center;box-shadow:0 3px 0 #c9a96b;line-height:1.1}
.kcs i{font-style:normal;color:#93a0c8;margin:0 5px;font-weight:700}
.kcs{display:inline-block;margin:3px 6px 3px 0;white-space:nowrap}
.kc.big{font-size:24px;padding:8px 16px;border-radius:10px}
.pulsa .kc{animation:kpul 1s ease-in-out infinite}
@keyframes kpul{0%,100%{transform:translateY(0);box-shadow:0 3px 0 #c9a96b,0 0 0 0 rgba(255,183,3,.0)}50%{transform:translateY(-3px);box-shadow:0 6px 0 #c9a96b,0 0 18px 4px rgba(255,183,3,.55)}}

/* ---------- portada ---------- */
#portada{background:radial-gradient(900px 560px at 75% 15%,#27407a 0%,rgba(0,0,0,0) 62%),radial-gradient(760px 520px at 12% 95%,#5a2a52 0%,rgba(0,0,0,0) 60%),#0a0f1f}
#pEscena{position:absolute;left:0;top:0;width:1280px;height:720px}
#pTitulo{position:absolute;left:0;right:0;top:36px;text-align:center}
#pTitulo .neon{display:inline-block;padding:10px 34px 12px;border:4px solid #ffb703;border-radius:20px;font-size:62px;font-weight:900;letter-spacing:-2px;color:#fff4dc;text-shadow:0 0 12px #ffb703,0 0 30px #fb8500;box-shadow:0 0 22px rgba(255,183,3,.55),inset 0 0 18px rgba(255,183,3,.3);background:rgba(10,15,31,.55)}
#pTitulo .sub{margin-top:14px;font-size:22px;color:#c9d3f5}
#pForm{position:absolute;left:380px;width:520px;top:392px;text-align:center;background:rgba(10,15,31,.82);border:1px solid #2a3a6e;border-radius:22px;padding:22px 26px 24px;box-shadow:0 20px 50px rgba(0,0,0,.45)}
#pForm label{display:block;font-size:17px;color:#c9d3f5;margin-bottom:8px}
#nombre{width:100%;height:54px;border-radius:14px;border:2px solid #2a3a6e;background:#111a38;color:#fff;font-size:24px;text-align:center;font-family:inherit;outline:none}
#nombre:focus{border-color:#ffb703}
#gorras{display:flex;justify-content:center;gap:12px;margin:14px 0 4px}
.gorra{width:38px;height:38px;border-radius:50%;border:3px solid transparent;box-shadow:0 3px 0 rgba(0,0,0,.4)}
.gorra.on{border-color:#fff;transform:scale(1.15)}
.btnGrande{display:block;width:100%;height:58px;margin-top:14px;border-radius:16px;font-size:22px;font-weight:800;color:#2a1a00;background:linear-gradient(180deg,#ffd166,#ffb703);box-shadow:0 5px 0 #b87a00,0 12px 26px rgba(255,183,3,.25);transition:transform .1s}
.btnGrande:hover{transform:translateY(-2px)}
.btnGrande:active{transform:translateY(3px);box-shadow:0 2px 0 #b87a00}
.btnChico{height:40px;padding:0 18px;border-radius:12px;background:#17213f;border:1px solid #2f4180;color:#dfe6ff;font-size:16px;font-weight:600}
.btnChico:hover{background:#1f2c55}
.btnChico.on{border-color:#ffb703;color:#fff4dc}
#pOpc{position:absolute;right:20px;bottom:16px;display:flex;gap:10px}
#pPie{position:absolute;left:20px;bottom:18px;font-size:13px;color:#6a79ab}
#pSeguir{margin-top:8px;font-size:15px;color:#93a0c8}
#pSeguir button{color:#ffd166;text-decoration:underline;font-size:15px;margin-left:6px}

/* ---------- mapa ---------- */
#mapa{background:radial-gradient(900px 500px at 50% -10%,#233a73 0%,rgba(0,0,0,0) 65%),#0a0f1f}
#mHead{position:absolute;left:0;right:0;top:0;height:84px;display:flex;align-items:center;padding:0 28px;gap:18px;border-bottom:1px solid #1f2b55;background:rgba(10,15,31,.7)}
#mHead .yo{display:flex;align-items:center;gap:12px}
#mHead .yo svg{width:56px;height:60px}
#mHead .yo b{font-size:24px}
#mHead .yo span{display:block;font-size:14px;color:#93a0c8}
#mHead .esp{flex:1}
.stat{display:flex;align-items:center;gap:8px;height:44px;padding:0 16px;border-radius:22px;background:#17213f;border:1px solid #2f4180;font-size:20px;font-weight:700}
.stat small{font-size:13px;color:#93a0c8;font-weight:600}
.moneda{display:inline-block;width:22px;height:22px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff1b8,#ffb703 60%,#c98400);box-shadow:inset 0 -2px 0 rgba(0,0,0,.25)}
#mCards{position:absolute;left:24px;right:24px;top:104px;height:408px;display:flex;gap:18px}
.jCard{flex:1;border-radius:22px;padding:18px 20px;background:linear-gradient(180deg,#17213f,#111a33);border:1px solid #2a3a6e;position:relative;overflow:hidden}
.jCard h3{font-size:25px;font-weight:800;line-height:1.1}
.jCard .jn{font-size:14px;color:#ffd166;font-weight:700;letter-spacing:.5px;text-transform:uppercase;margin-bottom:4px}
.jCard p{font-size:16px;color:#aebbe6;margin:6px 0 14px;min-height:40px}
.jCard.bloq{opacity:.55}
.jCard.j1 h3{color:#ffd166}.jCard.j2 h3{color:#7ee0d3}.jCard.j3 h3{color:#ff9e9e}
.nodos{display:flex;flex-wrap:wrap;gap:10px 10px}
.nodo{width:62px;height:76px;text-align:center}
.nodo button{display:block;width:58px;height:58px;margin:0 auto;border-radius:50%;font-size:22px;font-weight:800;background:#1f2c55;border:3px solid #3a4f9a;color:#dfe6ff;transition:transform .12s}
.nodo button:hover{transform:scale(1.1)}
.nodo.hecho button{background:#2a9d8f;border-color:#7ee0d3;color:#fff}
.nodo.sig button{background:#ffb703;border-color:#fff4dc;color:#2a1a00;animation:latido 1.2s ease-in-out infinite}
.nodo.bl button{opacity:.4;cursor:default}
.nodo .est{font-size:13px;margin-top:2px;letter-spacing:1px;color:#ffd166;height:16px}
@keyframes latido{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}
#mFila{position:absolute;left:24px;right:24px;top:530px;height:170px;display:flex;gap:18px}
.mini{flex:1;border-radius:20px;padding:16px 20px;background:#131c38;border:1px solid #2a3a6e;position:relative}
.mini h4{font-size:21px;font-weight:800}
.mini p{font-size:15px;color:#aebbe6;margin-top:4px}
.mini .btnChico{position:absolute;right:16px;bottom:14px}
.mini.bloq{opacity:.5}
.mini.sig{border-color:#ffb703;box-shadow:0 0 22px rgba(255,183,3,.25)}

/* ---------- juego ---------- */
#juego{background:#0a0f1f}
#jTop{position:absolute;left:0;right:0;top:0;height:54px;display:flex;align-items:center;gap:14px;padding:0 16px;background:#0f1730;border-bottom:1px solid #1f2b55}
#jTop .tit{flex:1;font-size:19px;font-weight:700}
#jTop .tit small{color:#ffd166;font-size:14px;margin-right:8px;text-transform:uppercase;letter-spacing:.5px}
#jTop .tiempo{font-size:21px;font-weight:800;width:74px;text-align:center;font-variant-numeric:tabular-nums;color:#7ee0d3}
#jIzq{position:absolute;left:14px;top:66px;width:296px;bottom:14px;display:flex;flex-direction:column;gap:10px}
#jCli{flex:none}
.cli{display:flex;gap:10px;align-items:flex-start;margin-bottom:8px;padding:10px;border-radius:16px;background:#17213f;border:1px solid #2a3a6e;position:relative;transition:opacity .3s,transform .3s}
.cli.hecho{opacity:.55}
.cli .av{flex:none;width:76px;text-align:center}
.cli .av svg{width:76px;height:84px;display:block}
.cli .av span{display:block;font-size:12px;color:#93a0c8;margin-top:-2px;font-weight:600}
.cli .bub{flex:1;font-size:19px;line-height:1.25;font-weight:600;color:#fff4dc;background:#243564;border-radius:14px;padding:10px 12px;position:relative;min-height:70px;display:flex;align-items:center}
.cli .bub:before{content:"";position:absolute;left:-9px;top:20px;border:9px solid transparent;border-right-color:#243564;border-left:0}
.cli .tilde{position:absolute;right:8px;top:6px;width:30px;height:30px;border-radius:50%;background:#2a9d8f;color:#fff;font-weight:900;font-size:19px;text-align:center;line-height:30px;display:none}
.cli.hecho .tilde{display:block}
.cli.nuevo{animation:entra .4s ease-out}
@keyframes entra{from{transform:translateX(-20px);opacity:0}to{transform:none;opacity:1}}
#jPista{flex:none;min-height:46px;padding:8px 10px;border-radius:14px;background:rgba(255,183,3,.08);border:1px dashed #6b5a2a;display:none}
#jPista.on{display:block}
#jPista .lbl{font-size:13px;color:#ffd166;font-weight:700;margin-bottom:2px;text-transform:uppercase;letter-spacing:.5px}
#jPista .txt{font-size:15px;color:#e8dcb8;margin-top:4px}
#jKbp{flex:none;display:none;padding:10px;border-radius:14px;background:#121b36;border:1px solid #2a3a6e}
#jKbp.on{display:block}
#jKbp .lbl{font-size:12px;color:#93a0c8;margin-bottom:6px;line-height:1.2}
#jKbp .teclas{display:flex;flex-wrap:wrap;gap:7px}
.vk{min-width:52px;height:46px;padding:0 10px;border-radius:9px;background:#e9edf8;color:#1b2340;font-size:17px;font-weight:800;box-shadow:0 4px 0 #8b97bd;transition:transform .05s}
.vk:active{transform:translateY(3px);box-shadow:0 1px 0 #8b97bd}
.vk.sost{background:#ffd166;box-shadow:0 1px 0 #b87a00;transform:translateY(3px)}
#jBot{margin-top:auto;display:flex;gap:8px;flex-wrap:wrap}
#jBot button{flex:1;min-width:110px}
#jSim{position:absolute;z-index:1;isolation:isolate;left:324px;top:66px;width:940px;height:640px;border-radius:16px;overflow:hidden;background:#0f1730;border:2px solid #26335c;box-shadow:0 12px 40px rgba(0,0,0,.45)}
#simIn{position:absolute;left:0;top:0;width:940px;height:640px;overflow:hidden}

/* ---------- ventanas de texto ---------- */
.simBg{position:absolute;left:0;top:0;width:940px;height:640px;background:linear-gradient(135deg,#1e3c72,#2a5298 55%,#3f84d8)}
.win{position:absolute;background:#f6f7fb;border-radius:10px 10px 6px 6px;box-shadow:0 10px 30px rgba(0,0,0,.4);overflow:hidden;display:flex;flex-direction:column;border:1px solid #9fb0d6}
.win .wbar{flex:none;height:34px;background:linear-gradient(180deg,#e5ebf7,#d3dcef);display:flex;align-items:center;padding:0 10px;gap:8px;font-size:15px;font-weight:700;color:#1b2340;cursor:default}
.win .wbar .pts{margin-left:auto;display:flex;gap:6px}
.win .wbar .pts i{display:block;width:12px;height:12px;border-radius:50%;background:#b8c3df}
.win .wbar .pts i:last-child{background:#ff6b6b}
.win textarea{flex:1;width:100%;border:0;outline:none;resize:none;padding:12px 14px;font-family:"Segoe UI",Arial,sans-serif;font-size:19px;line-height:1.5;color:#1b2340;background:#fff}
.win textarea[readonly]{background:#fbfcff}
.win.foco{box-shadow:0 0 0 3px #ffd166,0 10px 30px rgba(0,0,0,.4)}
.win.sacude{animation:sacude .5s}
@keyframes sacude{0%,100%{transform:translateX(0)}20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-6px)}80%{transform:translateX(6px)}}
.trabado{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);padding:10px 22px;border-radius:14px;background:#ff6b6b;color:#fff;font-size:20px;font-weight:800;z-index:50;box-shadow:0 8px 20px rgba(0,0,0,.4)}
.trabado.flash{animation:sacude .4s}
.gatoRun{position:absolute;z-index:60;pointer-events:none;width:150px}

/* ---------- navegador ---------- */
.nv{position:absolute;left:0;top:0;width:940px;height:640px;background:#dfe5f3;display:flex;flex-direction:column}
.nvTabs{flex:none;height:42px;background:#b9c5e3;display:flex;align-items:flex-end;padding:6px 8px 0;gap:4px}
.nvTab{position:relative;height:36px;min-width:60px;max-width:170px;flex:0 1 170px;border-radius:10px 10px 0 0;background:#cdd7ef;padding:0 28px 0 12px;font-size:14px;font-weight:600;color:#33406b;line-height:36px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer}
.nvTab.act{background:#f6f7fb;color:#111a38}
.nvTab .x{position:absolute;right:5px;top:8px;width:20px;height:20px;border-radius:50%;line-height:19px;text-align:center;font-size:15px;color:#59679a}
.nvTab .x:hover{background:#ff6b6b;color:#fff}
.nvMas{width:34px;height:34px;border-radius:50%;font-size:22px;font-weight:700;color:#33406b;margin-bottom:1px}
.nvMas:hover{background:#cdd7ef}
.nvBar{flex:none;height:46px;background:#f6f7fb;display:flex;align-items:center;gap:6px;padding:0 10px;border-bottom:1px solid #c5cfe6}
.nvBtn{width:36px;height:34px;border-radius:8px;font-size:20px;font-weight:700;color:#33406b}
.nvBtn:hover{background:#e0e6f5}
.nvBtn.off{opacity:.3;cursor:default}
.nvUrl{flex:1;height:32px;border-radius:16px;background:#e9edf8;padding:0 16px;line-height:32px;font-size:15px;color:#45527f;white-space:nowrap;overflow:hidden}
.nvZoom{width:62px;text-align:center;font-size:14px;font-weight:800;color:#b86500;height:28px;line-height:28px;border-radius:14px;background:#fff0cf;visibility:hidden}
.nvZoom.on{visibility:visible}
.nvFind{position:absolute;right:20px;top:94px;z-index:30;display:none;align-items:center;gap:6px;padding:8px 10px;background:#fff;border-radius:12px;box-shadow:0 8px 24px rgba(0,0,0,.35);border:1px solid #b9c5e3}
.nvFind.on{display:flex}
.nvFind input{width:190px;height:34px;border:2px solid #7aa2ff;border-radius:8px;padding:0 10px;font-size:17px;font-family:inherit;outline:none;color:#111a38}
.nvFind .cnt{font-size:15px;color:#45527f;width:74px;text-align:center;font-weight:700}
.nvFind button{width:32px;height:32px;border-radius:8px;font-size:16px;color:#33406b;font-weight:800}
.nvFind button:hover{background:#e0e6f5}
.nvBody{position:relative;flex:1;background:#fff;overflow:auto}
.nvPage{padding:26px 40px 80px;color:#1b2340;font-size:18px;line-height:1.55}
.nvPage h1{font-size:34px;margin-bottom:10px;color:#0e1a3f}
.nvPage h2{font-size:24px;margin:22px 0 8px;color:#1f3a8a}
.nvPage p{margin-bottom:12px}
.nvPage ul{margin:0 0 12px 24px}
.nvPage .lnk{color:#1a56db;text-decoration:underline;cursor:pointer;font-weight:600}
.nvPage .tiles{display:flex;flex-wrap:wrap;gap:16px;margin-top:20px}
.nvPage .tile{width:260px;height:96px;border-radius:14px;padding:14px 16px;font-size:20px;font-weight:800;color:#fff;cursor:pointer;display:flex;align-items:flex-end;box-shadow:0 5px 0 rgba(0,0,0,.2)}
.nvPage .tile:hover{filter:brightness(1.08)}
.nvPage .precio{display:inline-block;padding:6px 16px;border-radius:10px;background:#fff0cf;font-size:26px;font-weight:900;color:#b86500}
.nvPage .banner{padding:16px 20px;border-radius:14px;background:#e8f1ff;margin-bottom:16px}
.nvPage .tiny{font-size:6px;line-height:1.4}
mark{background:#ffeb3b;color:#000;padding:0 1px;border-radius:2px}
mark.act{background:#ff9800;color:#000;box-shadow:0 0 0 2px #ff9800}
.nvCarga{text-align:center;padding-top:160px;font-size:26px;font-weight:800;color:#45527f}
.spin{width:70px;height:70px;border-radius:50%;border:8px solid #d3dcef;border-top-color:#2a5298;margin:0 auto 18px;animation:giro 1s linear infinite}
@keyframes giro{to{transform:rotate(360deg)}}
.nvNota{position:absolute;right:16px;bottom:14px;width:290px;z-index:20;background:#fff3b0;border-radius:6px;box-shadow:0 8px 20px rgba(0,0,0,.35);transform:rotate(1.2deg)}
.nvNota .nt{height:26px;background:#f5dc6a;font-size:13px;font-weight:800;color:#6d5a00;line-height:26px;padding-left:10px;border-radius:6px 6px 0 0}
.nvNota textarea{display:block;width:100%;height:78px;border:0;outline:none;resize:none;background:transparent;padding:8px 10px;font-size:20px;font-family:"Segoe UI",Arial,sans-serif;color:#33290a;font-weight:600}

/* ---------- escritorio ---------- */
.ds{position:absolute;left:0;top:0;width:940px;height:640px;background:linear-gradient(135deg,#1e3c72,#2a5298 55%,#3f84d8);overflow:hidden}
.dsIcons{position:absolute;left:0;top:0;width:130px;bottom:46px;padding:10px 8px;overflow:hidden}
.dsWins{position:absolute;left:0;top:0;right:0;bottom:46px}
.dsTask{position:absolute;left:0;right:0;bottom:0;height:46px;background:rgba(14,22,48,.92);display:flex;align-items:center;gap:6px;padding:0 8px;z-index:90}
.dsStart{width:44px;height:36px;border-radius:8px;display:flex;align-items:center;justify-content:center}
.dsStart:hover{background:rgba(255,255,255,.14)}
.dsStart svg{width:22px;height:22px}
.dsTb{height:36px;min-width:110px;max-width:160px;padding:0 12px;border-radius:8px;background:rgba(255,255,255,.1);font-size:14px;font-weight:600;color:#e6ecff;text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border-bottom:3px solid transparent}
.dsTb.act{background:rgba(255,255,255,.22);border-bottom-color:#ffd166}
.dsTb.min{opacity:.6}
.dsClock{margin-left:auto;font-size:14px;color:#cfd8f6;padding:0 8px}
.dsCam{width:40px;height:36px;border-radius:8px;display:flex;align-items:center;justify-content:center;margin-left:auto}
.dsCam:hover{background:rgba(255,255,255,.14)}
.dsCam svg{width:22px;height:22px}
.it{display:inline-block;vertical-align:top;width:92px;margin:2px 2px 6px;padding:5px 2px 4px;border-radius:8px;text-align:center;cursor:default;border:1px solid transparent}
.it svg{width:46px;height:46px;display:block;margin:0 auto 3px}
.it .nm{font-size:13px;line-height:1.15;word-wrap:break-word;overflow:hidden;max-height:32px;font-weight:600}
.dsIcons .it .nm{color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.8)}
.it:hover{background:rgba(120,160,255,.18)}
.it.sel{background:rgba(255,209,102,.35);border-color:#ffd166}
.it.cut{opacity:.45}
.it input{width:84px;font-size:13px;font-family:inherit;text-align:center;border:2px solid #2a5298;border-radius:4px;outline:none;color:#111a38}
.dwin{position:absolute;background:#f6f7fb;border-radius:10px 10px 6px 6px;box-shadow:0 12px 32px rgba(0,0,0,.45);overflow:hidden;display:flex;flex-direction:column;border:1px solid #8ea1cf}
.dwin.top{box-shadow:0 0 0 3px #ffd166,0 12px 32px rgba(0,0,0,.5)}
.dwin .wbar{flex:none;height:32px;background:linear-gradient(180deg,#e5ebf7,#d3dcef);display:flex;align-items:center;padding:0 6px 0 10px;gap:8px;font-size:14px;font-weight:700;color:#1b2340}
.dwin .wbar .tt{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dwin .wbar button{width:28px;height:24px;border-radius:6px;font-size:15px;font-weight:800;color:#33406b}
.dwin .wbar button:hover{background:#c7d2ec}
.dwin .wbar button.cl:hover{background:#ff6b6b;color:#fff}
.dwin .tool{flex:none;height:32px;background:#eef2fb;border-bottom:1px solid #d0d9ee;display:flex;align-items:center;gap:6px;padding:0 8px;font-size:13px;color:#45527f}
.dwin .tool button{height:24px;padding:0 8px;border-radius:6px;font-size:13px;font-weight:700;color:#33406b;background:#fff;border:1px solid #c5cfe6}
.dwin .tool .ruta{flex:1;background:#fff;border:1px solid #d0d9ee;border-radius:5px;height:24px;line-height:22px;padding:0 8px;overflow:hidden;white-space:nowrap}
.dwin .cuerpo{flex:1;overflow:auto;padding:8px;background:#fff}
.dwin .cuerpo .it .nm{color:#1b2340}
.dwin .vacio{text-align:center;color:#9aa6c9;padding-top:60px;font-size:15px;font-weight:600}
.dwin .visor{flex:1;background:#fff;display:flex;align-items:center;justify-content:center}
.cm{position:absolute;z-index:200;min-width:210px;background:#fff;border-radius:10px;box-shadow:0 12px 30px rgba(0,0,0,.45);border:1px solid #c5cfe6;padding:5px 0;color:#1b2340}

.cm div span{margin-left:auto;color:#8591b8;font-size:12px;font-weight:700;padding-top:2px}
.cm div:hover{background:#e3ebff}
.cm div.off{opacity:.35;cursor:default}
.cm div.off:hover{background:none}
.cm hr{border:0;border-top:1px solid #e0e6f5;margin:4px 0}
.dsMenu{position:absolute;left:6px;bottom:50px;z-index:150;width:250px;background:#16213f;border-radius:12px;box-shadow:0 10px 30px rgba(0,0,0,.5);padding:8px;border:1px solid #2f4180}
.dsMenu div{padding:9px 12px;border-radius:8px;font-size:15px;font-weight:600;color:#e6ecff;cursor:pointer;display:flex;gap:10px}
.dsMenu div span{margin-left:auto;color:#8aa0e0;font-size:12px;padding-top:2px}
.dsMenu div:hover{background:#26356a}
.dsCap{position:absolute;left:0;top:0;right:0;bottom:46px;z-index:140;background:rgba(0,0,0,.45);cursor:crosshair}
.dsCap .rect{position:absolute;border:2px dashed #fff;background:rgba(255,255,255,.15)}
.dsCap .tip{position:absolute;left:50%;top:16px;transform:translateX(-50%);background:#16213f;color:#fff;padding:8px 18px;border-radius:12px;font-size:16px;font-weight:700}
.flashB{position:absolute;left:0;top:0;right:0;bottom:0;background:#fff;z-index:300;pointer-events:none;animation:flasheo .5s forwards}
@keyframes flasheo{from{opacity:.9}to{opacity:0}}
.drag-over{outline:3px dashed #ffd166;outline-offset:-3px}

/* ---------- capas ---------- */
#capa{position:absolute;z-index:1000;left:0;top:0;right:0;bottom:0;pointer-events:none}
#capa>*{pointer-events:auto}
.vela{position:absolute;left:0;top:0;right:0;bottom:0;background:rgba(5,8,18,.78);display:flex;align-items:center;justify-content:center}
.tarjeta{position:relative;width:640px;border-radius:26px;padding:26px 34px 28px;background:linear-gradient(180deg,#1a2650,#121b3a);border:2px solid #3a4f9a;box-shadow:0 24px 70px rgba(0,0,0,.6);text-align:center;animation:pop .35s cubic-bezier(.2,1.4,.4,1)}

.tarjeta h2{font-size:38px;font-weight:900;color:#ffd166}
.tarjeta .estrellas{font-size:64px;letter-spacing:8px;margin:6px 0 2px;color:#ffb703;text-shadow:0 4px 0 #8a5a00}
.tarjeta .estrellas .vac{color:#3a4f9a;text-shadow:none}
.tarjeta .propi{font-size:22px;font-weight:700;color:#fff4dc;display:flex;align-items:center;justify-content:center;gap:8px}
.tarjeta .dato{margin:16px 0 4px;padding:12px 16px;border-radius:14px;background:#0e1633;border:1px solid #2a3a6e;font-size:19px;color:#dfe6ff;line-height:1.35;text-align:left}

.tarjeta .fila{display:flex;gap:12px;margin-top:18px;justify-content:center}
.tarjeta .fila .btnGrande{margin-top:0;width:auto;padding:0 30px;display:inline-block}
.tarjeta .fila .btnChico{height:58px;font-size:18px}
.barra{height:34px;border-radius:17px;background:#0e1633;margin:10px 0;position:relative;overflow:hidden;text-align:left}
.barra i{display:block;height:100%;border-radius:17px;transition:width 1.2s}
.barra span{position:absolute;left:16px;top:0;line-height:34px;font-weight:800;font-size:17px;color:#fff}
.cf{position:absolute;top:-20px;width:12px;height:18px;border-radius:2px;animation:cae linear forwards;z-index:400;pointer-events:none}

.toast small{display:block;font-size:13px;color:#ffd166;font-weight:700}

<body>
<div id="marco"><div id="stage">
  <div id="portada" class="pant on"></div>
  <div id="mapa" class="pant"></div>
  <div id="juego" class="pant"></div>
  <div id="real" class="pant"></div>
  <div id="capa"></div>
  <div id="toasts"></div>
</div></div>
<script>
/* ===== núcleo: utilidades, guardado, sonido, escala ===== */
var SAVEKEY = 'ciber_don_atajo_v1';
var memStore = null;
var P = null;
var G = { escala: 1, pant: 'portada', ms: null, env: null, saveOk: true, cola: [] };
var COLGORRA = ['#ffb703', '#e63946', '#2ec4b6', '#9b5de5', '#3a86ff', '#f15bb5'];

function $(id) { return document.getElementById(id); }
function mk(tag, cls, html) {
  var e = document.createElement(tag);
  if (cls) { e.className = cls; }
  if (html !== undefined) { e.innerHTML = html; }
  return e;
}
function hasCls(e, c) { return (' ' + e.className + ' ').indexOf(' ' + c + ' ') >= 0; }
function addCls(e, c) { if (!hasCls(e, c)) { e.className = e.className ? e.className + ' ' + c : c; } }
function rmCls(e, c) {
  var s = ' ' + e.className + ' ';
  while (s.indexOf(' ' + c + ' ') >= 0) { s = s.replace(' ' + c + ' ', ' '); }
  e.className = s.replace(/^\s+|\s+$/g, '');
}
function setCls(e, c, on) { if (on) { addCls(e, c); } else { rmCls(e, c); } }
function vaciar(e) { while (e.firstChild) { e.removeChild(e.firstChild); } }
function esc(s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }
function azar(n) { return Math.floor(Math.random() * n); }
function normTxt(s) { return String(s).replace(/\s+/g, ' ').replace(/^\s+|\s+$/g, ''); }
function sinTilde(s) { return String(s).toLowerCase().replace(/[áä]/g, 'a').replace(/[éë]/g, 'e').replace(/[íï]/g, 'i').replace(/[óö]/g, 'o').replace(/[úü]/g, 'u'); }
function fmtT(ms) { var s = Math.floor(ms / 1000); var m = Math.floor(s / 60); s = s % 60; return m + ':' + (s < 10 ? '0' : '') + s; }
function fmtS(ms) { return Math.round(ms / 1000) + ' s'; }
function loc(e, host) {
  var r = host.getBoundingClientRect();
  return { x: (e.clientX - r.left) / G.escala, y: (e.clientY - r.top) / G.escala };
}
function escalar() {
  var s = Math.min(window.innerWidth / 1280, window.innerHeight / 720);
  G.escala = s;
  $('stage').style.transform = 'scale(' + s + ')';
}

/* ---------- guardado ---------- */
function pNuevo() {
  return { nombre: '', color: 0, mis: {}, propinas: 0, logros: {}, sonido: true, todo: false,
           real: {}, pro: { largo: 0, corto: 0 }, cnt: {}, fin: {}, extra: {} };
}
function svLeer() {
  var s = null;
  try { s = window.localStorage.getItem(SAVEKEY); } catch (e) { s = memStore; }
  if (s) { try { return JSON.parse(s); } catch (e2) { return null; } }
  return null;
}
function svEscribir() {
  var s = JSON.stringify(P);
  try { window.localStorage.setItem(SAVEKEY, s); G.saveOk = true; }
  catch (e) { memStore = s; G.saveOk = false; }
}
function svBorrar() {
  try { window.localStorage.removeItem(SAVEKEY); } catch (e) { }
  memStore = null;
}
function contar(k) { if (!P) { return; } P.cnt[k] = (P.cnt[k] || 0) + 1; }

/* ---------- sonido (Web Audio, sin archivos) ---------- */
var AC = null;
function auCtx() {
  if (!AC) {
    try { var C = window.AudioContext || window.webkitAudioContext; if (C) { AC = new C(); } } catch (e) { AC = null; }
  }
  if (AC && AC.state === 'suspended') { try { AC.resume(); } catch (e2) { } }
  return AC;
}
function auTono(f, dur, tipo, vol, delay, f2) {
  if (!P || !P.sonido) { return; }
  var c = auCtx();
  if (!c) { return; }
  try {
    var t = c.currentTime + (delay || 0);
    var o = c.createOscillator();
    var g = c.createGain();
    o.type = tipo || 'sine';
    o.frequency.setValueAtTime(f, t);
    if (f2) { o.frequency.exponentialRampToValueAtTime(f2, t + dur); }
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol || 0.06, t + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(c.destination);
    o.start(t); o.stop(t + dur + 0.03);
  } catch (e) { }
}
function sfx(n) {
  if (n === 'click') { auTono(620, 0.06, 'triangle', 0.05); }
  else if (n === 'tecla') { auTono(900, 0.04, 'square', 0.025); }
  else if (n === 'ok') { auTono(660, 0.1, 'triangle', 0.07); auTono(880, 0.14, 'triangle', 0.07, 0.09); }
  else if (n === 'mal') { auTono(220, 0.18, 'sawtooth', 0.05, 0, 150); }
  else if (n === 'gana') { auTono(523, 0.14, 'triangle', 0.08); auTono(659, 0.14, 'triangle', 0.08, 0.12); auTono(784, 0.14, 'triangle', 0.08, 0.24); auTono(1047, 0.35, 'triangle', 0.09, 0.36); }
  else if (n === 'maullido') { auTono(520, 0.5, 'sawtooth', 0.04, 0, 900); auTono(900, 0.4, 'sawtooth', 0.03, 0.45, 420); }
  else if (n === 'foto') { auTono(1500, 0.05, 'square', 0.04); auTono(700, 0.12, 'square', 0.04, 0.05); }
  else if (n === 'moneda') { auTono(1175, 0.07, 'square', 0.04); auTono(1568, 0.16, 'square', 0.04, 0.07); }
  else if (n === 'logro') { auTono(784, 0.1, 'triangle', 0.07); auTono(988, 0.1, 'triangle', 0.07, 0.1); auTono(1319, 0.3, 'triangle', 0.08, 0.2); }
  else if (n === 'pop') { auTono(400, 0.08, 'sine', 0.06, 0, 700); }
}

/* ---------- avisos y confeti ---------- */
function toast(txt, sub) {
  var c = $('toasts');
  var t = mk('div', 'toast', (sub ? '<small>' + esc(sub) + '</small>' : '') + esc(txt));
  c.appendChild(t);
  setTimeout(function () { addCls(t, 'out'); }, 3000);
  setTimeout(function () { if (t.parentNode) { t.parentNode.removeChild(t); } }, 3600);
}
function confeti(host, n) {
  var cols = ['#ffb703', '#ff6b6b', '#2ec4b6', '#9b5de5', '#3a86ff', '#f15bb5', '#fff4dc'];
  var i;
  for (i = 0; i < n; i++) {
    var d = mk('div', 'cf');
    d.style.left = Math.floor(Math.random() * 1260) + 'px';
    d.style.background = cols[i % cols.length];
    d.style.animationDuration = (1.6 + Math.random() * 1.6) + 's';
    d.style.animationDelay = (Math.random() * 0.5) + 's';
    host.appendChild(d);
  }
  setTimeout(function () {
    var xs = host.getElementsByClassName('cf');
    while (xs.length) { xs[0].parentNode.removeChild(xs[0]); }
  }, 3800);
}

/* ---------- teclas en pantalla ---------- */
function kcs(combo, grande) {
  var out = '<span class="kcs">';
  var i;
  for (i = 0; i < combo.length; i++) {
    if (i > 0) { out += '<i>+</i>'; }
    out += '<span class="kc' + (grande ? ' big' : '') + '">' + esc(combo[i]) + '</span>';
  }
  return out + '</span>';
}
/* ===== arte: personajes e íconos en SVG ===== */
var CLIS = [

  { n: 'Abu Carmen', piel: '#f3cfae', pelo: '#f1f1f6', ropa: '#e5989b', pt: 'rulos', ant: 1, bi: 0 },

  { n: 'Sofi', piel: '#f3cfae', pelo: '#e9b44c', ropa: '#ef476f', pt: 'largo', ant: 0, bi: 0 },

function arCara(c, gorraCol) {

  var p = c.pelo;
  /* pelo de atrás */

  if (c.pt === 'rodete') { s += '<circle cx="50" cy="12" r="11" fill="' + p + '"/>'; }

  /* cabeza */

  s += '<ellipse cx="26" cy="48" rx="4" ry="6" fill="' + c.piel + '"/><ellipse cx="74" cy="48" rx="4" ry="6" fill="' + c.piel + '"/>';
  /* pelo de adelante */

    s += '<path d="M26 44 Q24 18 50 18 Q76 18 74 44 Q66 32 50 31 Q34 32 26 44Z" fill="' + p + '"/>';

  }
  /* cara */
  s += '<circle cx="41" cy="48" r="3.2" fill="#1b1b2b"/><circle cx="59" cy="48" r="3.2" fill="#1b1b2b"/>';
  s += '<path d="M42 59 Q50 66 58 59" stroke="#7a3b2e" stroke-width="2.6" fill="none" stroke-linecap="round"/>';
  if (c.bi) { s += '<path d="M39 55 Q50 50 61 55 Q50 58 39 55Z" fill="' + c.pelo + '"/>'; }
  if (c.ant) { s += '<circle cx="41" cy="48" r="8" fill="none" stroke="#2b2b3d" stroke-width="2"/><circle cx="59" cy="48" r="8" fill="none" stroke="#2b2b3d" stroke-width="2"/><path d="M49 48 L51 48" stroke="#2b2b3d" stroke-width="2"/>'; }
  return s;
}
function arCliente(i, w) {
  var c = CLIS[i % CLIS.length];
  var s = '<svg viewBox="0 0 100 110" width="' + w + '" height="' + Math.round(w * 1.1) + '">';

}

function arGato(w) {

  s += '<path d="M118 78 Q146 70 140 40 Q138 30 130 34" stroke="#f08a24" stroke-width="12" fill="none" stroke-linecap="round"/>';
  s += '<ellipse cx="78" cy="78" rx="46" ry="26" fill="#f08a24"/>';

  s += '<rect x="44" y="92" width="14" height="14" rx="6" fill="#f08a24"/><rect x="98" y="92" width="14" height="14" rx="6" fill="#f08a24"/>';
  s += '<circle cx="36" cy="56" r="28" fill="#f08a24"/>';
  s += '<path d="M12 40 L14 12 L32 28Z" fill="#f08a24"/><path d="M60 40 L58 12 L40 28Z" fill="#f08a24"/>';
  s += '<path d="M16 34 L17 20 L26 28Z" fill="#ffb3b3"/><path d="M56 34 L55 20 L46 28Z" fill="#ffb3b3"/>';
  s += '<path d="M24 38 L28 46 M48 38 L44 46" stroke="#c4651a" stroke-width="4" stroke-linecap="round"/>';

function nvMarcar(root, term) {
  var ms = root.getElementsByTagName('mark');

    var low = tx.toLowerCase();
    var k = low.indexOf(lt);

    var frag = document.createDocumentFragment();

    while (k >= 0) {
      frag.appendChild(document.createTextNode(tx.substring(ult, k)));
      var mk2 = document.createElement('mark');
      mk2.appendChild(document.createTextNode(tx.substring(k, k + lt.length)));
      frag.appendChild(mk2);
      n++;
      ult = k + lt.length;
      k = low.indexOf(lt, ult);

}

    var p = def.pasos[lista[i]];
    var c = CLIS[p.c % CLIS.length];
    h += '<div class="cli' + (nuevo ? ' nuevo' : '') + (m.done[lista[i]] ? ' hecho' : '') + '"><div class="av">' + arCliente(p.c, 76) + '<span>' + esc(c.n) + '</span></div><div class="bub">' + esc(p.d) + '</div><div class="tilde">✓</div></div>';
  }
  if (def.modo !== 'par' && def.pasos.length > 1) {
    h += '<div style="font-size:13px;color:#93a0c8;margin:-2px 0 4px 4px">Pedido ' + (m.idx + 1) + ' de ' + def.pasos.length + '</div>';
  }
  $('jCli').innerHTML = h;
}
function flPista() {
  var m = G.ms, def = m.def, pan = $('jPista');
  var combos = [], txt = '', i;
  if (def.modo === 'par') {
    for (i = 0; i < def.pasos.length; i++) { if (!m.done[i]) { combos = combos.concat(def.pasos[i].g || []); } }
  } else {
    var p = def.pasos[m.idx];
    combos = p.g || [];
    txt = p.pista || '';
  }
  var ver = def.guia || m.ayuda;
  var h = '';
  if (ver && combos.length) {
    var k;
    h += '<div class="lbl">Pista</div><div class="' + (def.guia ? 'pulsa' : '') + '">';
    for (k = 0; k < combos.length; k++) {
      if (k > 0) { h += '<span style="color:#93a0c8;margin:0 2px">›</span>'; }
      h += kcs(combos[k]);
    }
    h += '</div>';
  }
  if (m.ayuda && txt) { h += (h ? '' : '<div class="lbl">Pista</div>') + '<div class="txt">' + esc(txt) + '</div>'; }
  pan.innerHTML = h;
  setCls(pan, 'on', h !== '');
}
function flAyuda() {
  var m = G.ms;
  sfx('click');
  m.ayuda = !m.ayuda;
  if (m.ayuda && !m.def.guia) { m.usoAyuda = true; }
  setCls($('jAyuda'), 'on', m.ayuda);
  flPista();
}
function flKbp() {
  var def = G.ms.def, k = $('jKbp');
  G.kbHeld = {};
  if (!def.kb) { k.innerHTML = ''; rmCls(k, 'on'); return; }
  var h = '<div class="lbl">Teclado de práctica: tocá primero Ctrl, Alt, Shift o Win, y después la letra.</div><div class="teclas">', i;
  for (i = 0; i < def.kb.length; i++) { h += '<button class="vk" data-k="' + esc(def.kb[i]) + '">' + esc(def.kb[i]) + '</button>'; }
  k.innerHTML = h + '</div>';
  addCls(k, 'on');
  var bs = k.getElementsByTagName('button');
  for (i = 0; i < bs.length; i++) { (function (b) { b.onclick = function () { flVk(b.getAttribute('data-k')); }; })(bs[i]); }
}
function flVkPintar() {
  var bs = $('jKbp').getElementsByTagName('button'), i;
  for (i = 0; i < bs.length; i++) { setCls(bs[i], 'sost', !!G.kbHeld[bs[i].getAttribute('data-k')]); }
}
function flVk(label) {
  if (!G.env || G.ms.fin) { return; }
  if (label === 'Ctrl' || label === 'Alt' || label === 'Shift' || label === 'Win') {
    G.kbHeld[label] = !G.kbHeld[label];
    sfx('click'); flVkPintar();
    return;
  }
  var c = { ctrl: !!G.kbHeld.Ctrl, alt: !!G.kbHeld.Alt, shift: !!G.kbHeld.Shift, win: !!G.kbHeld.Win, key: label.toLowerCase() };
  G.kbHeld = {};
  flVkPintar();
  if (!G.env.combo(c)) { sfx('mal'); toast('Esa combinación no hace nada acá.'); }
}
function flTick() {
  var m = G.ms;
  if (!m || m.fin || G.pant !== 'juego') { return; }
  var ahora = new Date().getTime();
  $('jTiempo').textContent = fmtT(ahora - m.t0);
  if (ahora - m.t0 > 75000 && $('jPasar').style.display === 'none') { $('jPasar').style.display = ''; }
  var def = m.def, E = G.env, i;
  try {
    if (def.modo === 'par') {
      var todos = true;
      for (i = 0; i < def.pasos.length; i++) {
        if (!m.done[i] && def.pasos[i].ok(E)) { m.done[i] = true; sfx('ok'); flClientes(false); flPista(); }
        if (!m.done[i]) { todos = false; }
      }
      if (todos) { flTermino(); }
    } else {
      if (def.pasos[m.idx].ok(E)) {
        m.done[m.idx] = true;
        sfx('ok');
        if (m.idx < def.pasos.length - 1) {
          m.idx++;
          if (def.pasos[m.idx].ini) { def.pasos[m.idx].ini(E); }
          flClientes(true); flPista();
        } else { flTermino(); }
      }
    }
  } catch (err) { if (window.console) { console.log('error en el pedido', err); } }
}
function flPasar() {
  var m = G.ms;
  if (!m || m.fin) { return; }
  sfx('click');
  if (!flHecha(m.def.id)) { P.mis[m.def.id] = { e: 0, salt: 1, mejor: 0 }; svEscribir(); }
  var sig = flSigId(m.def.id);
  flFinMision();
  if (sig && flAbierta(sig)) { flIniciar(sig); } else { flMapa(); }
}
function flSigId(id) { var i = msIndice(id); return (i >= 0 && i < MS.length - 1) ? MS[i + 1].id : null; }
function flFinMision() {
  if (G.timer) { clearInterval(G.timer); G.timer = null; }
  if (G.env && G.env.destroy) { G.env.destroy(); }
  G.env = null;
  window.onbeforeunload = null;
}
function flSalirMision() {
  if (G.ms) { G.ms.fin = true; }
  flFinMision();
  flMapa();
}
function flTermino() {
  var m = G.ms, def = m.def;
  if (m.fin) { return; }
  m.fin = true;
  m.tFin = new Date().getTime();
  var ms = m.tFin - m.t0;
  if (G.timer) { clearInterval(G.timer); G.timer = null; }
  window.onbeforeunload = null;
  $('jTiempo').textContent = fmtT(ms);
  var prev = P.mis[def.id] || { e: 0, mejor: 0 };
  var estrellas = 1;
  if (def.jor > 0) {
    if (m.usoAyuda) { estrellas = 1; } else if (ms <= def.par * 1000) { estrellas = 3; } else { estrellas = 2; }
    if (!m.usoAyuda && ms <= def.par * 500) { P.rayo = true; }
  }
  var gana = 0;
  if (def.jor > 0) {
    if (estrellas > (prev.e || 0)) { gana = (estrellas - (prev.e || 0)) * 4 + (prev.e ? 0 : 3); }
    P.propinas += gana;
  }
  P.mis[def.id] = { e: Math.max(estrellas, prev.e || 0), mejor: (prev.mejor ? Math.min(prev.mejor, ms) : ms) };
  if (def.id === 'pro1') { P.pro.largo = ms; }
  if (def.id === 'pro2') { P.pro.corto = ms; }
  svEscribir();
  $('jProp').textContent = P.propinas;
  sfx('gana');
  setTimeout(function () { flResultado(estrellas, gana, ms); }, 650);
}
function flResultado(estrellas, gana, ms) {
  var m = G.ms, def = m.def;
  confeti($('stage'), 60);
  var sig = flSigId(def.id);
  var lastJor = sig === null || msPorId(sig).jor !== def.jor;
  var html = '', btnTxt = 'Siguiente pedido';
  if (def.id === 'pro1') {
    html = '<h2>Camino largo: ' + fmtS(ms) + '</h2><div style="margin:10px 0">' + arDon(110) + '</div><div class="dato"><b>Ahora viene lo bueno</b>El mismo trabajo, pero con el teclado. Ojo con el reloj.</div>';
    btnTxt = 'Camino corto';
  } else if (def.id === 'pro2') {
    var largo = P.pro.largo, corto = P.pro.corto, mx = Math.max(largo, corto, 1);
    var gift = flRegalo();
    html = '<h2>' + (gift > 0 ? '¡Te regalaste ' + gift + ' segundos!' : 'Casi empatamos') + '</h2>' +
      '<div class="barra"><i style="width:' + Math.round(largo / mx * 100) + '%;background:#ff6b6b"></i><span>Camino largo · ' + fmtS(largo) + '</span></div>' +
      '<div class="barra"><i style="width:' + Math.round(corto / mx * 100) + '%;background:#2ec4b6"></i><span>Camino corto · ' + fmtS(corto) + '</span></div>' +
      '<div class="dato"><b>Dato de compu</b>' + (gift > 0 ? 'Un trabajo de 3 copiados. Imaginá cuántos hacés en un año: los atajos son tiempo que te devuelven.' : 'Esta vez salió parecido. Con un poco de práctica, el atajo gana siempre.') + '</div>';
    btnTxt = 'Empezar la jornada 1';
  } else {
    var st = '', k;
    for (k = 0; k < 3; k++) { st += k < estrellas ? '★' : '<span class="vac">★</span>'; }
    var titulo = (def.pasos.length > 1 || def.modo === 'par') ? '¡Pedidos listos!' : '¡Pedido listo!';
    if (lastJor && def.jor >= 1 && def.jor <= 3) { titulo = '¡Jornada ' + def.jor + ' terminada!'; }
    if (def.jor === 4 && lastJor) { titulo = '¡Turno de noche terminado!'; }
    html = '<h2>' + titulo + '</h2><div class="estrellas">' + st + '</div><div class="propi">' + (gana > 0 ? '+' + gana + ' <span class="moneda"></span> de propina' : (estrellas >= 3 ? 'Ya tenías las tres estrellas' : 'Con más práctica salen las tres')) + ' · ' + fmtT(ms) + '</div>';
    if (def.dato) { html += '<div class="dato"><b>Dato de compu</b>' + esc(def.dato) + '</div>'; }
    if (m.usoAyuda) { html += '<div style="margin-top:10px;font-size:15px;color:#93a0c8">Usaste la ayuda: sin ayuda salen más estrellas.</div>'; }
    if (lastJor) { btnTxt = (def.jor === 3 ? 'Ir a la misión real' : 'Volver al mapa'); }
  }
  var card = flCapa(html + '<div class="fila"><button class="btnChico" id="rMenu">Mapa</button><button class="btnChico" id="rRep">Repetir</button><button class="btnGrande" id="rSig">' + btnTxt + '</button></div>');
  G.capaOk = function () { $('rSig').onclick(); };
  $('rMenu').onclick = function () { sfx('click'); flFinMision(); flMapa(); };
  $('rRep').onclick = function () { sfx('click'); flFinMision(); flIniciar(def.id); };
  $('rSig').onclick = function () {
    sfx('click');
    flFinMision();
    if (def.id === 'pro1') { flIniciar('pro2'); return; }
    if (def.id === 'pro2') { flIniciar('j1a'); return; }
    if (lastJor) {
      if (def.jor === 3) { flMapa(); flReal(); } else { flMapa(); }
      return;
    }
    flIniciar(sig);
  };
  flLogrosRevisar();
}

/* ---------------- logros y credencial ---------------- */
function flLogrosRevisar() {
  var i, nuevos = [];
  for (i = 0; i < LOGROS.length; i++) {
    var L = LOGROS[i];
    if (!P.logros[L.id] && L.ok()) { P.logros[L.id] = 1; nuevos.push(L); }
  }
  if (nuevos.length) {
    svEscribir();
    for (i = 0; i < nuevos.length; i++) {
      (function (L, n) { setTimeout(function () { toast(L.n, 'Logro nuevo'); sfx('logro'); }, 800 + n * 900); })(nuevos[i], i);
    }
  }
}
function flLogros() {
  var h = '<h2>Logros</h2><div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px;text-align:left">', i;
  for (i = 0; i < LOGROS.length; i++) {
    var L = LOGROS[i], t = !!P.logros[L.id];
    h += '<div style="padding:10px 14px;border-radius:14px;background:' + (t ? '#173a3a' : '#0e1633') + ';border:1px solid ' + (t ? '#2a9d8f' : '#2a3a6e') + ';opacity:' + (t ? 1 : 0.7) + '"><div style="font-size:18px;font-weight:800;color:' + (t ? '#fff4dc' : '#93a0c8') + '">' + (t ? '★ ' : '') + esc(L.n) + '</div><div style="font-size:14px;color:#aebbe6;margin-top:2px">' + esc(L.d) + '</div></div>';
  }
  h += '</div><div class="fila"><button class="btnGrande" id="lgCer">Cerrar</button></div>';
  var c = flCapa(h);
  c.style.width = '780px';
  $('lgCer').onclick = function () { sfx('click'); flCapaCerrar(); };
  G.capaOk = function () { flCapaCerrar(); };
}
function flCredencial() {
  var lista = '', i;
  for (i = 0; i < CNT_NOMBRES.length; i++) {
    var n = P.cnt[CNT_NOMBRES[i][0]] || 0;
    if (n > 0) { lista += '<li><b>' + n + '</b> · ' + esc(CNT_NOMBRES[i][1]) + ' <span style="color:#93a0c8">' + esc(CNT_NOMBRES[i][2]) + '</span></li>'; }
  }
  if (!lista) { lista = '<li style="column-span:all">Todavía no usaste ningún atajo. ¡Arrancá por el primer día!</li>'; }
  var h = '<div class="cred"><div>' + arYo(P.color, 120) + '</div><div class="cuerpo"><h3>' + esc(P.nombre) + '</h3><div style="font-size:18px;color:#dfe6ff;margin-top:4px">Pasante del Ciber Don Atajo · ★ ' + flEstrellasTotales() + ' · ' + P.propinas + ' propinas · ' + flRegalo() + ' s regalados</div>' +
    '<div style="margin-top:12px;font-size:14px;color:#ffd166;font-weight:700;text-transform:uppercase;letter-spacing:.5px">Atajos que usaste de verdad</div><ul>' + lista + '</ul></div></div>' +
    '<div class="fila"><button class="btnGrande" id="crCer">Cerrar</button></div>';
  var c = flCapa(h);
  c.style.width = '760px';
  $('crCer').onclick = function () { sfx('click'); flCapaCerrar(); };
  G.capaOk = function () { flCapaCerrar(); };
}

/* ---------------- misión real ---------------- */
function flReal() {
  flMostrar('real');
  flCapaCerrar();
  var h = '<div id="rTit"><h1>La misión real</h1><p>Ahora en la compu de verdad, sin juego. Hacé cada uno y mostráselo al profe.</p></div><div id="rLista">', i;
  for (i = 0; i < REALES.length; i++) {
    h += '<button class="rIt' + (P.real[i] ? ' ok' : '') + '" data-i="' + i + '"><span class="chk">✓</span><span class="q">' + esc(REALES[i][0]) + '</span>' + kcs(REALES[i][1]) + '</button>';
  }
  h += '</div><div id="rPie"><div class="av" id="rAv"></div><button class="btnChico" id="rMapa">Volver al mapa</button><button class="btnChico" id="rCred">Credencial</button></div>';
  $('real').innerHTML = h;
  flRealTexto();
  var bs = $('rLista').getElementsByTagName('button');
  for (i = 0; i < bs.length; i++) {
    (function (b) {
      b.onclick = function () {
        var k = parseInt(b.getAttribute('data-i'), 10);
        P.real[k] = !P.real[k];
        setCls(b, 'ok', !!P.real[k]);
        sfx(P.real[k] ? 'ok' : 'click');
        svEscribir();
        flRealTexto();
        if (flRealesHechos() >= 8) { confeti($('stage'), 60); sfx('gana'); flLogrosRevisar(); }
      };
    })(bs[i]);
  }
  $('rMapa').onclick = function () { sfx('click'); flMapa(); };
  $('rCred').onclick = function () { sfx('click'); flCredencial(); };
}
function flRealTexto() {
  var n = flRealesHechos();
  $('rAv').textContent = n >= 8 ? '¡Listo! Sos un pasante certificado del Ciber Don Atajo.' : 'Llevás ' + n + ' de 8. Los atajos con Win funcionan en las compus con Windows.';
}

/* ---------------- docente ---------------- */
function flDocente() {
  var h = '<h2>Panel del docente</h2><div style="text-align:left;margin-top:14px;font-size:18px;color:#dfe6ff;line-height:1.6">' +
    '<div>Jornadas abiertas: <b>' + (P.todo ? 'todas' : 'en orden') + '</b></div><div>Guardado en esta compu: <b>' + (G.saveOk ? 'sí' : 'no (la compu no lo permite)') + '</b></div></div>' +
    '<div class="fila" style="flex-wrap:wrap"><button class="btnChico" id="dcTodo">' + (P.todo ? 'Volver al orden' : 'Abrir todas') + '</button><button class="btnChico" id="dcSon">' + flBtnSon() + '</button><button class="btnChico" id="dcBorrar">Nuevo jugador</button><button class="btnGrande" id="dcCer">Cerrar</button></div>';
  flCapa(h);
  G.capaOk = function () { flCapaCerrar(); };
  $('dcTodo').onclick = function () { P.todo = !P.todo; svEscribir(); flCapaCerrar(); if (G.pant === 'mapa') { flMapa(); } };
  $('dcSon').onclick = function () { flAlternarSonido($('dcSon')); };
  $('dcBorrar').onclick = function () {
    if (G.confirmaBorrar) { svBorrar(); P = pNuevo(); G.confirmaBorrar = false; flCapaCerrar(); flMostrar('portada'); flPortada(); return; }
    G.confirmaBorrar = true; $('dcBorrar').textContent = 'Tocá otra vez para borrar todo'; sfx('mal');
  };
  $('dcCer').onclick = function () { flCapaCerrar(); };
}

/* ---------------- teclado global ---------------- */
function flKeyup(e) {
  if (e.key === 'PrintScreen' && G.env && G.env.key && G.pant === 'juego' && !G.ms.fin) { G.env.key(e); }
}
function flKey(e) {
  if (G.capaOk && (e.key === 'Enter') && document.activeElement && document.activeElement.tagName !== 'INPUT') { e.preventDefault(); G.capaOk(); return; }
  if (e.shiftKey && (e.key === 'D' || e.key === 'd') && (G.pant === 'mapa' || G.pant === 'portada') && !(document.activeElement && (document.activeElement.tagName === 'INPUT' || document.activeElement.tagName === 'TEXTAREA'))) {
    e.preventDefault(); flDocente(); return;
  }
  if (G.pant !== 'juego' || !G.env || !G.ms || G.ms.fin) { return; }
  var handled = G.env.key(e);
  if (handled) { return; }
  var k = (e.key || '').toLowerCase();
  var c = { ctrl: e.ctrlKey, alt: e.altKey, shift: e.shiftKey, win: e.metaKey, key: k };
  var reservado = (c.ctrl && !c.alt && (k === 't' || k === 'w' || k === 'tab')) || (c.ctrl && c.shift && k === 'n') || (c.alt && k === 'tab') || (c.win && (k === 'e' || k === 'd' || k === 's'));
  if (reservado && G.env.combo(c)) { e.preventDefault(); }
}

/* ---------------- arranque ---------------- */
function flArrancar() {
  var g = svLeer();
  P = g || pNuevo();
  var base = pNuevo(), k;
  for (k in base) { if (base.hasOwnProperty(k) && P[k] === undefined) { P[k] = base[k]; } }
  escalar();
  window.addEventListener('resize', escalar, false);
  document.addEventListener('keydown', flKey, false);
  document.addEventListener('keyup', flKeyup, false);
  document.addEventListener('contextmenu', function (e) {
    if (G.pant !== 'juego') { return; }
    var t = e.target;
    while (t && t !== document) { if (t.id === 'simIn') { return; } t = t.parentNode; }
    e.preventDefault();
  }, false);
  flMostrar('portada');
  flPortada();
}
window.onload = flArrancar;
</script>
