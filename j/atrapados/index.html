<body>

        <button class="btn sec" id="bPista" onclick="pedirPista()">Pedir una pista</button></div>

<script>
/* ════════════════════════════════════════════════════════════════
   ATRAPADOS EN LA COMPU · sala de escape para 3.º, 4.º y 5.º
   Un solo archivo, sin internet, JavaScript ES5.
   ════════════════════════════════════════════════════════════════ */
function $(id){ return document.getElementById(id); }
function esc(t){ return String(t).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }
function norm(s){
  s = String(s || '').toUpperCase();
  s = s.replace(/[ÁÀÄ]/g, 'A').replace(/[ÉÈË]/g, 'E').replace(/[ÍÌÏ]/g, 'I').replace(/[ÓÒÖ]/g, 'O').replace(/[ÚÙÜ]/g, 'U');
  return s.replace(/[^A-Z0-9Ñ]/g, '');
}

/* ── sonido ─────────────────────────────────────────────────────── */
var AC = null, sonido = true;
function tono(f, dur, tipo, vol, hasta, demora){
  if (!sonido) return;
  try {
    if (!AC){ var C = window.AudioContext || window.webkitAudioContext; if (!C) return; AC = new C(); }
    if (AC.state === 'suspended' && AC.resume) AC.resume();
    var t = AC.currentTime + (demora || 0), o = AC.createOscillator(), g = AC.createGain();
    o.type = tipo; o.frequency.setValueAtTime(f, t);
    if (hasta) o.frequency.exponentialRampToValueAtTime(hasta, t + dur);
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + 0.01); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(AC.destination); o.start(t); o.stop(t + dur + 0.03);
  } catch(e){}
}
function sonClic(){ tono(520, 0.05, 'triangle', 0.08); }
function sonBien(){ tono(660, 0.12, 'sine', 0.16); tono(880, 0.2, 'sine', 0.14, 0, 0.1); }
function sonMal(){ tono(220, 0.25, 'square', 0.10, 130); }
function sonPuerta(){ tono(392, 0.12, 'sine', 0.16); tono(523, 0.12, 'sine', 0.16, 0, 0.11); tono(659, 0.12, 'sine', 0.16, 0, 0.22); tono(784, 0.35, 'sine', 0.18, 0, 0.33); }
function sonVirus(){ tono(140, 0.4, 'sawtooth', 0.14, 60); tono(300, 0.15, 'square', 0.08, 200, 0.2); }

/* ── guardado ───────────────────────────────────────────────────── */
var CLAVE = 'escape_compu_v1', guardaOK = true, TOTAL = 45 * 60 * 1000;
var COSTO = {pista: 90 * 1000, trampa: 150 * 1000, error: 20 * 1000};
var S = nuevo();
function nuevo(){ return {equipo:'', fase:'inicio', t:TOTAL, hecho:{}, pistas:{}, trampas:0, errores:0, sala:0, p:{}, salida:null, bonus:{}}; }
function guardar(){ try { window.localStorage.setItem(CLAVE, JSON.stringify(S)); } catch(e){ guardaOK = false; } }
function cargar(){
  try { var r = window.localStorage.getItem(CLAVE); if (r){ var o = JSON.parse(r); if (o && o.hecho) S = o; } } catch(e){ guardaOK = false; }
  try { window.localStorage.setItem('esc_prueba', '1'); window.localStorage.removeItem('esc_prueba'); } catch(e){ guardaOK = false; }
}
function P(id){ if (!S.p[id]) S.p[id] = {}; return S.p[id]; }

/* ── dibujos ────────────────────────────────────────────────────── */
var POLILLA = '<svg width="58" height="50" viewBox="0 0 58 50"><ellipse cx="15" cy="20" rx="14" ry="11" fill="#7E5BC4"/><ellipse cx="43" cy="20" rx="14" ry="11" fill="#7E5BC4"/>' +
  '<ellipse cx="17" cy="36" rx="10" ry="8" fill="#9C7CE0"/><ellipse cx="41" cy="36" rx="10" ry="8" fill="#9C7CE0"/><circle cx="15" cy="20" r="4" fill="#D9C9FF"/><circle cx="43" cy="20" r="4" fill="#D9C9FF"/>' +

  '<path d="M27 12 Q22 3 17 4" stroke="#3A2A5E" stroke-width="2" fill="none"/><path d="M31 12 Q36 3 41 4" stroke="#3A2A5E" stroke-width="2" fill="none"/></svg>';
var ICO = [
  '<svg width="22" height="16" viewBox="0 0 22 16"><rect x="1" y="2" width="20" height="12" rx="2" fill="none" stroke="currentColor" stroke-width="2"/><rect x="4" y="5" width="3" height="2" fill="currentColor"/><rect x="9" y="5" width="3" height="2" fill="currentColor"/><rect x="14" y="5" width="3" height="2" fill="currentColor"/><rect x="6" y="9" width="10" height="2" fill="currentColor"/></svg>',
  '<svg width="22" height="16" viewBox="0 0 22 16"><rect x="3" y="3" width="16" height="10" rx="1" fill="none" stroke="currentColor" stroke-width="2"/><rect x="6" y="6" width="3" height="4" fill="currentColor"/><rect x="13" y="6" width="3" height="4" fill="currentColor"/><path d="M5 1v2M9 1v2M13 1v2M17 1v2M5 13v2M9 13v2M13 13v2M17 13v2" stroke="currentColor" stroke-width="1.5"/></svg>',
  '<svg width="22" height="16" viewBox="0 0 22 16"><rect x="1" y="1" width="20" height="11" rx="2" fill="none" stroke="currentColor" stroke-width="2"/><rect x="8" y="12" width="6" height="2" fill="currentColor"/><rect x="5" y="14" width="12" height="1.5" fill="currentColor"/></svg>',
  '<svg width="22" height="16" viewBox="0 0 22 16"><ellipse cx="11" cy="4" rx="9" ry="3" fill="none" stroke="currentColor" stroke-width="2"/><path d="M2 4v8c0 1.7 4 3 9 3s9-1.3 9-3V4" fill="none" stroke="currentColor" stroke-width="2"/></svg>',

];

var SALAS = [
  {nombre:'El teclado', intro:'Están adentro de la computadora. La primera parte que tocan es el teclado: por acá entra todo lo que la máquina sabe de vos.',

var AC_ = [
  /* sala 0 · teclado */

  else if (!avisoCero){ avisoCero = true; decir('Se te acabó la batería. Podés seguir, pero la compu ya está en modo ahorro. Jijiji.'); }
  if (++ticks % 5 === 0) guardar();

  S.salida = {bat: pct(), usado: TOTAL - S.t}; sonPuerta(); guardar(); mostrarFin();
}
function mostrarFin(){
  var s = S.salida, np = 0, k;
  for (k in S.pistas) if (S.pistas.hasOwnProperty(k) && AX[k] && AX[k].sala < 5) np += S.pistas[k];
  $('fin').innerHTML = '<h1 class="festejo">¡ESCAPASTE!</h1><p style="color:#8DB3A2;font-size:17px">Polilla quedó encerrado en la papelera. <b style="color:#E3A857">' + esc(S.equipo) + '</b>, sos libre.</p>' +
    '<div class="diploma"><table>' +
    '<tr><td>Batería que te quedó</td><td class="v" style="color:#6EE7B7;font-size:28px">' + s.bat + ' %</td></tr>' +
    '<tr><td>Pistas pedidas</td><td class="v">' + np + '</td></tr>' +
    '<tr><td>Respuestas equivocadas</td><td class="v">' + S.errores + '</td></tr>' +
    '<tr><td>Trampas en las que caíste</td><td class="v">' + S.trampas + '</td></tr>' +
    '<tr><td>Archivos secretos</td><td class="v">' + contarBonus() + ' de 5</td></tr></table></div>' +
    '<p style="color:#8DB3A2">Avisale al profe cuánta batería te quedó.</p>' +
    (contarBonus() < 5 ? '<button class="grande" onclick="irBonus()">Abrir los archivos secretos de Polilla</button>' : '<p style="color:#B794F4;font-weight:bold">Resolviste los archivos secretos. Sos leyenda.</p>');
  mostrar('fin');
}
function contarBonus(){ var n = 0, i, ids = ['X1', 'X2', 'X3', 'X4', 'X5']; for (i = 0; i < ids.length; i++) if (S.hecho[ids[i]]) n++; return n; }
function irBonus(){ S.sala = 5; S.fase = 'juego'; guardar(); mostrar('juego'); render(); decir(SALAS[5].polilla); }

function init(){
  cargar();
  reloj = setInterval(tic, 1000);
  vistaInicio();
}
init();

</script>
