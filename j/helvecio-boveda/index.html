<div id="wrap">

<script>
/* ENGINE_START */
var DX = [0, 1, 0, -1], DY = [-1, 0, 1, 0];
function parseSol(str) {
  var out = [], p = str.split(/\s+/), i, w;
  for (i = 0; i < p.length; i++) {
    w = p[i]; if (!w) continue;
    if (w === 'F' || w === 'L' || w === 'R' || w === 'ELSE' || w === 'END' || w === 'P1' || w === 'P2') out.push({t: w});
    else if (w.indexOf('REP') === 0) out.push({t: 'REP', n: parseInt(w.substring(3), 10)});
    else if (w === 'IF' || w === 'WHILE') { out.push({t: w, s: p[++i]}); }
  }
  return out;
}
function parseMaze(rows, dir) {
  var m = {w: rows[0].length, h: rows.length, wall: [], keys: {}, nkeys: 0, sx: 0, sy: 0, gx: 0, gy: 0, dir: dir}, x, y, c;
  for (y = 0; y < m.h; y++) { m.wall[y] = [];
    for (x = 0; x < m.w; x++) { c = rows[y].charAt(x); m.wall[y][x] = (c === '#');
      if (c === 'S') { m.sx = x; m.sy = y; }
      if (c === 'G') { m.gx = x; m.gy = y; }
      if (c === 'K') { m.keys[x + ',' + y] = 1; m.nkeys++; } } }
  return m;
}
function isFree(m, x, y) { return x >= 0 && y >= 0 && x < m.w && y < m.h && !m.wall[y][x]; }
function sense(m, st, s) {
  var d = st.d, fx = st.x + DX[d], fy = st.y + DY[d], l = (d + 3) % 4, r = (d + 1) % 4;
  switch (s) {
    case 'LIBRE': return isFree(m, fx, fy);
    case 'PARED': return !isFree(m, fx, fy);
    case 'LIBRE_IZQ': return isFree(m, st.x + DX[l], st.y + DY[l]);
    case 'PARED_IZQ': return !isFree(m, st.x + DX[l], st.y + DY[l]);
    case 'LIBRE_DER': return isFree(m, st.x + DX[r], st.y + DY[r]);
    case 'PARED_DER': return !isFree(m, st.x + DX[r], st.y + DY[r]);
    case 'NO_META': return !(st.x === m.gx && st.y === m.gy);
    case 'EN_META': return st.x === m.gx && st.y === m.gy;
    case 'HAY_LLAVE': return m.keys[st.x + ',' + st.y] === 1 && !st.got[st.x + ',' + st.y];
  }
  return false;
}
/* Convierte tokens planos en arbol. Devuelve {ok, tree, err} */
function buildTree(tokens) {
  var root = [], stack = [{list: root, owner: null}], i, tk, top, node;
  for (i = 0; i < tokens.length; i++) {
    tk = tokens[i]; top = stack[stack.length - 1];
    if (tk.t === 'END') {
      if (stack.length === 1) return {ok: false, err: 'Hay un FIN que no cierra nada.'};
      stack.pop();
    } else if (tk.t === 'ELSE') {
      if (!top.owner || top.owner.t !== 'IF' || top.owner.inElse) return {ok: false, err: 'SINO solo va dentro de un SI.'};
      top.owner.inElse = true; top.list = top.owner.no;
    } else if (tk.t === 'REP' || tk.t === 'IF' || tk.t === 'WHILE') {
      node = {t: tk.t, n: tk.n, s: tk.s, body: [], no: [], inElse: false};
      top.list.push(node); stack.push({list: node.body, owner: node});
    } else top.list.push({t: tk.t});
  }
  if (stack.length > 1) return {ok: false, err: 'Falta cerrar un bloque con FIN.'};
  return {ok: true, tree: root};
}
function checkProcs(P1, P2, main) {
  var i;
  for (i = 0; i < P1.length; i++) if (P1[i].t === 'P1' || P1[i].t === 'P2') return 'P1 no puede llamar a otros procedimientos.';
  for (i = 0; i < P2.length; i++) if (P2[i].t === 'P2') return 'P2 no puede llamarse a si mismo.';
  return null;
}
/* Ejecuta. Devuelve {trace:[estados], result:'ok'|'bump'|'loop'|'nogoal'|'nokeys', steps} */
function run(m, trees, budget) {
  var st = {x: m.sx, y: m.sy, d: m.dir, keys: m.keys, got: {}, ngot: 0}, trace = [], count = 0, res = null;
  trace.push({x: st.x, y: st.y, d: st.d, got: 0});
  function snap(kind) { trace.push({x: st.x, y: st.y, d: st.d, got: st.ngot, kind: kind}); }
  function exec(list) {
    var i, k, node, nx, ny;
    for (i = 0; i < list.length && !res; i++) {
      node = list[i];
      if (++count > budget) { res = 'loop'; return; }
      switch (node.t) {
        case 'F':
          nx = st.x + DX[st.d]; ny = st.y + DY[st.d];
          if (!isFree(m, nx, ny)) { snap('bump'); res = 'bump'; return; }
          st.x = nx; st.y = ny;
          if (m.keys[nx + ',' + ny] && !st.got[nx + ',' + ny]) { st.got[nx + ',' + ny] = 1; st.ngot++; }
          snap('move'); break;
        case 'L': st.d = (st.d + 3) % 4; snap('turn'); break;
        case 'R': st.d = (st.d + 1) % 4; snap('turn'); break;
        case 'P1': exec(trees.P1); break;
        case 'P2': exec(trees.P2); break;
        case 'REP': for (k = 0; k < node.n && !res; k++) exec(node.body); break;
        case 'IF': if (sense(m, st, node.s)) exec(node.body); else exec(node.no); break;
        case 'WHILE': while (!res && sense(m, st, node.s)) { if (++count > budget) { res = 'loop'; return; } exec(node.body); } break;
      }
    }
  }
  exec(trees.main);
  if (!res) {
    if (st.x !== m.gx || st.y !== m.gy) res = 'nogoal';
    else if (st.ngot < m.nkeys) res = 'nokeys';
    else res = 'ok';
  }
  return {trace: trace, result: res, steps: count};
}
function countBlocks(tokens) { var n = 0, i; for (i = 0; i < tokens.length; i++) if (tokens[i].t !== 'END') n++; return n; }
/* Evalua un programa {main,P1,P2} (listas de tokens) contra todos los laberintos de un nivel */
function evaluate(level, prog) {
  var tm = buildTree(prog.main), t1 = buildTree(prog.P1), t2 = buildTree(prog.P2), err, i, r, out = [];
  if (!tm.ok) return {ok: false, err: tm.err};
  if (!t1.ok) return {ok: false, err: 'En P1: ' + t1.err};
  if (!t2.ok) return {ok: false, err: 'En P2: ' + t2.err};
  err = checkProcs(prog.P1, prog.P2, prog.main); if (err) return {ok: false, err: err};
  for (i = 0; i < level.mazes.length; i++) {
    r = run(level.mazes[i], {main: tm.tree, P1: t1.tree, P2: t2.tree}, 4000);
    out.push(r);
  }
  return {ok: true, runs: out};
}
/* ENGINE_END */
/* LEVELS_START */
function movesOf(sol) {
  var P = {main: buildTree(parseSol(sol.main)).tree, P1: sol.P1 ? buildTree(parseSol(sol.P1)).tree : [], P2: sol.P2 ? buildTree(parseSol(sol.P2)).tree : []}, out = '';
  function ex(l) { var i, k, n; for (i = 0; i < l.length; i++) { n = l[i];
    if (n.t === 'F' || n.t === 'L' || n.t === 'R') out += n.t; else if (n.t === 'P1') ex(P.P1); else if (n.t === 'P2') ex(P.P2);
    else if (n.t === 'REP') for (k = 0; k < n.n; k++) ex(n.body); } }
  ex(P.main); return out;
}
function mk(spec) {
  var cells = {}, x = spec.s[0], y = spec.s[1], hist = [[x, y, spec.d]], i, c, h, minx = x, maxx = x, miny = y, maxy = y, keys = {}, k, rows = [], r, row, end, pos;
  function put(px, py) { cells[px + ',' + py] = 1; if (px < minx) minx = px; if (px > maxx) maxx = px; if (py < miny) miny = py; if (py > maxy) maxy = py; }
  function carve(px, py, pd, moves, rec) {
    var j, ch;
    for (j = 0; j < moves.length; j++) { ch = moves.charAt(j);
      if (ch === 'L') pd = (pd + 3) % 4; else if (ch === 'R') pd = (pd + 1) % 4;
      else { px += DX[pd]; py += DY[pd]; put(px, py); if (rec) hist.push([px, py, pd]); } }
    return [px, py];
  }
  put(x, y);
  end = carve(x, y, spec.d, spec.m || movesOf(spec.sol), true);
  for (i = 0; spec.br && i < spec.br.length; i++) { h = hist[spec.br[i][0]]; carve(h[0], h[1], h[2], spec.br[i][1], false); }
  for (i = 0; spec.keys && i < spec.keys.length; i++) { c = spec.keys[i];
    if (typeof c === 'number') { h = hist[c]; keys[h[0] + ',' + h[1]] = 1; }
    else { h = hist[c[0]]; pos = carve(h[0], h[1], h[2], c[1], false); keys[pos[0] + ',' + pos[1]] = 1; } }
  for (r = miny - 1; r <= maxy + 1; r++) { row = '';
    for (k = minx - 1; k <= maxx + 1; k++) {
      if (k === spec.s[0] && r === spec.s[1]) row += 'S';
      else if (k === end[0] && r === end[1]) row += 'G';
      else if (keys[k + ',' + r]) row += 'K';
      else row += cells[k + ',' + r] ? '.' : '#'; }
    rows.push(row); }
  return rows;
}
var LEVELS = [];
function add(o) { var i, a = []; for (i = 0; i < o.specs.length; i++) { if (o.sol && !o.specs[i].m) o.specs[i].sol = o.sol; a.push(parseMaze(mk(o.specs[i]), o.specs[i].d)); } o.mazes = a; LEVELS.push(o); }
var CORR = 'WHILE NO_META IF LIBRE F ELSE IF LIBRE_IZQ L ELSE R END END END';
var LH = 'WHILE NO_META IF LIBRE_IZQ L F ELSE IF LIBRE F ELSE R END END END';
var RH = 'WHILE NO_META IF LIBRE_DER R F ELSE IF LIBRE F ELSE L END END END';
/* LEVELS_DATA */
