#coments{position:absolute;left:950px;top:8px;width:300px;height:704px;border-radius:22px;background:#12121b;border:1px solid #23233a;box-shadow:0 30px 80px rgba(0,0,0,.6);transform:translateX(40px);opacity:0;pointer-events:none;transition:transform .35s cubic-bezier(.22,.8,.2,1),opacity .25s;z-index:6;display:flex;flex-direction:column}

/* ---------- revelación ---------- */
#revP{background:#000}
#barras{position:absolute;left:24px;right:24px;top:18px;display:flex;gap:6px;z-index:10}

.slide.on{display:block;animation:entra .6s cubic-bezier(.22,.8,.2,1)}

.sT{position:absolute;left:90px;right:90px;font-weight:800;letter-spacing:-2px;line-height:1.02}

.dato{position:relative;width:1100px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.14);border-radius:24px;padding:22px 28px 22px 100px;font-size:23px;line-height:1.4;font-weight:500}
.dato .di{position:absolute;left:24px;top:50%;margin-top:-28px;width:56px;height:56px;border-radius:16px;display:flex;align-items:center;justify-content:center}

@keyframes respiraB{50%{transform:scale(1.03)}}

.mini{position:absolute;width:150px;height:266px;border-radius:14px;overflow:hidden;background:#000;box-shadow:0 12px 30px rgba(0,0,0,.4)}

/* comparar, desafío, cierre */
.panel{position:absolute;inset:0}
.btnG{height:60px;padding:0 34px;border-radius:30px;background:#fff;color:#111;font-size:19px;font-weight:800;transition:transform .15s,box-shadow .15s;box-shadow:0 12px 30px rgba(0,0,0,.25)}

.cierreCard h3{font-size:26px;margin-top:16px;letter-spacing:-.5px}

#confeti{position:absolute;inset:0;pointer-events:none;z-index:50}

/* ---------- animaciones de las escenas ---------- */
.esc *{animation-iteration-count:infinite;animation-timing-function:ease-in-out}
.balanceo{animation-name:balanceo;animation-duration:2.6s}@keyframes balanceo{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
.respira{animation-name:respira;animation-duration:3s}@keyframes respira{50%{transform:scale(1.03,.97)}}
.salta{animation-name:salta}@keyframes salta{0%,100%{transform:translateY(0) scale(1.06,.94)}20%{transform:translateY(0) scale(1)}50%{transform:translateY(-120px) scale(.97,1.04)}80%{transform:translateY(0)}}
.asoma{animation-name:asoma}@keyframes asoma{0%,100%{transform:translateY(150px)}35%,75%{transform:translateY(0)}}
.cola{animation-name:cola;animation-duration:1.8s}@keyframes cola{0%,100%{transform:rotate(-8deg)}50%{transform:rotate(10deg)}}
.colaPerro{animation-name:colaP;animation-duration:.35s}@keyframes colaP{0%,100%{transform:rotate(-14deg)}50%{transform:rotate(16deg)}}
.oreja,.oreja2{animation-name:oreja;animation-duration:1.4s}@keyframes oreja{0%,100%{transform:rotate(0)}50%{transform:rotate(-6deg)}}
.oreja2{animation-name:oreja2}@keyframes oreja2{50%{transform:rotate(6deg)}}
.parpadea{animation-name:parpadea;animation-duration:3.8s}@keyframes parpadea{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
.lengua{animation-name:lengua;animation-duration:.5s}@keyframes lengua{50%{transform:scaleY(1.2)}}

function tiempoTxt(ms) { var s = Math.round(ms / 1000), m = Math.floor(s / 60); s = s % 60; return (m ? m + ' min ' : '') + s + ' s'; }
function calcularDatos() {

  D.nVideos = S.hist.filter(function (v) { return !v.anuncio; }).length;
  D.ms = ahora() - S.tFeed; D.tiempo = tiempoTxt(D.ms);
  D.likes = 0; var i; for (i in S.liked) if (S.liked[i] && i.indexOf('ad') !== 0) D.likes++;
  // porcentajes
  var tot = 0, usarN = false; for (i = 0; i < P.length; i++) tot += Math.max(0, P[i].interes);
  if (tot < 2) { usarN = true; tot = 0; for (i = 0; i < P.length; i++) tot += P[i].n; }
  for (i = 0; i < P.length; i++) P[i].pct = Math.round(100 * (usarN ? P[i].n : Math.max(0, P[i].interes)) / Math.max(1, tot));
  if (usarN) P.sort(function (a, b) { return b.n - a.n; });

  var ult = D.seq.slice(-10), en2 = 0, cnt = {}, k;

  var orden = []; for (k in cnt) orden.push([k, cnt[k]]); orden.sort(function (a, b) { return b[1] - a[1]; });
  D.finTop = orden.slice(0, 2).map(function (x) { return x[0]; });
  for (i = 0; i < ult.length; i++) if (D.finTop.indexOf(ult[i]) >= 0) en2++;
  D.finFrac = Math.round(en2 / Math.max(1, ult.length) * 10);
  var u15 = D.seq.slice(-15);
  D.desaparecidos = CATS.filter(function (c) { return u15.indexOf(c.id) < 0; }).map(function (c) { return c.id; });
  // hechos
  D.hechos = [];
  var largo = null; for (i = 0; i < V.length; i++) if (!largo || V[i].seg > largo.seg) largo = V[i];
  if (largo && largo.seg >= 3) D.hechos.push({ ic: 'reloj', c: CAT[largo.cat].color, t: 'Miraste <b>«' + esc(largo.v.titulo) + '»</b> durante <b>' + Math.round(largo.seg) + ' segundos</b>.' + (largo.seg > largo.v.largo * 1.4 ? ' Lo viste más de una vez seguida.' : '') });
  var silen = null;
  for (i = 0; i < P.length; i++) { var c = P[i]; if (c.likes === 0 && c.n >= 2 && c.seg / c.n >= 0.8 * 8) { silen = c; break; } }
  if (silen) D.hechos.push({ ic: 'ojo', c: CAT[silen.cat].color, t: 'Nunca le diste me gusta a un video de <b>' + CAT[silen.cat].nombre + '</b>… pero los mirabas casi enteros. Eso también cuenta.' });
  else if (D.likes === 0) D.hechos.push({ ic: 'ojo', c: '#5ee7ff', t: 'No me diste <b>ningún me gusta</b>. No hizo falta: con lo que mirabas, me alcanzó.' });
  var rap = null;
  for (i = 0; i < P.length; i++) if (P[i].rapidos >= 2 && (!rap || P[i].rapidos / P[i].n > rap.rapidos / rap.n)) rap = P[i];
  if (rap) D.hechos.push({ ic: 'rayo', c: CAT[rap.cat].color, t: 'A los videos de <b>' + CAT[rap.cat].nombre + '</b> los pasabas en <b>menos de un segundo</b>. Por eso casi no volvieron a aparecer.' });
  var seguidos = []; for (k in S.sigo) if (S.sigo[k]) seguidos.push(k);
  if (D.hechos.length < 3 && seguidos.length) D.hechos.push({ ic: 'persona', c: '#ff5fa2', t: 'Seguiste a <b>@' + seguidos[0] + '</b>. Desde ese momento, te mostré más de lo que sube.' });
  if (D.hechos.length < 3) {
    var mitad = Math.floor(V.length / 2), a = 0, b = 0;
    for (i = 0; i < V.length; i++) { if (i < mitad) a += V[i].seg; else b += V[i].seg; }
    a /= Math.max(1, mitad); b /= Math.max(1, V.length - mitad);
    if (b > a * 1.15) D.hechos.push({ ic: 'reloj', c: '#ffb36b', t: 'Al principio mirabas cada video <b>' + a.toFixed(0) + ' s</b>. Al final, <b>' + b.toFixed(0) + ' s</b>. El feed te enganchaba cada vez más.' });
    else if (D.likes > 0) { var lc = {}; for (i = 0; i < V.length; i++) if (V[i].like) lc[V[i].cat] = (lc[V[i].cat] || 0) + 1; var mx = null; for (k in lc) if (!mx || lc[k] > lc[mx]) mx = k; D.hechos.push({ ic: 'corazon', c: '#ff2d6f', t: 'Le diste me gusta a <b>' + D.likes + ' videos</b>. La mayoría, de <b>' + CAT[mx].nombre + '</b>.' }); }
  }
  D.hechos = D.hechos.slice(0, 3);

}
