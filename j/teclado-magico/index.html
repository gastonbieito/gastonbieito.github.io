<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Teclado mágico · Colegio Sagrado Corazón</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:#f6efe0;font-family:"Trebuchet MS",Arial,sans-serif;-webkit-user-select:none;user-select:none;cursor:default}
#stage{position:absolute;left:0;top:0;width:1280px;height:720px;transform-origin:0 0;overflow:hidden;background:#fdf4e3}
#fondo{position:absolute;left:0;top:0;width:1280px;height:720px}
#flores,#animales,#extras{position:absolute;left:0;top:0;width:1280px;height:720px;pointer-events:none}
#fx{position:absolute;left:0;top:0;width:1280px;height:720px;pointer-events:none}
#extras{z-index:1000}
#fx{z-index:1001}
#coleccion{z-index:1002}
#portada{z-index:1003}
.sol{cursor:pointer;pointer-events:auto}
.rayos{transform-box:fill-box;transform-origin:center;animation:gira 30s linear infinite}
@keyframes gira{to{transform:rotate(360deg)}}
.sol.risa .cara{transform-box:fill-box;transform-origin:center;animation:risa .6s ease-in-out}
@keyframes risa{0%,100%{transform:scale(1) rotate(0)}30%{transform:scale(1.2) rotate(-12deg)}60%{transform:scale(1.1) rotate(12deg)}}
.nube{animation:nube 60s linear infinite}
@keyframes nube{from{transform:translateX(-300px)}to{transform:translateX(1500px)}}

/* animales */
.bicho{position:absolute;width:300px;height:340px;pointer-events:none}
.bicho .halo{position:absolute;left:20px;top:30px;width:260px;height:260px;border-radius:50%;opacity:.0;transform:scale(.3);transition:all .5s cubic-bezier(.2,1.6,.4,1)}
.bicho.vivo .halo{opacity:.85;transform:scale(1)}
.bicho .cuerpo{position:absolute;left:10px;top:20px;width:280px;height:280px;pointer-events:auto;cursor:pointer;transform-origin:50% 100%}
.bicho .cuerpo svg{width:100%;height:100%;display:block;overflow:visible}
.bicho.entra .cuerpo{animation:entra .7s cubic-bezier(.2,1.6,.4,1)}
@keyframes entra{0%{transform:translateY(260px) scale(.2,1.4)}55%{transform:translateY(-30px) scale(1.15,.85)}75%{transform:translateY(0) scale(.92,1.08)}100%{transform:translateY(0) scale(1)}}
.bicho.baila .cuerpo{animation:baila 1.1s ease-in-out infinite}
@keyframes baila{0%,100%{transform:rotate(-6deg)}50%{transform:rotate(6deg) translateY(-8px)}}
.bicho.salta .cuerpo{animation:salta .9s ease-in-out infinite}
@keyframes salta{0%,100%{transform:translateY(0) scale(1.04,.96)}45%{transform:translateY(-36px) scale(.96,1.05)}}
.bicho.mece .cuerpo{animation:mece 1.6s ease-in-out infinite}
@keyframes mece{0%,100%{transform:scale(1) rotate(0)}25%{transform:scale(1.06,.95) rotate(-3deg)}75%{transform:scale(.95,1.06) rotate(3deg)}}
.bicho.apretado .cuerpo{animation:aprieta .45s cubic-bezier(.2,1.8,.4,1)}
@keyframes aprieta{0%{transform:scale(1.3,.7)}60%{transform:scale(.85,1.2) translateY(-20px)}100%{transform:scale(1)}}
.bicho.sale .cuerpo{animation:sale .7s ease-in forwards}
.bicho.sale .halo,.bicho.sale .cartel{opacity:0;transition:opacity .3s}
@keyframes sale{0%{transform:scale(1)}30%{transform:translateY(20px) scale(1.15,.8)}100%{transform:translateY(-700px) scale(.6,1.2) rotate(20deg)}}
.bicho.festeja .cuerpo{animation:festeja 1.25s ease-in-out}
@keyframes festeja{0%{transform:translateY(0) scale(1)}12%{transform:translateY(0) scale(1.18,.82)}34%{transform:translateY(-95px) scale(.9,1.12) rotate(-6deg)}50%{transform:translateY(-110px) scale(1) rotate(6deg)}66%{transform:translateY(0) scale(1.16,.84) rotate(0)}78%{transform:translateY(-34px) scale(.96,1.05)}90%{transform:translateY(0) scale(1.06,.94)}100%{transform:translateY(0) scale(1)}}
.an .ojo{transform-box:fill-box;transform-origin:center;animation:parpadea 3.7s infinite}
@keyframes parpadea{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
.an .ala{transform-box:fill-box;transform-origin:50% 100%;animation:ala .12s linear infinite}
@keyframes ala{50%{transform:scaleY(.75)}}
.an .chorro{transform-box:fill-box;transform-origin:50% 100%;animation:chorro .8s ease-in-out infinite}
@keyframes chorro{50%{transform:scaleY(1.25)}}
.an .pelota{transform-box:fill-box;transform-origin:center;animation:pelota 1s ease-in-out infinite}
@keyframes pelota{50%{transform:translateY(-10px) rotate(180deg)}}
.an .lengua{transform-box:fill-box;transform-origin:50% 0;animation:lengua .5s ease-in-out infinite}
@keyframes lengua{50%{transform:scaleY(1.2)}}
.cartel{position:absolute;left:50%;top:-34px;margin-left:-46px;width:92px;text-align:center;opacity:0;transform:scale(.2);transition:all .45s cubic-bezier(.2,1.8,.4,1) .15s}
.bicho.vivo .cartel{opacity:1;transform:scale(1)}
.cartel .letra{width:84px;height:84px;margin:0 auto;border-radius:50%;background:#fff;border:6px solid #2b2b3a;font-family:"Arial Black",Arial;font-size:52px;line-height:70px;color:#2b2b3a;box-shadow:0 6px 0 rgba(43,43,58,.25)}
.cartel .nom{display:inline-block;margin-top:4px;background:#2b2b3a;color:#fff;font-weight:bold;font-size:17px;padding:2px 12px;border-radius:12px;white-space:nowrap}

/* coleccion */
#coleccion{position:absolute;left:50%;top:10px;transform:translateX(-50%);display:flex;gap:6px;background:rgba(255,255,255,.65);padding:6px 10px;border-radius:30px;border:3px solid rgba(43,43,58,.15)}
.slot{width:48px;height:48px;border-radius:50%;background:#efe6d3;position:relative;overflow:hidden}
.slot svg{position:absolute;left:2px;top:2px;width:44px;height:44px;filter:brightness(0);opacity:.13}
.slot.ok{background:#fff;box-shadow:0 0 0 3px #ffd23f}
.slot.ok svg{filter:none;opacity:1}
.slot.nuevo{animation:slotPop .6s cubic-bezier(.2,1.8,.4,1)}
@keyframes slotPop{0%{transform:scale(2)}100%{transform:scale(1)}}

/* números y globos */
#numero{position:absolute;left:50%;top:130px;width:220px;height:220px;margin-left:-110px;border-radius:50%;background:#fff;border:10px solid #2b2b3a;font-family:"Arial Black",Arial;font-size:150px;line-height:196px;text-align:center;color:#e5484d;display:none;box-shadow:0 12px 0 rgba(43,43,58,.2)}
#numero.ver{display:block;animation:numPop .5s cubic-bezier(.2,1.8,.4,1)}
@keyframes numPop{from{transform:scale(0) rotate(-30deg)}to{transform:scale(1) rotate(0)}}
.globo{position:absolute;width:90px;height:150px;animation:sube 3.2s ease-in forwards}
@keyframes sube{0%{transform:translateY(0)}100%{transform:translateY(-980px)}}
.globo svg{width:100%;height:100%;overflow:visible}

.flor{position:absolute;width:60px;height:90px;transform-origin:50% 100%;animation:crece .6s cubic-bezier(.2,1.8,.4,1)}
@keyframes crece{from{transform:scale(0)}to{transform:scale(1)}}
.flor svg{width:100%;height:100%;overflow:visible}
.flor .cab{transform-box:fill-box;transform-origin:center;animation:florGira 6s linear infinite}
@keyframes florGira{to{transform:rotate(360deg)}}
#arcoiris{position:absolute;left:190px;top:100px;width:900px;height:500px;pointer-events:none;overflow:visible;visibility:hidden}
#arcoiris.ver{visibility:visible}
#arcoiris .banda{fill:none;stroke-width:30;stroke-linecap:round;stroke-dasharray:1 1;stroke-dashoffset:1}
#arcoiris.ver .banda{animation:pinta 1.3s cubic-bezier(.35,.05,.25,1) forwards}
#arcoiris.ver .banda:nth-child(2){animation-delay:.06s}#arcoiris.ver .banda:nth-child(3){animation-delay:.12s}#arcoiris.ver .banda:nth-child(4){animation-delay:.18s}#arcoiris.ver .banda:nth-child(5){animation-delay:.24s}#arcoiris.ver .banda:nth-child(6){animation-delay:.3s}
@keyframes pinta{to{stroke-dashoffset:0}}
#arcoiris .brillo{fill:none;stroke:#fff;stroke-width:6;stroke-linecap:round;opacity:0}
#arcoiris.ver .brillo{animation:brilla 3.2s ease-in-out forwards}
@keyframes brilla{0%,35%{opacity:0}50%{opacity:.55}100%{opacity:.25}}
#arcoiris .nubeA{transform-box:fill-box;transform-origin:50% 80%;transform:scale(0)}
#arcoiris.ver .nubeA{animation:nubePop .55s cubic-bezier(.2,1.8,.4,1) forwards}
#arcoiris.ver .nubeB{animation-delay:1.05s}
@keyframes nubePop{to{transform:scale(1)}}
#arcoiris.chau{animation:chau .8s ease-in forwards}
@keyframes chau{to{opacity:0;transform:translateY(-20px)}}

/* desfile final */
.desfile{position:absolute;bottom:20px;width:150px;height:150px;animation:marcha 9s linear forwards}
.desfile svg{width:100%;height:100%;animation:salta .5s ease-in-out infinite}
@keyframes marcha{from{transform:translateX(-200px)}to{transform:translateX(1500px)}}

/* el colegio */
#marca{position:absolute;left:0;right:0;top:80px;display:flex;justify-content:center;align-items:center;gap:16px}
#marca .lg{width:66px;height:66px;flex:none}
#marca .tx{text-align:left;color:#2b4f63;line-height:1.15}
#marca .t1{font-family:"Arial Black",Arial;font-size:22px;letter-spacing:1px}
#marca .t2{font-size:17px;font-weight:bold}
#marca .t3{font-size:14px;font-weight:bold;color:#3e8e5a;letter-spacing:1px}
#sello{position:absolute;left:10px;bottom:10px;z-index:1002;display:none;align-items:center;gap:8px;background:rgba(255,253,246,.88);border:3px solid #2e86b5;border-radius:30px;padding:4px 14px 4px 4px;pointer-events:none}
#sello.ver{display:flex}
#sello .lg{width:42px;height:42px}
#sello .tx{color:#2b4f63;font-weight:bold;font-size:13px;line-height:1.15}
#sello .tx b{font-family:"Arial Black",Arial;font-size:13px;letter-spacing:.5px}

/* portada */
#portada{position:absolute;left:0;top:0;width:1280px;height:720px;background:rgba(253,244,227,.55);text-align:center;transition:opacity .5s}
#portada.fuera{opacity:0;pointer-events:none}
#tit1{position:absolute;left:0;right:0;top:150px;font-family:"Arial Black",Arial;font-size:84px;color:#2b5876;letter-spacing:2px;text-shadow:0 6px 0 #ffd23f,0 11px 0 rgba(43,43,58,.25)}
#tit1 span{display:inline-block;animation:letraSalta 2.2s ease-in-out infinite}
@keyframes letraSalta{0%,70%,100%{transform:translateY(0)}80%{transform:translateY(-22px)}}
#teclado{position:absolute;left:415px;top:290px;width:450px;height:171px}
#teclado .k{animation:tecla 2.4s infinite}
@keyframes tecla{0%,80%,100%{fill:#fff;transform:translateY(0)}85%{fill:#ffd23f;transform:translateY(5px)}}
#tit2{position:absolute;left:0;right:0;top:474px;font-family:"Arial Black",Arial;font-size:38px;color:#e5484d;animation:late 1.4s ease-in-out infinite}
@keyframes late{50%{transform:scale(1.08)}}
#asoman{position:absolute;left:0;bottom:-30px;width:1280px;height:230px}
#asoman .as{position:absolute;bottom:0;width:190px;height:190px;animation:asoma 2.8s ease-in-out infinite}
@keyframes asoma{0%,100%{transform:translateY(60px)}50%{transform:translateY(0)}}
#profe{position:absolute;right:14px;bottom:12px;display:flex;gap:8px}
#profe button{font-family:"Trebuchet MS";font-weight:bold;font-size:14px;padding:8px 12px;border-radius:12px;border:3px solid #2b2b3a;background:#fff;cursor:pointer}
#profe button.off{background:#c9c2b2;color:#555}
</style>
</head>
<body>
<div id="stage">
  <svg id="fondo" viewBox="0 0 1280 720">
    <defs><linearGradient id="cielo" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#bfe2f2"/><stop offset=".7" stop-color="#fdf4e3"/></linearGradient></defs>
    <rect width="1280" height="720" fill="url(#cielo)"/>
    <g class="sol" id="sol" transform="translate(1170 280) scale(0.85)"><g class="rayos"><path d="M0 -110 L12 -76 L-12 -76 Z M0 110 L12 76 L-12 76 Z M-110 0 L-76 12 L-76 -12 Z M110 0 L76 12 L76 -12 Z M78 -78 L62 -46 L46 -62 Z M-78 78 L-62 46 L-46 62 Z M78 78 L46 62 L62 46 Z M-78 -78 L-46 -62 L-62 -46 Z" fill="#f7c948"/></g><g class="cara"><circle r="64" fill="#ffd95a" stroke="#2b2b3a" stroke-width="5"/><circle cx="-22" cy="-8" r="7" fill="#2b2b3a"/><circle cx="22" cy="-8" r="7" fill="#2b2b3a"/><path d="M-24 16 Q0 38 24 16" fill="none" stroke="#2b2b3a" stroke-width="5" stroke-linecap="round"/><circle cx="-38" cy="12" r="9" fill="#ff8fa3" opacity=".7"/><circle cx="38" cy="12" r="9" fill="#ff8fa3" opacity=".7"/></g></g>
    <g class="nube" style="animation-delay:-10s"><path d="M300 150 q20 -40 60 -20 q30 -40 70 0 q40 0 30 30 H300 Z" fill="#fff" opacity=".9"/></g>
    <g class="nube" style="animation-delay:-35s;animation-duration:80s"><path d="M600 90 q20 -40 60 -20 q30 -40 70 0 q40 0 30 30 H600 Z" fill="#fff" opacity=".85"/></g>
    <g class="nube" style="animation-delay:-55s;animation-duration:70s"><path d="M200 230 q14 -28 42 -14 q22 -28 50 0 q28 0 22 22 H200 Z" fill="#fff" opacity=".8"/></g>
    <path d="M0 520 Q200 420 420 500 Q640 410 860 490 Q1080 420 1280 500 V720 H0 Z" fill="#b8d8a8"/>
    <path d="M0 600 Q320 540 640 590 Q960 540 1280 600 V720 H0 Z" fill="#9fc98a"/>
    <path d="M0 660 Q320 630 640 655 Q960 630 1280 660 V720 H0 Z" fill="#8bbd74"/>
    <g fill="#7aae64"><circle cx="70" cy="470" r="46"/><circle cx="120" cy="490" r="38"/><circle cx="1180" cy="460" r="50"/><circle cx="1230" cy="486" r="40"/></g>
    <path d="M86 520 V470 M1196 520 V470" stroke="#8a5a3b" stroke-width="10"/>
  </svg>
  <svg id="arcoiris" viewBox="0 0 900 500"><g><path class="banda" pathLength="1" d="M50 440 A400 400 0 0 1 850 440" stroke="#ff6b6b"/><path class="banda" pathLength="1" d="M78 440 A372 372 0 0 1 822 440" stroke="#ffa94d"/><path class="banda" pathLength="1" d="M106 440 A344 344 0 0 1 794 440" stroke="#ffe066"/><path class="banda" pathLength="1" d="M134 440 A316 316 0 0 1 766 440" stroke="#69db7c"/><path class="banda" pathLength="1" d="M162 440 A288 288 0 0 1 738 440" stroke="#4dabf7"/><path class="banda" pathLength="1" d="M190 440 A260 260 0 0 1 710 440" stroke="#b197fc"/></g><path class="brillo" d="M58 440 A392 392 0 0 1 842 440"/><g class="nubeA "><g transform="translate(110 438)" stroke="#2b2b3a" stroke-width="3" fill="#fff"><path d="M-82 18 q-26 0 -26 -24 q0 -24 28 -22 q6 -34 42 -30 q16 -30 52 -18 q34 -10 44 24 q34 -2 36 26 q2 24 -26 24 Z"/></g><g transform="translate(110 438)" fill="#2b2b3a"><circle cx="-22" cy="-6" r="4"/><circle cx="16" cy="-6" r="4"/><path d="M-10 4 q7 7 14 0" stroke="#2b2b3a" stroke-width="3" fill="none" stroke-linecap="round"/></g><g transform="translate(110 438)" fill="#ffb3c1" opacity=".8"><circle cx="-36" cy="4" r="6"/><circle cx="30" cy="4" r="6"/></g></g><g class="nubeA nubeB"><g transform="translate(790 438)" stroke="#2b2b3a" stroke-width="3" fill="#fff"><path d="M-82 18 q-26 0 -26 -24 q0 -24 28 -22 q6 -34 42 -30 q16 -30 52 -18 q34 -10 44 24 q34 -2 36 26 q2 24 -26 24 Z"/></g><g transform="translate(790 438)" fill="#2b2b3a"><circle cx="-22" cy="-6" r="4"/><circle cx="16" cy="-6" r="4"/><path d="M-10 4 q7 7 14 0" stroke="#2b2b3a" stroke-width="3" fill="none" stroke-linecap="round"/></g><g transform="translate(790 438)" fill="#ffb3c1" opacity=".8"><circle cx="-36" cy="4" r="6"/><circle cx="30" cy="4" r="6"/></g></g></svg>
  <div id="flores"></div>
  <div id="animales"></div>
  <div id="extras"><div id="numero"></div></div>
  <canvas id="fx" width="1280" height="720"></canvas>
  <div id="coleccion"></div>
  <div id="sello"><div class="lg" id="lgSello"></div><div class="tx"><b>COLEGIO SAGRADO CORAZÓN</b><br>de Jesús y de María · Rosario</div></div>
  <div id="portada">
    <div id="marca"><div class="lg" id="lgMarca"></div><div class="tx"><div class="t1">COLEGIO SAGRADO CORAZÓN</div><div class="t2">de Jesús y de María · Rosario</div><div class="t3">STAND DE INFORMÁTICA Y ROBÓTICA</div></div></div>
    <div id="tit1"></div>
    <svg id="teclado" viewBox="0 0 500 190"></svg>
    <div id="tit2">¡Tocá cualquier tecla!</div>
    <div id="asoman"></div>
    <div id="profe"><button id="bMus">MÚSICA: SÍ</button><button id="bSon">SONIDOS: SÍ</button><button id="bFull">PANTALLA COMPLETA</button></div>
  </div>
</div>
<script>
/* ============ ANIMALES (SVG 200 x 200) ============ */
var LN = '#2b2b3a';
var KS = 'stroke="' + LN + '" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"';
var KS3 = 'stroke="' + LN + '" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round"';

function ojosA(x1, x2, y, r, sep) {
  r = r || 11;
  var s = '<g class="ojo">', i, xs = [x1, x2];
  for (i = 0; i < 2; i++) {
    s += '<circle cx="' + xs[i] + '" cy="' + y + '" r="' + r + '" fill="' + LN + '"/>';
    s += '<circle cx="' + (xs[i] + r * 0.35) + '" cy="' + (y - r * 0.38) + '" r="' + (r * 0.38) + '" fill="#fff"/>';
    s += '<circle cx="' + (xs[i] - r * 0.3) + '" cy="' + (y + r * 0.35) + '" r="' + (r * 0.16) + '" fill="#fff"/>';
  }
  return s + '</g>';
}
function cachetes(x1, x2, y, r, c) { return '<ellipse cx="' + x1 + '" cy="' + y + '" rx="' + (r || 11) + '" ry="' + ((r || 11) * 0.65) + '" fill="' + (c || '#ff8fa3') + '" opacity=".75"/><ellipse cx="' + x2 + '" cy="' + y + '" rx="' + (r || 11) + '" ry="' + ((r || 11) * 0.65) + '" fill="' + (c || '#ff8fa3') + '" opacity=".75"/>'; }
function sonrisa(x, y, w, abierta) {
  if (abierta) return '<path d="M' + (x - w) + ' ' + y + ' Q' + x + ' ' + (y + w * 1.4) + ' ' + (x + w) + ' ' + y + ' Z" fill="#7a2335" ' + KS3 + '/><path d="M' + (x - w * 0.5) + ' ' + (y + w * 0.7) + ' Q' + x + ' ' + (y + w * 0.45) + ' ' + (x + w * 0.5) + ' ' + (y + w * 0.7) + ' Q' + x + ' ' + (y + w * 1.1) + ' ' + (x - w * 0.5) + ' ' + (y + w * 0.7) + ' Z" fill="#ff7b8a"/>';
  return '<path d="M' + (x - w) + ' ' + y + ' Q' + x + ' ' + (y + w * 0.9) + ' ' + (x + w) + ' ' + y + '" fill="none" ' + KS3 + '/>';
}

var ANIMALES = [
  { id: 'abeja', letra: 'A', nombre: 'abeja', fondo: '#ffe28a', voz: 'abeja', d: function () {
    return '<g class="ala"><ellipse cx="62" cy="62" rx="30" ry="40" fill="#d9f1ff" opacity=".9" ' + KS3 + ' transform="rotate(-25 62 62)"/><ellipse cx="138" cy="62" rx="30" ry="40" fill="#d9f1ff" opacity=".9" ' + KS3 + ' transform="rotate(25 138 62)"/></g>' +
      '<path d="M100 186 l-8 12 h16 Z" fill="' + LN + '"/><ellipse cx="100" cy="128" rx="62" ry="62" fill="#ffc93c" ' + KS + '/>' +
      '<path d="M44 108 Q100 120 156 108 L160 128 Q100 142 40 128 Z M48 152 Q100 164 152 152 L146 168 Q100 178 54 168 Z" fill="' + LN + '"/>' +
      '<path d="M78 70 Q66 34 54 30 M122 70 Q134 34 146 30" fill="none" ' + KS3 + '/><circle cx="54" cy="30" r="7" fill="' + LN + '"/><circle cx="146" cy="30" r="7" fill="' + LN + '"/>' +
      ojosA(80, 120, 92, 11) + cachetes(62, 138, 106, 9) + sonrisa(100, 100, 13, false);
  } },
  { id: 'ballena', letra: 'B', nombre: 'ballena', fondo: '#bfe3f5', voz: 'ballena', d: function () {
    return '<g class="chorro"><path d="M100 40 Q96 20 80 14 M100 40 Q104 16 122 12 M100 40 V8" fill="none" stroke="#5cc8f0" stroke-width="6" stroke-linecap="round"/><circle cx="78" cy="12" r="6" fill="#9fdcff"/><circle cx="124" cy="10" r="6" fill="#9fdcff"/></g>' +
      '<path d="M168 112 Q196 84 192 70 Q178 92 160 98 Z M168 118 Q198 132 196 148 Q176 132 160 128 Z" fill="#4a90c8" ' + KS + '/>' +
      '<path d="M20 120 Q20 52 100 52 Q172 52 172 120 Q172 172 96 172 Q20 172 20 120 Z" fill="#4a90c8" ' + KS + '/>' +
      '<path d="M30 140 Q96 176 162 136 Q150 168 96 170 Q42 170 30 140 Z" fill="#cfe9f7"/><path d="M50 150 v14 M70 156 v14 M92 158 v12 M114 156 v12 M136 150 v12" stroke="#9cc3dc" stroke-width="3"/>' +
      ojosA(60, 104, 106, 10) + cachetes(46, 118, 124, 9) + sonrisa(82, 126, 14, true);
  } },
  { id: 'chancho', letra: 'C', nombre: 'chancho', fondo: '#ffd3dc', voz: 'chancho', d: function () {
