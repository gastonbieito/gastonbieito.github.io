<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Robotito pintor · Colegio Sagrado Corazón</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:#1d2340;font-family:"Segoe UI","Helvetica Neue",Roboto,Arial,sans-serif;color:#2b2b3a;user-select:none;-webkit-user-select:none;cursor:default}
#marco{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
#stage{position:relative;width:1280px;height:720px;flex:none;overflow:hidden;background:#fff6e8}
.pant{position:absolute;inset:0;display:none}
.pant.on{display:block}
button{font-family:inherit;border:0;background:none;cursor:pointer;outline:none;color:inherit}
svg{display:block}
.btnR{width:78px;height:78px;border-radius:50%;background:#fff;box-shadow:0 6px 0 rgba(0,0,0,.13),0 10px 24px rgba(0,0,0,.08);display:flex;align-items:center;justify-content:center;transition:transform .12s}
.btnR:hover{transform:translateY(-3px)}
.btnR:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(0,0,0,.15)}
.btnR svg{width:44px;height:44px}
/* fondo de taller de arte */
.taller{position:absolute;inset:0;background:radial-gradient(circle at 15% 20%,#ffe3ef 0,rgba(255,227,239,0) 30%),radial-gradient(circle at 85% 80%,#dff4ff 0,rgba(223,244,255,0) 35%),radial-gradient(circle at 80% 15%,#fff3c4 0,rgba(255,243,196,0) 30%),#fff8ee}
.mancha{position:absolute;border-radius:50% 45% 55% 50%/55% 50% 45% 50%;opacity:.5}

/* ---------- inicio ---------- */
#inicio .titulo{position:absolute;left:0;right:0;top:40px;text-align:center}
#inicio .titulo h1{font-size:76px;font-weight:900;letter-spacing:-2px;line-height:1}
#inicio .titulo h1 span{display:inline-block;animation:letra 2.4s ease-in-out infinite}
@keyframes letra{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
#robots{position:absolute;left:0;right:0;top:220px;display:flex;justify-content:center;gap:34px}
.robCard{width:220px;height:270px;border-radius:36px;background:#fff;display:flex;align-items:center;justify-content:center;transition:transform .2s,box-shadow .2s;box-shadow:0 8px 0 rgba(0,0,0,.07)}
.robCard svg{width:190px;height:190px}
.robCard:hover,.robCard.sel{transform:translateY(-10px) scale(1.04);box-shadow:0 14px 0 rgba(0,0,0,.08),0 0 0 8px #ffcc1f}
.robCard.sel .rob{animation:saltito .6s ease-in-out infinite}
#marcaIni{position:absolute;left:24px;bottom:18px;display:flex;align-items:center;gap:10px;font-size:14px;font-weight:700;color:#2b5d8a;background:#fff;padding:8px 16px 8px 8px;border-radius:30px;box-shadow:0 4px 0 rgba(0,0,0,.06)}
#marcaIni svg{width:40px;height:40px}
@keyframes saltito{50%{transform:translateY(-8px)}}
.manito{position:absolute;width:90px;height:90px;pointer-events:none;z-index:60;filter:drop-shadow(0 6px 8px rgba(0,0,0,.25));transition:left .6s cubic-bezier(.4,0,.2,1),top .6s cubic-bezier(.4,0,.2,1)}
.manito.toca svg{animation:toca .5s ease-in-out}
@keyframes toca{50%{transform:scale(.82) translateY(6px)}}

/* ---------- tutorial ---------- */
#tuto .tablero{position:absolute;left:290px;top:110px;width:700px;height:460px;border-radius:40px;background:#fff;box-shadow:0 10px 0 rgba(0,0,0,.06)}
#teclado{position:absolute;left:390px;top:300px;width:500px;height:250px}
.tecla{position:absolute;width:140px;height:110px;border-radius:24px;background:#eef1f7;box-shadow:0 10px 0 #c9cfdc;display:flex;align-items:center;justify-content:center;transition:background .2s,transform .1s,box-shadow .1s}
.tecla svg{width:60px;height:60px}
.tecla.brilla{background:#ffcc1f;box-shadow:0 10px 0 #e0a800,0 0 0 10px rgba(255,204,31,.35);animation:brillaT 1s ease-in-out infinite}
@keyframes brillaT{50%{box-shadow:0 10px 0 #e0a800,0 0 0 22px rgba(255,204,31,.15)}}
.tecla.ok{background:#69db7c;box-shadow:0 4px 0 #2f9e44;transform:translateY(6px)}
.tecla.mal{animation:sacude .35s}
@keyframes sacude{20%,60%{transform:translateX(-10px)}40%,80%{transform:translateX(10px)}}
#tutoRobot{position:absolute;width:160px;height:160px;left:560px;top:120px;transition:transform .35s cubic-bezier(.3,1.5,.5,1)}
#tutoPuntos{position:absolute;left:0;right:0;top:610px;display:flex;justify-content:center;gap:16px}
#tutoPuntos i{width:30px;height:30px;border-radius:50%;background:#e9e2d6;transition:background .3s,transform .3s}
#tutoPuntos i.ok{background:#ffcc1f;transform:scale(1.2)}

/* ---------- nivel ---------- */
#camino{position:absolute;left:210px;right:210px;top:30px;height:40px;display:flex;align-items:center;justify-content:center;gap:8px}
#camino i{width:22px;height:22px;border-radius:7px;background:#ebe3d4;transition:all .3s}
#camino i.hecho{transform:scale(.9)}
#camino i.ahora{width:34px;height:34px;border-radius:10px;box-shadow:0 0 0 5px rgba(255,204,31,.6)}
#bLibre{position:absolute;left:24px;top:14px}
#bGaleria{position:absolute;left:114px;top:14px}
#bRepetir{position:absolute;right:24px;top:14px}
#tablero{position:absolute;border-radius:26px;background:#fff;box-shadow:0 12px 0 rgba(0,0,0,.06),0 0 0 6px #f3e9d8;padding:12px}
.celda{position:absolute;border-radius:12px;background:#f6f1e8;transition:background .25s}
.celda.pint{animation:pinta .35s cubic-bezier(.3,1.6,.5,1)}
@keyframes pinta{0%{transform:scale(.6)}100%{transform:scale(1)}}
.guia{position:absolute;border-radius:50%;pointer-events:none;transition:opacity .3s}
.balde{position:absolute;display:flex;align-items:center;justify-content:center}
.balde svg{width:100%;height:100%}
.balde.toma svg{animation:balde .5s}
@keyframes balde{40%{transform:scale(1.25) rotate(-10deg)}}
#robot{position:absolute;transition:left .28s cubic-bezier(.4,.1,.3,1),top .28s cubic-bezier(.4,.1,.3,1);z-index:5}
#robot .giro{width:100%;height:100%;transition:transform .2s}
#robot .rob{width:100%;height:100%}
#robot .pincel{position:absolute;right:-12%;bottom:4%;width:42%;height:42%}
#robot.choca .giro{animation:choca .4s}
@keyframes choca{20%{transform:translateX(-8px) rotate(-6deg)}40%{transform:translateX(8px) rotate(6deg)}60%{transform:translateX(-5px)}80%{transform:translateX(4px)}}
#robot.festeja .rob{animation:festejaA .6s ease-in-out infinite}
@keyframes festejaA{0%,100%{transform:translateY(0) scale(1)}40%{transform:translateY(-24px) scale(.95,1.08)}70%{transform:translateY(0) scale(1.08,.92)}}

#panelD{position:absolute;right:28px;top:100px;width:330px;bottom:20px}
#modelo{position:absolute;left:35px;top:0;width:260px;height:250px;border-radius:26px;background:#fff;box-shadow:0 8px 0 rgba(0,0,0,.06);padding:18px;display:flex;align-items:center;justify-content:center}
#modelo:before{content:"";position:absolute;inset:8px;border:4px solid #c9a46b;border-radius:20px;pointer-events:none}
#modelo svg{max-width:100%;max-height:100%;width:100%;height:100%}
#modelo .pinza{position:absolute;top:-18px;left:50%;margin-left:-22px;width:44px;height:30px;border-radius:8px;background:#ff8a1f;box-shadow:0 4px 0 #d96b00}
#pinturaAct{position:absolute;left:35px;top:262px;width:260px;height:44px;border-radius:22px;background:#fff;box-shadow:0 5px 0 rgba(0,0,0,.06);display:flex;align-items:center;justify-content:center;gap:10px}
#pinturaAct i{width:120px;height:22px;border-radius:11px;display:block;background:#e3ddd2;transition:background .3s}
#pinturaAct svg{width:32px;height:32px}
#pad{position:absolute;left:40px;top:322px;width:250px;height:250px}
.flecha{position:absolute;width:80px;height:80px;border-radius:22px;background:#fff;box-shadow:0 7px 0 rgba(0,0,0,.12);display:flex;align-items:center;justify-content:center;transition:transform .1s,background .2s,box-shadow .1s}
.flecha svg{width:46px;height:46px}
.flecha.apreta{transform:translateY(6px);box-shadow:0 1px 0 rgba(0,0,0,.12);background:#ffe066}
.flecha.pistaF{animation:pistaFl 1s ease-in-out infinite}
@keyframes pistaFl{0%,100%{box-shadow:0 7px 0 rgba(0,0,0,.12),0 0 0 0 rgba(255,204,31,.9)}50%{box-shadow:0 7px 0 rgba(0,0,0,.12),0 0 0 14px rgba(255,204,31,0);background:#fff3bf}}
#fArr{left:85px;top:0}#fIzq{left:0;top:85px}#fDer{left:170px;top:85px}#fAba{left:85px;top:170px}
#centroPad{position:absolute;left:85px;top:85px;width:80px;height:80px;display:flex;align-items:center;justify-content:center}
#centroPad svg{width:76px;height:76px}

/* programa (etapa 4): bandeja debajo del tablero */
#programa{position:absolute;left:40px;top:560px;width:850px;height:140px;display:none}
#programa.on{display:block}
#bandeja{position:absolute;left:0;top:0;width:620px;height:140px;border-radius:24px;background:#fff;box-shadow:0 8px 0 rgba(0,0,0,.06)}
.slot{position:absolute;width:62px;height:56px;border-radius:14px;background:#f6f1e8;border:3px dashed #e3d8c6}
.carta{position:absolute;width:62px;height:56px;border-radius:14px;background:#9b6bff;box-shadow:0 5px 0 #7a4be0;display:flex;align-items:center;justify-content:center;animation:cartaIn .25s cubic-bezier(.3,1.6,.5,1)}
.carta svg{width:34px;height:34px}
.carta.activa{background:#ffcc1f;box-shadow:0 5px 0 #e0a800,0 0 0 5px rgba(255,204,31,.4)}
@keyframes cartaIn{from{transform:scale(.3)}to{transform:scale(1)}}
#bPlay{position:absolute;left:640px;top:8px;width:130px;height:80px;border-radius:40px;background:#40c057;box-shadow:0 8px 0 #2b8a3e;display:flex;align-items:center;justify-content:center}
#bPlay svg{width:44px;height:44px}
#bPlay.apreta{transform:translateY(6px);box-shadow:0 2px 0 #2b8a3e}
#bBorrar,#bLimpiar{position:absolute;top:98px;width:60px;height:42px;border-radius:21px;background:#fff;box-shadow:0 5px 0 rgba(0,0,0,.12);display:flex;align-items:center;justify-content:center}
#bBorrar{left:640px}#bLimpiar{left:710px}
#bBorrar svg,#bLimpiar svg{width:28px;height:28px}

/* ganaste: el dibujo cobra vida */
#ganaste{position:absolute;inset:0;background:rgba(40,30,20,.5);display:none;z-index:40}
#ganaste.on{display:block;animation:fadeIn .3s}
@keyframes fadeIn{from{opacity:0}}
#gCuadro{position:absolute;left:410px;top:46px;width:460px;height:440px;border-radius:30px;background:#fff;box-shadow:0 0 0 18px #c9a46b,0 0 0 26px #a8854d,0 30px 60px rgba(0,0,0,.3);display:flex;align-items:center;justify-content:center;padding:50px;animation:popIn .6s cubic-bezier(.3,1.5,.5,1)}
@keyframes popIn{from{transform:scale(.4) rotate(-8deg);opacity:0}}
#gDib{width:100%;height:100%}
#gDib svg{width:100%;height:100%}
.vida-late{animation:vLate .9s ease-in-out infinite}
@keyframes vLate{0%,100%{transform:scale(1)}15%{transform:scale(1.12)}30%{transform:scale(1)}45%{transform:scale(1.08)}}
.vida-gira{animation:vGira 3s ease-in-out infinite}
@keyframes vGira{0%{transform:rotate(0) scale(1)}50%{transform:rotate(180deg) scale(.9)}100%{transform:rotate(360deg) scale(1)}}
.vida-salta{animation:vSalta .8s ease-in-out infinite}
@keyframes vSalta{0%,100%{transform:translateY(0) scale(1.04,.96)}50%{transform:translateY(-34px) scale(.97,1.04)}}
.vida-balancea{animation:vBal 1.6s ease-in-out infinite;transform-origin:50% 100%}
@keyframes vBal{0%,100%{transform:rotate(-8deg)}50%{transform:rotate(8deg)}}
.vida-nada{animation:vNada 2.4s ease-in-out infinite}
@keyframes vNada{0%,100%{transform:translateX(-40px) rotate(-4deg)}50%{transform:translateX(40px) rotate(4deg)}}
.vida-vuela{animation:vVuela 2.2s ease-in-out infinite}
@keyframes vVuela{0%,100%{transform:translateY(20px) rotate(-3deg)}50%{transform:translateY(-50px) rotate(3deg)}}
.vida-brilla{animation:vBrilla 1.2s ease-in-out infinite}
@keyframes vBrilla{0%,100%{transform:scale(1);filter:brightness(1)}50%{transform:scale(1.06);filter:brightness(1.25) drop-shadow(0 0 18px #ffcc1f)}}
.vida-avanza{animation:vAvanza 1.8s ease-in-out infinite}
@keyframes vAvanza{0%,100%{transform:translateX(-30px)}50%{transform:translateX(30px)}}
.vida-aletea{animation:vAletea .5s ease-in-out infinite}
@keyframes vAletea{0%,100%{transform:scaleX(1)}50%{transform:scaleX(.7)}}
#gBot{position:absolute;left:0;right:0;top:580px;display:flex;justify-content:center;gap:26px;align-items:center}
#gSig{width:150px;height:100px;border-radius:50px;background:#40c057;box-shadow:0 9px 0 #2b8a3e;display:flex;align-items:center;justify-content:center;animation:latido 1.2s ease-in-out infinite}
#gSig svg{width:60px;height:60px}
@keyframes latido{50%{transform:scale(1.07)}}

/* modo libre */
#libre .taller{background:#fff8ee}
#paleta{position:absolute;right:28px;top:110px;width:330px;display:flex;flex-wrap:wrap;gap:14px;justify-content:center}
.baldeP{width:92px;height:92px;border-radius:24px;background:#fff;box-shadow:0 7px 0 rgba(0,0,0,.1);position:relative;display:flex;align-items:center;justify-content:center;transition:transform .15s,box-shadow .15s}
.baldeP svg{width:70px;height:70px}
.baldeP b{position:absolute;left:8px;top:6px;font-size:18px;font-weight:900;color:#8a7f6e}
.baldeP.sel{transform:translateY(-6px);box-shadow:0 7px 0 rgba(0,0,0,.1),0 0 0 6px #2b2b3a}
#libreBot{position:absolute;right:28px;bottom:26px;width:330px;display:flex;justify-content:center;gap:22px}
#bGuardar{width:150px;height:84px;border-radius:42px;background:#40c057;box-shadow:0 8px 0 #2b8a3e;display:flex;align-items:center;justify-content:center}
#bGuardar svg{width:48px;height:48px}
#flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:45}
#flash.on{animation:flash .5s}
@keyframes flash{0%{opacity:.9}100%{opacity:0}}

/* galería */
#galCuadros{position:absolute;left:120px;right:120px;top:104px;bottom:20px;padding:14px;display:flex;flex-wrap:wrap;gap:22px;justify-content:center;align-content:flex-start;overflow:hidden}
.marcoG{width:150px;height:150px;border-radius:14px;background:#fff;box-shadow:0 0 0 8px #c9a46b,0 10px 20px rgba(0,0,0,.12);padding:16px;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:transform .2s}
.marcoG:hover{transform:rotate(-3deg) scale(1.05)}
.marcoG svg{width:100%;height:100%}
.marcoG.vivo svg{animation:vSalta .8s ease-in-out 2}
#bVolverGal{position:absolute;left:24px;top:14px}

/* docente (igual que en Robotito) */
#bloqueo{position:absolute;inset:0;background:rgba(10,15,35,.75);z-index:90;display:none}
#bloqueo.on{display:block}
#pinCaja{position:absolute;left:440px;top:80px;width:400px;height:560px;border-radius:32px;background:#fff;padding:26px;text-align:center}
#pinCaja h2{font-size:22px}
#pinPuntos{display:flex;justify-content:center;gap:14px;margin:18px 0 20px}
#pinPuntos i{width:22px;height:22px;border-radius:50%;background:#e3e7f0}
#pinPuntos i.si{background:#9b6bff}
#pinPuntos.mal{animation:sacude .35s}
#pinTeclas{display:grid;grid-template-columns:repeat(3,96px);gap:12px;justify-content:center}
#pinTeclas button{height:74px;border-radius:18px;background:#eef1f7;font-size:30px;font-weight:800}
#docPanel{position:absolute;left:370px;top:40px;width:540px;height:640px;border-radius:32px;background:#fff;padding:28px;display:none}
#docPanel.on{display:block}
#docPanel h2{font-size:24px;margin-bottom:4px}
#docPanel p{font-size:14px;color:#666;margin-bottom:14px}
#docPanel .fila{display:flex;gap:10px;margin-bottom:12px}
.docB{display:block;width:100%;height:52px;border-radius:16px;background:#eef1f7;font-size:16px;font-weight:700;margin-bottom:10px;text-align:left;padding:0 18px;color:#2b2b3a}
.fila .docB{text-align:center;margin:0;padding:0 8px}
.docB.prim{background:#9b6bff;color:#fff}
.docB.peligro{background:#ffe3e3;color:#c92a2a}
#salida{position:absolute;inset:0;background:#1d2340;z-index:95;display:none;color:#fff;text-align:center;padding-top:260px}
#salida.on{display:block}
#salida h2{font-size:40px}
#salida p{font-size:22px;opacity:.8;margin-top:14px}
#pantallaC{position:absolute;inset:0;background:rgba(20,30,60,.7);z-index:85;display:none;align-items:center;justify-content:center}
#pantallaC.on{display:flex}
#pantallaC button{width:200px;height:200px;border-radius:50%;background:#40c057;box-shadow:0 12px 0 #2b8a3e;display:flex;align-items:center;justify-content:center;animation:latido 1.2s ease-in-out infinite}
#pantallaC svg{width:100px;height:100px}
#esquina{position:absolute;left:0;top:0;width:40px;height:40px;z-index:80}
#fx{position:absolute;inset:0;pointer-events:none;z-index:70}
.rob .antena{transform-box:fill-box;transform-origin:50% 100%;animation:antena 2s ease-in-out infinite}
@keyframes antena{0%,100%{transform:rotate(-6deg)}50%{transform:rotate(6deg)}}
.rob .ojosR{transform-box:fill-box;transform-origin:center;animation:parpadea 3.2s infinite}
@keyframes parpadea{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
.rob .luz{animation:luzR 1.4s ease-in-out infinite}
@keyframes luzR{50%{fill:#ff6b6b}}
</style>
</head>
<body>
<div id="marco"><div id="stage">

<div id="inicio" class="pant on">
  <div class="taller"></div>
  <div class="titulo"><h1 id="titulo"></h1></div>
  <div id="robots"></div>
  <div id="marcaIni"></div>
</div>

<div id="tuto" class="pant">
  <div class="taller"></div>
  <div class="tablero"></div>
  <div id="tutoRobot"></div>
  <div id="teclado"></div>
  <div id="tutoPuntos"></div>
</div>

<div id="nivel" class="pant">
  <div class="taller"></div>
  <button class="btnR" id="bLibre" aria-label="Pintar libre"></button>
  <button class="btnR" id="bGaleria" aria-label="Mis dibujos"></button>
  <div id="camino"></div>
  <button class="btnR" id="bRepetir" aria-label="Empezar de nuevo"></button>
  <div id="tablero"></div>
  <div id="panelD">
    <div id="modelo"><div class="pinza"></div><div id="modeloDib" style="width:100%;height:100%"></div></div>
    <div id="pinturaAct"></div>
    <div id="pad">
      <button class="flecha" id="fArr"></button>
      <button class="flecha" id="fIzq"></button>
      <div id="centroPad"></div>
      <button class="flecha" id="fDer"></button>
      <button class="flecha" id="fAba"></button>
    </div>
  </div>
  <div id="programa">
    <div id="bandeja"></div>
    <button id="bPlay" aria-label="Ejecutar"></button>
    <button id="bBorrar" aria-label="Borrar la última"></button>
    <button id="bLimpiar" aria-label="Borrar todo"></button>
  </div>
  <div id="ganaste"><div id="gCuadro"><div id="gDib"></div></div><div id="gBot"><button class="btnR" id="gLibre"></button><button id="gSig" aria-label="Siguiente"></button><button class="btnR" id="gOtra"></button></div></div>
</div>

<div id="libre" class="pant">
  <div class="taller"></div>
  <button class="btnR" id="bVolverLib" aria-label="Volver" style="position:absolute;left:24px;top:14px"></button>
  <button class="btnR" id="bGaleria2" aria-label="Mis dibujos" style="position:absolute;left:114px;top:14px"></button>
  <div id="paleta"></div>
  <div id="libreBot"><button id="bGuardar" aria-label="Guardar"></button><button class="btnR" id="bNuevo" aria-label="Hoja nueva"></button></div>
</div>

<div id="galeria" class="pant">
  <div class="taller"></div>
  <button class="btnR" id="bVolverGal" aria-label="Volver"></button>
  <div id="galCuadros"></div>
</div>

<div id="flash"></div>
<canvas id="fx" width="1280" height="720"></canvas>
<div id="esquina"></div>
<div id="pantallaC"><button id="bPantC" aria-label="Seguir"></button></div>
<div id="bloqueo"><div id="pinCaja"><h2>Docente</h2><div id="pinPuntos"><i></i><i></i><i></i><i></i></div><div id="pinTeclas"></div></div>
  <div id="docPanel"><h2>Panel del docente</h2><p>Los chicos no pueden salir del juego hasta que vos lo desbloquees acá.</p>
    <button class="docB prim" id="dSeguir">Volver al juego</button>
    <p style="margin:6px 0 8px;font-weight:700;color:#2b2b3a">Empezar desde:</p>
    <div class="fila"><button class="docB" id="dIni">Inicial</button><button class="docB" id="dPri">1.º</button><button class="docB" id="dSeg">2.º</button></div>

  var T = LB.T, m = [], f, c, s, alguno = false;
  for (f = 0; f < T.F; f++) { s = ''; for (c = 0; c < T.C; c++) { s += T.pint[f][c] || '.'; if (T.pint[f][c]) alguno = true; } m.push(s); }

  P.gal.unshift({ m: m, vida: 'salta' }); if (P.gal.length > 40) P.gal.length = 40; guardar();
  var fl = $('flash'); fl.className = ''; void fl.offsetWidth; fl.className = 'on';

  var T = LB.T, f, c; for (f = 0; f < T.F; f++) for (c = 0; c < T.C; c++) if (T.pint[f][c]) pintarCelda(T, f, c, '');

}

/* =========================================================
   GALERÍA
   ========================================================= */
var volverA = null;

  var s = '', i;

  var ms = $('galCuadros').children;

  $('bVolverGal').innerHTML = IC.volver;

}
function salirGaleria() { if (volverA === 'libre') irLibre(); else jugar(G.nivel); }

/* =========================================================
   TECLAS Y BOTONES
   ========================================================= */
var BLOQ = { activo: true, pin: '', abierto: false, panel: false, fs: false };
function teclaJuego(k) {
  if (FASE === 'inicio') {
    if (k === 37) marcarRobot((selRobot + ROBOTS.length - 1) % ROBOTS.length);
    else if (k === 39) marcarRobot((selRobot + 1) % ROBOTS.length);
    else if (k === 13 || k === 32) elegirRobot(selRobot);
  } else if (FASE === 'tuto') { if (TECLA_DIR[k]) tutoTecla(TECLA_DIR[k]); }
  else if (FASE === 'nivel' && L) {
    var d = TECLA_DIR[k];
    if (d) apretarFlecha(d);
    else if (L.et.prog && (k === 13 || k === 32)) ejecutar();
    else if (L.et.prog && k === 8) borrarOrden();
  } else if (FASE === 'ganaste') { if (k === 13 || k === 32 || k === 39) siguienteDibujo(); }
  else if (FASE === 'libre') {
    if (TECLA_DIR[k]) moverLibre(TECLA_DIR[k]);
    else if (k >= 49 && k <= 56) elegirColorLibre(PALETA[k - 49]);
    else if (k >= 97 && k <= 104) elegirColorLibre(PALETA[k - 97]);
    else if (k === 57 || k === 105 || k === 48 || k === 96) elegirColorLibre('goma');

}
function apretarFlecha(d) {

  var bs = document.querySelectorAll('.flecha'), i; for (i = 0; i < bs.length; i++) bs[i].className = 'flecha';
  b.className = 'flecha apreta'; setTimeout(function () { b.className = 'flecha'; }, 160);
  if (L.et.prog) { agregarOrden(d); return; }
  if (L.mov) return;
  L.mov = true; setTimeout(function () { L.mov = false; }, 250);
  mover(d);
}
function armarBotones() {
  var fl = { fArr: 'arr', fAba: 'aba', fIzq: 'izq', fDer: 'der' }, k;
  for (k in fl) (function (id, d) { $(id).onclick = function () { if (FASE === 'nivel') apretarFlecha(d); }; })(k, fl[k]);
  $('bRepetir').onclick = function () { if (L && !L.corriendo) { sfx('whoosh'); jugar(L.n); } };
  $('bLibre').onclick = function () { if (L && L.corriendo) return; irLibre(); };
  $('bGaleria').onclick = function () { if (L && L.corriendo) return; irGaleria('nivel'); };
  $('bPlay').onclick = function () { if (L) { L.ultAccion = Date.now(); ejecutar(); } };
  $('bBorrar').onclick = function () { if (L) borrarOrden(); };
  $('bLimpiar').onclick = function () { if (L) limpiarOrdenes(); };
  $('gSig').onclick = siguienteDibujo;
  $('gOtra').onclick = function () { jugar(L.n); };
  $('gLibre').onclick = function () { irLibre(); };
  $('bVolverLib').onclick = function () { jugar(G.nivel); };
  $('bGaleria2').onclick = function () { irGaleria('libre'); };
  $('bGuardar').onclick = guardarLibre;
  $('bNuevo').onclick = hojaNueva;
  $('bVolverGal').onclick = salirGaleria;
}
window.addEventListener('keydown', function (e) {
  var k = e.keyCode;
  primerGesto();
  // combinación del docente: Ctrl + Shift + P
  if (e.ctrlKey && e.shiftKey && k === 80) { e.preventDefault(); e.stopPropagation(); abrirPin(); return; }
  if (BLOQ.abierto) { e.preventDefault(); e.stopPropagation(); if (!BLOQ.panel) { if (k >= 48 && k <= 57) pinDigito(String(k - 48)); else if (k >= 96 && k <= 105) pinDigito(String(k - 96)); else if (k === 8) { BLOQ.pin = BLOQ.pin.slice(0, -1); pintarPin(); } else if (k === 27) cerrarPin(); } else if (k === 27) cerrarPin(); return; }
  if (!BLOQ.activo) return;
  e.preventDefault(); e.stopPropagation();
  if (e.ctrlKey || e.altKey || e.metaKey) return;
  if (e.repeat && !TECLA_DIR[k]) return;
  teclaJuego(k);
}, true);
window.addEventListener('keyup', function (e) { if (BLOQ.activo) { e.preventDefault(); e.stopPropagation(); } }, true);
document.addEventListener('contextmenu', function (e) { e.preventDefault(); });
document.addEventListener('dragstart', function (e) { e.preventDefault(); });
document.addEventListener('selectstart', function (e) { e.preventDefault(); });

window.addEventListener('beforeunload', function (e) { if (BLOQ.activo) { e.preventDefault(); e.returnValue = ''; return ''; } });
document.addEventListener('mousedown', function (e) { primerGesto(); var t = e.target; while (t && t !== document) { if (t.tagName === 'BUTTON') { e.preventDefault(); return; } t = t.parentNode; } });

var gestoHecho = false;
function primerGesto() {

  if (gestoHecho) return; gestoHecho = true;
  entrarPantalla();
}
function entrarPantalla() {

  var bloquear = function () { BLOQ.fs = true; try { if (navigator.keyboard && navigator.keyboard.lock) navigator.keyboard.lock(); } catch (e) {} };
  if (pr && pr.then) pr.then(bloquear, function () {}); else setTimeout(bloquear, 300);
}
document.addEventListener('fullscreenchange', function () {
  if (!document.fullscreenElement && BLOQ.activo && BLOQ.fs) $('pantallaC').className = 'on';
});
function salirDelBloqueo() {
  BLOQ.activo = false;
  try { if (navigator.keyboard && navigator.keyboard.unlock) navigator.keyboard.unlock(); } catch (e) {}

/* clave */
function abrirPin() {

  var s = '', i, ns = [1, 2, 3, 4, 5, 6, 7, 8, 9, 'x', 0, '<'];
  for (i = 0; i < ns.length; i++) s += '<button data-k="' + ns[i] + '">' + (ns[i] === 'x' ? '&#10005;' : ns[i] === '<' ? '&#9003;' : ns[i]) + '</button>';

function pintarPin() { var p = $('pinPuntos').children, i; for (i = 0; i < 4; i++) p[i].className = i < BLOQ.pin.length ? 'si' : ''; }

  if (BLOQ.pin.length === 4) {
    if (BLOQ.pin === CLAVE) setTimeout(abrirPanel, 200);

  }

function cerrarPin() { BLOQ.abierto = false; BLOQ.panel = false; $('bloqueo').className = ''; }

  BLOQ.panel = true; $('pinCaja').style.display = 'none'; $('docPanel').className = 'on';
  $('dMus').innerHTML = 'Música: ' + (AU.musOn ? 'sí' : 'no'); $('dVoz').innerHTML = 'Voz: ' + (VOZ.on ? 'sí' : 'no');
  $('dBorrar').innerHTML = 'Borrar la galería de dibujos'; $('dBorrar')._conf = false;
}
function armarDocente() {
  $('dSeguir').onclick = cerrarPin;
  var ir = function (n) { return function () { cerrarPin(); G.hechos = {}; if (FASE === 'inicio' || FASE === 'tuto') { G.nivel = n; } else jugar(n); }; };
  $('dIni').onclick = ir(INICIO_GRADO.inicial); $('dPri').onclick = ir(INICIO_GRADO.primero); $('dSeg').onclick = ir(INICIO_GRADO.segundo);

  $('dLibreD').onclick = function () { cerrarPin(); irLibre(); };
  $('dMus').onclick = function () { setMus(!AU.musOn); if (AU.musOn) musicaOn(); abrirPanel(); };
  $('dVoz').onclick = function () { VOZ.on = !VOZ.on; abrirPanel(); };
  $('dBorrar').onclick = function () {
    if (!this._conf) { this._conf = true; this.innerHTML = 'Tocá otra vez para confirmar'; return; }
    P.gal = []; guardar(); this._conf = false; this.innerHTML = 'Galería borrada';
  };
  $('dSalir').onclick = salirDelBloqueo;
  var toques = [];
  $('esquina').onclick = function () { var t = Date.now(); toques.push(t); toques = toques.filter(function (x) { return t - x < 3000; }); if (toques.length >= 5) { toques = []; abrirPin(); } };
  $('bPantC').innerHTML = IC.play; $('bPantC').onclick = function () { $('pantallaC').className = ''; entrarPantalla(); };
}

/* ---------- arranque ---------- */
cargar();
escalar();

armarBotones();
armarDocente();
irInicio();
