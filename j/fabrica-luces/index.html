<html lang="es">

<title>La fábrica de luces</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>

.pant{position:absolute;left:0;top:0;width:1280px;height:720px;display:none}

button{font-family:inherit;cursor:pointer;border:0;border-radius:14px;font-weight:700}
.btn{background:#ffd54a;color:#1a1400;font-size:28px;padding:14px 38px;box-shadow:0 6px 0 #b8901c}

.btn2{background:#26335c;color:#eef2ff;font-size:20px;padding:10px 20px;box-shadow:0 4px 0 #141c38}

h1{margin:0}

#foco{position:absolute;left:560px;top:60px}
#mapa h1{position:absolute;left:0;right:0;top:28px;text-align:center;font-size:44px}

.sala .des{position:absolute;left:28px;top:58px;font-size:18px;color:#9fb0e6;width:250px}
.sala .nvs{position:absolute;left:345px;top:28px}
.nv{width:74px;height:74px;border-radius:50%;margin-right:10px;font-size:28px;background:#1a2445;color:#5d6a96;box-shadow:inset 0 0 0 3px #2c3964}

.nv.ok{background:#ffd54a;color:#1a1400;box-shadow:0 0 22px rgba(255,213,74,.55)}

#juego .top{position:absolute;left:0;top:0;width:1280px;height:96px}

#pista{position:absolute;left:20px;bottom:18px;width:320px}
table.tb{border-collapse:separate;border-spacing:0 6px;margin:0 14px;width:332px}
.tb th{font-size:15px;color:#b9c4ee;font-weight:700;padding:0 2px;text-align:center}
.tb td{text-align:center;height:40px;background:#18213f;cursor:pointer}
.tb td:first-child{border-radius:10px 0 0 10px}
.tb td:last-child{border-radius:0 10px 10px 0}
.tb tr.act td{background:#2f3d70}
.tb td.sep{width:6px;background:transparent}
.pt{display:inline-block;width:22px;height:22px;border-radius:50%;background:#0d1328;box-shadow:inset 0 0 0 2px #46527d;vertical-align:middle;font-size:15px;line-height:22px;font-weight:700;color:#7d8ab8}

.pulso{animation:pul 1s ease-in-out infinite}

.dot.no{background:#ff6b6b;box-shadow:0 0 10px #ff6b6b}

.msg small{display:block;font-size:17px;color:#9fb0e6;font-weight:400;margin-top:8px}
.fila{display:flex;align-items:center;margin:12px 20px;padding:12px 14px;background:#18213f;border-radius:14px;font-size:20px}
.fila .bola{width:34px;height:34px;border-radius:50%;margin-right:14px;flex:none}
.fila .txt{flex:1}
.capa{position:absolute;left:0;top:0;width:1280px;height:720px;background:rgba(5,8,20,.72);display:none}
.capa.on{display:block}

.tarj p{font-size:26px;margin:8px 34px;color:#dbe2ff}
.tarj .bts{margin:24px 0 30px}
.tarj .bts button{margin:0 8px}
.wire{fill:none;stroke-width:7;stroke-linecap:round}
.w0{stroke:#33405f}
.w1{stroke:#ffd54a;stroke-dasharray:14 10;animation:fluye .6s linear infinite}
.wn{stroke:#2a3350;stroke-dasharray:2 10}
@keyframes fluye{to{stroke-dashoffset:-24}}
.sw,.slot{cursor:pointer}
.gira{animation:gir 0.7s linear infinite;transform-box:fill-box;transform-origin:center}
@keyframes gir{to{transform:rotate(360deg)}}
.lat{animation:lat 1s ease-in-out infinite}
@keyframes lat{50%{opacity:.25}}
.festejo{animation:fest .35s ease-in-out 3}
@keyframes fest{50%{opacity:.3}}

  </div></div>

  </div></div>

</div>

/* ---------- juego ---------- */
var R = null, S = null, nIdx = -1, libreN = 0, ganado = false, ayudaOn = false;

function jugar(i) {

function empezar() {
  S = { v: {}, t: {}, lock: {}, res: [], msg: '', prueba: false };

function generar(n) {

    for (k = 0; k < P.n; k++) L.in.push([String.fromCharCode(97 + k), 'interruptor ' + (k + 1), ys[k]]);

$('panIn').onclick = function (ev) {

};
function probar() {
  if (!R.gs.every(function (g) { return !g.hueco || S.t[g.id]; })) {

  }

}

var FRASES = ['La corriente llegó.', 'Así piensa la compu: prendido o apagado.', 'Una pieza más y ya sos ingeniero.', 'Las máquinas de tu casa tienen esto adentro.', 'Bien pensado.'];

/* ---------- tarjetas de piezas nuevas ---------- */
var INTRO = {
