<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mi Canal</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-user-select:none;user-select:none}
html,body{width:100%;height:100%;overflow:hidden;background:#0B0826;font-family:"Trebuchet MS","Segoe UI",Arial,sans-serif;color:#fff}
#wrap{position:fixed;inset:0;overflow:hidden}
#stage{position:absolute;left:0;top:0;width:1280px;height:720px;transform-origin:0 0;overflow:hidden;background:radial-gradient(ellipse at 25% 0%,#3B2D9C 0%,#241A6B 42%,#120C3D 100%)}
#scr{position:absolute;inset:0}
#fx{position:absolute;left:0;top:0;width:1280px;height:720px;pointer-events:none;z-index:60}
#layer{position:absolute;inset:0;z-index:40;pointer-events:none}
#layer>*{pointer-events:auto}
button{font-family:inherit;cursor:pointer;border:0;color:inherit}
button:focus{outline:3px solid #FFD23F;outline-offset:2px}
button:focus:not(:focus-visible){outline:none}
input{font-family:inherit;-webkit-user-select:text;user-select:text}
.bgdots{position:absolute;inset:0;background-image:radial-gradient(rgba(255,255,255,.07) 2px,transparent 2.5px);background-size:44px 44px;pointer-events:none}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;height:56px;padding:0 28px;border-radius:18px;font-size:22px;font-weight:800;color:#2B2160;background:#FFD23F;box-shadow:0 6px 0 #C98F00,0 10px 18px rgba(0,0,0,.28);transition:transform .08s,box-shadow .08s,filter .15s;white-space:nowrap}
.btn:hover{filter:brightness(1.07)}
.btn:active{transform:translateY(5px);box-shadow:0 1px 0 #C98F00,0 3px 8px rgba(0,0,0,.28)}
.btn.red{background:#FF3B6B;color:#fff;box-shadow:0 6px 0 #B01D45,0 10px 18px rgba(0,0,0,.28)}
.btn.red:active{box-shadow:0 1px 0 #B01D45}
.btn.teal{background:#6BF3E2;box-shadow:0 6px 0 #1FAFD0,0 10px 18px rgba(0,0,0,.28)}
.btn.teal:active{box-shadow:0 1px 0 #1FAFD0}
.btn.pink{background:#FF6FA5;color:#fff;box-shadow:0 6px 0 #C23A78,0 10px 18px rgba(0,0,0,.28)}
.btn.pink:active{box-shadow:0 1px 0 #C23A78}
.btn.ghost{background:rgba(255,255,255,.14);color:#fff;box-shadow:0 4px 0 rgba(0,0,0,.25)}
.btn.ghost:active{box-shadow:0 0 0 rgba(0,0,0,.25)}
.btn.big{height:70px;font-size:28px;padding:0 44px;border-radius:24px}
.btn.sm{height:44px;font-size:18px;padding:0 18px;border-radius:14px}
.btn[disabled]{filter:grayscale(.85) brightness(.8);cursor:default;transform:none}
.ibtn{width:48px;height:48px;flex:none;border-radius:16px;display:inline-flex;align-items:center;justify-content:center;background:rgba(255,255,255,.14);box-shadow:0 4px 0 rgba(0,0,0,.25);color:#fff}
.ibtn:hover{background:rgba(255,255,255,.26)}
.ibtn:active{transform:translateY(3px);box-shadow:none}
.ibtn.on{background:#FFD23F;color:#2B2160}

.top{position:absolute;left:0;top:0;width:1280px;height:72px;display:flex;align-items:center;gap:14px;padding:0 24px;z-index:5}
.top h1{font-size:28px;font-weight:800;letter-spacing:.3px;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pill{display:inline-flex;align-items:center;gap:8px;height:44px;padding:0 16px;border-radius:22px;background:rgba(255,255,255,.14);font-size:20px;font-weight:800;white-space:nowrap}
.pill.subs{background:#FF3B6B;box-shadow:0 4px 0 #B01D45}
.pill.subs .l{font-size:14px;opacity:.9;font-weight:700}
.body{position:absolute;left:0;top:72px;width:1280px;height:648px}
.panel{background:rgba(255,255,255,.09);border:2px solid rgba(255,255,255,.16);border-radius:26px;box-shadow:0 10px 30px rgba(0,0,0,.22)}
.card{background:#fff;color:#2B2160;border-radius:26px;box-shadow:0 12px 30px rgba(0,0,0,.3)}
.h3{font-size:17px;font-weight:800;letter-spacing:.5px;color:#9FE9FF;text-transform:uppercase}

/* Zoom */
.zoom{position:relative;flex:none}
.zsvg{width:100%;height:100%;overflow:visible}
.zoom .zfl{animation:zflo 2.6s ease-in-out infinite;transform-origin:100px 190px}
.zoom .zsh{animation:zsh 2.6s ease-in-out infinite;transform-origin:100px 190px}
.zoom .zrec{animation:blink 1.4s steps(2) infinite}
.zoom .ziris{transition:transform .25s}
.zoom .zir{transition:r .2s}
.zoom.m-happy .zarm.l{animation:wavel .5s ease-in-out infinite alternate;transform-origin:18px 112px}
.zoom.m-happy .zarm.r{animation:waver .5s ease-in-out infinite alternate;transform-origin:182px 112px}
@keyframes zflo{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
@keyframes zsh{0%,100%{transform:scale(1)}50%{transform:scale(.88)}}
@keyframes blink{50%{opacity:.15}}
@keyframes wavel{to{transform:translateY(-14px)}}
@keyframes waver{to{transform:translateY(-14px)}}
.zsay{display:flex;align-items:flex-end;gap:14px}
.bwrap{position:relative;max-width:480px}
.bubble{position:relative;background:#fff;color:#2B2160;border-radius:22px;padding:16px 20px;font-size:21px;font-weight:700;line-height:1.3;box-shadow:0 8px 20px rgba(0,0,0,.28);min-height:58px}
.bubble:before{content:"";position:absolute;left:-12px;bottom:22px;border:12px solid transparent;border-right-color:#fff;border-left:0}
.spk{position:absolute;right:-12px;top:-14px;width:40px;height:40px;border-radius:20px;background:#FF3B6B;color:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 3px 0 #B01D45}
.spk:active{transform:translateY(2px)}

.toast{position:absolute;left:50%;top:84px;transform:translateX(-50%);background:#fff;color:#2B2160;font-weight:800;font-size:22px;padding:12px 26px;border-radius:30px;box-shadow:0 10px 24px rgba(0,0,0,.35);animation:toast 2.8s forwards;z-index:70;white-space:nowrap}
.toast.good{background:#2FBF84;color:#fff}.toast.bad{background:#FF3B6B;color:#fff}
@keyframes toast{0%{transform:translate(-50%,-30px);opacity:0}10%{transform:translate(-50%,0);opacity:1}85%{opacity:1}100%{transform:translate(-50%,-14px);opacity:0}}
.veil{position:absolute;inset:0;background:rgba(10,6,40,.72);display:flex;align-items:center;justify-content:center;animation:fade .2s}
@keyframes fade{from{opacity:0}}
@keyframes popin{0%{transform:scale(.2);opacity:0}60%{transform:scale(1.15);opacity:1}100%{transform:scale(1)}}
.popin{animation:popin .7s both;transform-box:fill-box;transform-origin:center}
@keyframes rise{from{transform:translateY(24px);opacity:0}to{transform:none;opacity:1}}

/* ===== Título ===== */
.title-wrap{position:absolute;inset:0;overflow:hidden}
.logo{position:absolute;left:90px;top:130px;display:flex;align-items:center;gap:22px}
.logo .tri{width:150px;height:110px;border-radius:30px;background:#FF3B6B;box-shadow:0 10px 0 #B01D45,0 18px 30px rgba(0,0,0,.4);display:flex;align-items:center;justify-content:center}
.logo .tx{font-size:104px;font-weight:900;letter-spacing:-2px;line-height:1;text-shadow:0 8px 0 rgba(0,0,0,.28)}
.logo .tx b{color:#FFD23F}
.tag{position:absolute;left:96px;top:276px;font-size:30px;font-weight:700;color:#9FE9FF;letter-spacing:.3px}
.title-btns{position:absolute;left:96px;top:380px;display:flex;flex-direction:column;gap:20px;align-items:flex-start}
.gear{position:absolute;right:8px;bottom:8px;width:44px;height:44px;opacity:.25;background:none;color:#fff}
.title-z{position:absolute;right:90px;top:180px}

/* ===== Canales ===== */
.chlist{position:absolute;left:0;top:72px;width:1280px;display:flex;flex-wrap:wrap;gap:24px;padding:26px 60px;justify-content:center;align-content:flex-start}
.chcard{width:262px;height:268px;background:#fff;color:#2B2160;border-radius:26px;box-shadow:0 12px 0 rgba(0,0,0,.2),0 18px 30px rgba(0,0,0,.3);display:flex;flex-direction:column;align-items:center;padding:14px 12px;gap:4px;transition:transform .12s;position:relative}
.chcard:hover{transform:translateY(-6px)}
.chcard .nm{font-size:22px;font-weight:900;text-align:center;line-height:1.1}
.chcard .st{font-size:17px;font-weight:700;color:#6A5FA8}
.chcard.new{background:rgba(255,255,255,.1);border:4px dashed rgba(255,255,255,.4);color:#fff;justify-content:center;box-shadow:none}
.chcard.new .plus{width:90px;height:90px;border-radius:45px;background:#FFD23F;color:#2B2160;display:flex;align-items:center;justify-content:center}

/* ===== Crear canal ===== */
.cr-prev{position:absolute;left:50px;top:110px;width:330px;height:500px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px}
.cr-prev .stagebox{width:300px;height:300px;border-radius:36px;background:radial-gradient(circle at 50% 30%,#6A5BE0,#3B2D9C);box-shadow:inset 0 0 0 5px rgba(255,255,255,.2);display:flex;align-items:flex-end;justify-content:center;overflow:hidden}
.cr-prev .cname{font-size:30px;font-weight:900;text-align:center;text-shadow:0 4px 0 rgba(0,0,0,.3)}
.cr-form{position:absolute;left:420px;top:90px;width:840px;display:flex;flex-direction:column;gap:12px}
.row{display:flex;align-items:center;gap:14px;min-height:60px}
.row .lb{width:150px;font-size:20px;font-weight:800;color:#9FE9FF;flex:none}
.sw{width:44px;height:44px;border-radius:22px;border:5px solid rgba(255,255,255,.25);box-shadow:0 3px 0 rgba(0,0,0,.25);transition:transform .1s}
.sw:hover{transform:scale(1.12)}.sw.sel{border-color:#fff;transform:scale(1.15);box-shadow:0 0 0 4px #FFD23F}
.opt{height:56px;padding:0 16px;min-width:72px;border-radius:16px;background:rgba(255,255,255,.14);font-size:19px;font-weight:800;color:#fff;box-shadow:0 4px 0 rgba(0,0,0,.25);display:flex;align-items:center;justify-content:center}
.opt:hover{background:rgba(255,255,255,.24)}
.opt.sel{background:#FFD23F;color:#2B2160}
.opt.lv{height:70px;flex-direction:column;gap:2px;width:196px;font-size:22px}
.opt.lv small{font-size:14px;font-weight:700;opacity:.85}
.wsel{display:flex;align-items:center;gap:8px}
.wsel .w{min-width:200px;height:56px;border-radius:16px;background:#fff;color:#2B2160;font-size:26px;font-weight:900;display:flex;align-items:center;justify-content:center}

/* ===== Estudio ===== */
.stu-l{position:absolute;left:22px;top:78px;width:760px}
.stu-l .studio{width:760px;height:513px;border-radius:26px;box-shadow:0 12px 30px rgba(0,0,0,.35);display:block}
.stu-btns{position:absolute;left:22px;top:604px;display:flex;gap:14px}
.stu-r{position:absolute;left:800px;top:78px;width:462px;height:630px;padding:14px 14px}
.stu-r .h3{margin:4px 8px 8px}
.mcard{position:relative;display:flex;align-items:center;gap:12px;width:100%;height:68px;border-radius:20px;background:#fff;color:#2B2160;padding:0 14px 0 10px;margin-bottom:7px;text-align:left;box-shadow:0 5px 0 rgba(0,0,0,.2);transition:transform .1s}
.mcard:hover:not(.lock){transform:translateX(5px)}
.mcard .num{flex:none;width:44px;height:44px;border-radius:14px;color:#fff;font-size:24px;font-weight:900;display:flex;align-items:center;justify-content:center}
.mcard .mt{flex:1;min-width:0}.mcard .mt b{display:block;font-size:20px;line-height:1.1}.mcard .mt small{display:block;font-size:14px;font-weight:700;color:#6A5FA8;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mcard.lock{background:rgba(255,255,255,.12);color:#fff;box-shadow:none;cursor:default}
.mcard.lock .num{background:rgba(255,255,255,.18)!important}
.mcard.lock small{color:rgba(255,255,255,.6)}
.mcard.next{animation:nextp 1.4s ease-in-out infinite;outline:4px solid #FFD23F}
@keyframes nextp{50%{box-shadow:0 5px 0 rgba(0,0,0,.2),0 0 0 10px rgba(255,210,63,.35)}}
.mcard .sts{display:flex;gap:1px}
.flag{position:absolute;right:-6px;top:-10px;background:#FF3B6B;color:#fff;font-size:13px;font-weight:900;padding:3px 10px;border-radius:12px;transform:rotate(5deg)}

/* ===== Introducción de misión ===== */
.intro{width:880px;padding:0;overflow:hidden;animation:popin .4s both}
.intro .hd{display:flex;align-items:center;gap:18px;padding:20px 28px;color:#fff}
.intro .hd .big{font-size:60px;font-weight:900;width:84px;height:84px;border-radius:24px;background:rgba(255,255,255,.25);display:flex;align-items:center;justify-content:center}
.intro .hd h2{font-size:42px;font-weight:900;line-height:1}
.intro .hd small{font-size:19px;font-weight:700;opacity:.92}
.intro .bd{padding:22px 28px;display:flex;gap:22px}
.intro .goals{flex:1}
.intro .goals h4{font-size:17px;font-weight:800;color:#6A5FA8;text-transform:uppercase;letter-spacing:.5px;margin-bottom:8px}
.intro .goals li{list-style:none;font-size:20px;font-weight:700;margin-bottom:8px;display:flex;gap:10px;align-items:flex-start}
.intro .goals li:before{content:"";flex:none;width:12px;height:12px;border-radius:6px;background:#FF3B6B;margin-top:8px}
.intro .ft{display:flex;gap:14px;justify-content:flex-end;padding:0 28px 22px}
.learn{display:inline-block;background:#EFEAFF;color:#4B3FA0;border-radius:14px;font-size:16px;font-weight:800;padding:6px 14px;margin-top:6px}

/* ===== Misión: marco ===== */
.mbar{position:absolute;left:0;top:0;width:1280px;height:72px;display:flex;align-items:center;gap:14px;padding:0 24px;z-index:6;background:linear-gradient(180deg,rgba(10,6,40,.55),transparent)}
.mbar h1{font-size:26px;font-weight:800;flex:1;white-space:nowrap}
.dots{display:flex;gap:8px;align-items:center}
.dots i{width:16px;height:16px;border-radius:8px;background:rgba(255,255,255,.22);display:block}
.dots i.on{background:#FFD23F}.dots i.cur{background:#fff;box-shadow:0 0 0 4px rgba(255,255,255,.3)}
.hintbtn{display:inline-flex;align-items:center;gap:8px;height:46px;padding:0 18px;border-radius:16px;background:#FFD23F;color:#2B2160;font-size:19px;font-weight:800;box-shadow:0 4px 0 #C98F00}
.hintbtn:active{transform:translateY(3px);box-shadow:none}
.zdock{position:absolute;left:18px;bottom:12px;z-index:8}
.zdock .bubble{font-size:19px;max-width:420px}
.mbody{position:absolute;left:0;top:72px;width:1280px;height:648px}

/* ===== Resultado / publicar ===== */
.res{width:980px;height:600px;padding:26px 34px;display:flex;gap:30px;animation:popin .45s both;position:relative}
.res .l{width:430px;display:flex;flex-direction:column;align-items:center;gap:12px}
.res .r{flex:1;display:flex;flex-direction:column;gap:12px}
.vidcard{width:400px;height:225px;border-radius:18px;background:#1B1340;overflow:hidden;box-shadow:0 10px 24px rgba(0,0,0,.3);position:relative}
.vidcard .bar{position:absolute;left:0;bottom:0;height:7px;background:#FF3B6B;width:0}
.stat{display:flex;gap:14px}
.stat .box{flex:1;background:#F4F0FF;border-radius:18px;padding:12px 14px;text-align:center}
.stat .box b{display:block;font-size:40px;line-height:1.1;color:#FF3B6B}
.stat .box small{font-size:16px;font-weight:800;color:#6A5FA8}
.comments{display:flex;flex-direction:column;gap:8px;max-height:210px;overflow:hidden}
.cmt{display:flex;gap:10px;align-items:flex-start;animation:rise .4s both;background:#F4F0FF;border-radius:16px;padding:8px 12px;font-size:17px;font-weight:700;line-height:1.2}
.cmt .av{flex:none;width:34px;height:34px;border-radius:17px;color:#fff;font-weight:900;display:flex;align-items:center;justify-content:center}
.cmt small{display:block;font-size:13px;color:#6A5FA8;font-weight:800}
.unlock{display:flex;align-items:center;gap:12px;background:#FFF4C7;border:3px solid #FFD23F;border-radius:18px;padding:8px 14px;font-size:19px;font-weight:800;color:#6A4A00;animation:rise .5s both}

.title-z{left:380px!important;right:auto!important;top:380px!important}
.stu-z .bwrap{max-width:400px}
.intro{width:900px}
.intro .bd{padding:18px 26px;gap:24px;align-items:flex-start}
.intro .zsay{flex-direction:column;align-items:center;width:420px;gap:16px}
.intro .zsay .bwrap{max-width:420px}
.intro .zsay .bubble{font-size:19px;min-height:120px}
.intro .zsay .bubble:before{left:50%;top:-12px;bottom:auto;margin-left:-12px;border:12px solid transparent;border-bottom-color:#fff;border-top:0}
.intro .goals{width:400px;flex:none}
.intro .goals li{font-size:19px}
.intro .hd{padding:16px 26px}
.card .btn.ghost{background:#EFEAFF;color:#4B3FA0;box-shadow:0 4px 0 #CFC6F5}
/* ===== M2 ===== */
.hk{width:100%;height:100%}
.pwcard{display:flex;flex-direction:column;gap:6px;justify-content:center;text-align:left;min-height:150px;border-radius:22px;background:#fff;color:#2B2160;padding:12px 20px;box-shadow:0 6px 0 rgba(0,0,0,.2);transition:transform .1s,box-shadow .1s;border:4px solid transparent}
.pwcard:hover:not(.dead){transform:translateY(-3px)}
.pwcard .pwt{font-family:Consolas,"Courier New",monospace;font-size:30px;font-weight:900;word-break:break-all}
.pwcard.dead{background:#FFE3E8;opacity:.75;border-color:#FF3B6B;cursor:default}
.pwcard.win{background:#DDF8EA;border-color:#2FBF84}
.pwcard.sel{border-color:#FFD23F}
.atkbox{min-height:0}
.atkbox.big{min-height:104px}
.atk{display:flex;gap:4px;flex-wrap:wrap;margin-top:4px}
.atk span{display:inline-flex;align-items:center;justify-content:center;width:24px;height:30px;border-radius:6px;background:#1B1340;color:#6BF3E2;font-family:Consolas,monospace;font-weight:900;font-size:19px}
.atk span.ok{background:#FF3B6B;color:#fff}
.atkbar{height:12px;border-radius:6px;background:rgba(0,0,0,.18);margin-top:8px;overflow:hidden}
.atkbar i{display:block;height:100%;width:0;background:#FFD23F;transition:width .1s}
.atkmsg{font-size:17px;font-weight:800;margin-top:6px;min-height:24px}
.atkmsg.bad{color:#D6264F}.atkmsg.good{color:#1E9F6A}
.atkbox.big .atkmsg{color:#fff}.atkbox.big .atkmsg.bad{color:#FF8FA8}.atkbox.big .atkmsg.good{color:#6BF3A8}
.built{margin-top:12px;height:62px;border-radius:16px;background:#fff;color:#2B2160;font-family:Consolas,monospace;font-size:30px;font-weight:900;display:flex;align-items:center;padding:0 18px}
.qbox{background:rgba(255,255,255,.1);border-radius:20px;padding:16px 18px;border:2px solid rgba(255,255,255,.2)}
.qopt{display:block;width:100%;text-align:left;height:50px;border-radius:14px;background:#fff;color:#2B2160;font-size:20px;font-weight:800;padding:0 16px;margin-bottom:8px;box-shadow:0 4px 0 rgba(0,0,0,.2)}
.qopt.good{background:#2FBF84;color:#fff}.qopt.bad{background:#FF3B6B;color:#fff}
/* ===== M3 ===== */
.mrow{display:flex;align-items:center;gap:10px;width:100%;height:52px;border-radius:14px;background:rgba(255,255,255,.1);padding:0 10px;margin-bottom:6px;text-align:left;position:relative}
.mrow:hover{background:rgba(255,255,255,.2)}.mrow.sel{background:#fff;color:#2B2160}.mrow.done{opacity:.7}
.mrow .av,.mcardbig .av{flex:none;width:38px;height:38px;border-radius:19px;color:#fff;font-weight:900;font-size:19px;display:flex;align-items:center;justify-content:center}
.mrow .tx{flex:1;min-width:0}.mrow .tx b{display:block;font-size:16px;line-height:1.1}.mrow .tx small{display:block;font-size:12px;font-weight:700;opacity:.75;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mrow .st{flex:none;font-size:11px;font-weight:900;border-radius:9px;padding:3px 7px;color:#fff}
.st.safe{background:#2FBF84}.st.blocked{background:#FF3B6B}.st.err{background:#FF9F43}
.mcardbig{position:relative;padding:0;overflow:hidden}
.mcardbig .hd{display:flex;align-items:center;gap:14px;padding:16px 22px;background:#F4F0FF}
.mcardbig .hd .av{width:52px;height:52px;border-radius:26px;font-size:26px}
.mcardbig .hd b{display:block;font-size:24px}.mcardbig .hd small{font-size:16px;font-weight:700;color:#6A5FA8;font-family:Consolas,monospace}
.mcardbig .ch{margin-left:auto;font-size:14px;font-weight:900;background:#2B2160;color:#fff;border-radius:12px;padding:5px 12px}
.mcardbig .bd{padding:22px 26px;font-size:26px;font-weight:700;line-height:1.4;min-height:170px}
.clue{border-bottom:4px dashed #FF3B6B;cursor:pointer;animation:cl 1s ease-in-out infinite;padding:0 2px;border-radius:4px}
.clue:hover{background:#FFD6DF}.clue.found{background:#FF3B6B;color:#fff;animation:none;border-bottom-color:transparent}
@keyframes cl{50%{background:#FFE3E8}}
.fbm{margin-top:12px;font-size:20px;font-weight:700;line-height:1.3;min-height:54px}
.fbm b{color:#FFD23F}

  init() { this.cv = $('#fx'); this.c = this.cv.getContext('2d'); },

  heart(x, y) { this.add({ t: 'h', x, y, vx: rnd(-30, 30), vy: -120, r: 0, vr: 0, w: 22, col: '#FF3B6B', life: 1.2 }); },
  tick() {
    const now = Date.now(), dt = Math.min(.05, (now - this.last) / 1000); this.last = now; const c = this.c; c.clearRect(0, 0, W, H); const keep = [];
    for (const p of this.parts) {
      p.life -= dt; if (p.life <= 0) continue; p.vy += (p.t === 'h' ? 0 : 520) * dt; p.x += p.vx * dt; p.y += p.vy * dt; p.r += p.vr * dt;

      if (p.t === 'c') c.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
      else if (p.t === 'h') { const s = p.w / 12; c.scale(s, s); c.beginPath(); c.moveTo(0, 10); c.bezierCurveTo(-18, -2, -10, -14, 0, -6); c.bezierCurveTo(10, -14, 18, -2, 0, 10); c.fill(); }

      c.restore(); keep.push(p);
    }

  }
};
