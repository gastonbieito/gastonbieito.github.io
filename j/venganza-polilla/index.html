<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>La venganza de Polilla</title>
<style>
  body{ margin:0; background:#110A1D; color:#EEE8F7; font-family:Verdana,Arial,Helvetica,sans-serif; font-size:15px; overflow-x:hidden; }
  #caja{ width:1000px; margin:0 auto; padding:12px 0 40px; position:relative; }
  button{ font-family:Verdana,Arial,Helvetica,sans-serif; }
  .limpiar{ clear:both; }

  #barra{ overflow:hidden; padding:4px 0 10px; }
  #titulo{ float:left; font-size:24px; font-weight:bold; letter-spacing:-0.5px; margin-top:6px; }
  #titulo span{ color:#B98CFF; }
  #bateria{ float:right; width:250px; margin-top:4px; }
  #batTxt{ font-size:11px; color:#9D8DB8; margin-bottom:4px; overflow:hidden; letter-spacing:1px; }
  #batTxt b{ float:right; font-size:14px; color:#7CFFB2; letter-spacing:0; }
  #batMarco{ position:relative; height:16px; border:2px solid #4A3B66; border-radius:6px; padding:2px; }
  #batMarco:after{ content:''; position:absolute; right:-7px; top:4px; width:4px; height:8px; background:#4A3B66; border-radius:0 2px 2px 0; }
  #batBarra{ height:16px; width:100%; background:#7CFFB2; border-radius:3px; transition:width .5s, background .5s; }
  #quien{ float:right; margin:8px 22px 0 0; font-size:12px; color:#9D8DB8; }
  #quien b{ color:#EEE8F7; }
  #sonido{ background:none; border:0; color:#6F5F8C; font-size:11px; cursor:pointer; text-decoration:underline; padding:0; margin-left:8px; }

  /* salas */
  #salas{ margin:6px 0 12px; overflow:hidden; }
  .tab{ float:left; margin-right:7px; width:104px; height:50px; border-radius:12px; background:#1C1330; color:#6F5F8C;
        cursor:pointer; border:2px solid #1C1330; text-align:center; padding-top:6px; box-sizing:border-box; font-size:10px; font-weight:bold; }
  .tab svg{ display:block; margin:0 auto 3px; }
  .tab.hecha{ color:#110A1D; background:#7CFFB2; border-color:#7CFFB2; }
  .tab.ahora{ border-color:#FFC857; color:#FFC857; }
  .tab.cerrada{ opacity:.4; cursor:default; }
  .tab.final{ width:112px; }
  .tab.bonus{ background:#2A1847; border-color:#2A1847; color:#B98CFF; }

  #izq{ float:left; width:660px; }
  #der{ float:right; width:322px; }

  .sala{ background:#1C1330; border:1px solid #2E2148; border-radius:18px; padding:18px 22px 22px; min-height:430px; }
  .sala h1{ margin:0 0 2px; font-size:13px; letter-spacing:3px; color:#9D8DB8; font-weight:bold; }
  .acert h2{ font-size:22px; margin:6px 0 4px; color:#FFC857; }
  .linea{ font-size:15.5px; color:#DCD3EC; margin:0 0 14px; }
  .linea b{ color:#7CFFB2; }
  .hecho{ background:#16282A; border:1px solid #2F6B5A; border-radius:10px; padding:7px 12px; margin-bottom:6px; color:#7CFFB2; font-size:13px; }
  .codigo{ font-family:'Courier New',monospace; font-size:34px; letter-spacing:8px; background:#0B0614; border:1px solid #2E2148; border-radius:12px;
           padding:14px 18px; margin:4px 0 12px; color:#7CFFB2; text-align:center; }
  .fila{ margin-top:10px; }
  input.resp{ font-size:20px; padding:9px 12px; width:250px; border-radius:10px; border:2px solid #4A3B66; background:#0B0614; color:#fff;
              font-family:'Courier New',monospace; letter-spacing:3px; text-transform:uppercase; vertical-align:middle; }
  .btn{ display:inline-block; vertical-align:middle; border:0; border-radius:11px; padding:11px 20px; margin-left:6px; cursor:pointer;
        font-size:15px; font-weight:bold; background:#FFC857; color:#110A1D; border-bottom:4px solid #B98A2C; }
  .btn:active{ border-bottom-width:2px; margin-top:2px; }
  .btn.sec{ background:#2E2148; color:#DCD3EC; border-bottom-color:#1A1129; }
  .msj{ min-height:22px; margin-top:10px; font-size:14px; font-weight:bold; }
  .msj.mal{ color:#FF6B8B; } .msj.bien{ color:#7CFFB2; }

  /* teclado */
  .teclado{ margin:2px 0 4px; }
  .tfila{ margin-bottom:5px; white-space:nowrap; }
  .tecla{ display:inline-block; width:40px; height:38px; line-height:38px; text-align:center; margin-right:5px; border-radius:7px;
          background:#2E2148; color:#EEE8F7; font-weight:bold; font-size:15px; cursor:pointer; border:0; border-bottom:3px solid #1A1129; padding:0; }
  .tecla:hover{ background:#3F2E62; }
  .tecla.ancha{ width:84px; font-size:11px; }
  .tecla.esp{ width:180px; font-size:11px; }

  /* atajos */
  .atajos{ margin:6px 0 4px; white-space:nowrap; }
  .atajo{ display:inline-block; width:132px; margin-right:10px; text-align:center; background:#0B0614; border-radius:14px; padding:14px 0 12px; }
  .atajo svg{ display:block; margin:0 auto 10px; }
  .atajo span{ font-size:15px; font-weight:bold; color:#9D8DB8; vertical-align:middle; }
  .atajo input{ width:38px; height:38px; font-size:22px; text-align:center; border-radius:8px; border:2px solid #4A3B66; background:#1C1330; color:#fff;
                font-family:'Courier New',monospace; text-transform:uppercase; vertical-align:middle; margin-left:4px; }

  /* simon */
  .simon{ width:260px; height:260px; position:relative; margin:6px 0 10px; }
  .pad{ position:absolute; width:122px; height:122px; cursor:pointer; opacity:.35; transition:opacity .08s, box-shadow .08s; }
  .pad.p0{ left:0; top:0; background:#2ECC71; border-radius:122px 14px 14px 14px; }
  .pad.p1{ left:138px; top:0; background:#FF5470; border-radius:14px 122px 14px 14px; }
  .pad.p2{ left:0; top:138px; background:#FFC857; border-radius:14px 14px 14px 122px; }
  .pad.p3{ left:138px; top:138px; background:#4D8BFF; border-radius:14px 14px 122px 14px; }
  .pad.luz{ opacity:1; box-shadow:0 0 30px rgba(255,255,255,.55); }
  .simonCentro{ position:absolute; left:85px; top:85px; width:90px; height:90px; border-radius:50%; background:#110A1D; border:4px solid #2E2148;
                text-align:center; line-height:90px; font-size:26px; font-weight:bold; color:#FFC857; cursor:pointer; }
  .rondas span{ display:inline-block; width:18px; height:18px; border-radius:50%; background:#2E2148; margin-right:6px; }
  .rondas span.ok{ background:#7CFFB2; }

  /* lámparas */
  .mini{ white-space:nowrap; margin:5px 0; }
  .mini span{ display:inline-block; width:24px; height:24px; border-radius:50%; margin-right:8px; background:#2E2148; border:2px solid #3F2E62; vertical-align:middle; }
  .mini span.on{ background:#FFE27A; border-color:#FFF2B8; box-shadow:0 0 10px rgba(255,226,122,.6); }
  .mini span.num{ background:none; border:0; box-shadow:none; text-align:center; font-weight:bold; font-size:11px; color:#9D8DB8; line-height:24px; }
  .lamparas{ white-space:nowrap; margin:6px 0; }
  .lampara{ display:inline-block; width:62px; margin-right:6px; text-align:center; cursor:pointer; }
  .foco{ width:46px; height:46px; margin:0 auto 4px; border-radius:50%; background:#2E2148; border:3px solid #3F2E62; transition:background .15s, box-shadow .15s; }
  .lampara.on .foco{ background:#FFE27A; border-color:#FFF2B8; box-shadow:0 0 20px rgba(255,226,122,.75); }
  .lampara b{ color:#9D8DB8; font-size:13px; }

  /* rompecabezas */
  .puzzle{ position:relative; width:300px; height:300px; background:#0B0614; border-radius:10px; margin:4px 0 10px; display:inline-block; vertical-align:top; }
  .ficha{ position:absolute; width:96px; height:96px; border-radius:6px; cursor:pointer; transition:left .12s, top .12s; box-shadow:inset 0 0 0 1px rgba(255,255,255,.15); }
  .modelo{ display:inline-block; vertical-align:top; margin-left:18px; text-align:center; color:#6F5F8C; font-size:11px; }
  .modelo div{ width:120px; height:120px; border-radius:6px; margin-bottom:6px; opacity:.6; filter:blur(3px); }

  /* diferencias */
  .difs{ white-space:nowrap; margin:6px 0 4px; }
  .pgrid{ display:inline-block; vertical-align:top; margin-right:26px; background:#0B0614; padding:6px; border-radius:8px; position:relative; }
  .pfila{ height:20px; }
  .pp{ display:inline-block; width:20px; height:20px; }
  .pgrid.clic .pp{ cursor:pointer; }
  .pp.marcada{ box-shadow:inset 0 0 0 3px #FF5470; border-radius:50%; }
  .pp.error{ box-shadow:inset 0 0 0 3px #FFFFFF; }

  /* archivos */
  .cartas{ margin:6px 0; }
  .carta{ display:inline-block; vertical-align:top; width:136px; margin:0 8px 10px 0; background:#0B0614; border:2px solid #2E2148; border-radius:12px;
          padding:10px 8px; text-align:center; cursor:pointer; position:relative; }
  .carta .ico{ width:34px; height:40px; margin:0 auto 6px; border-radius:4px 12px 4px 4px; font-size:10px; font-weight:bold; color:#fff; line-height:40px; }
  .carta .nom{ font-size:12px; color:#DCD3EC; word-wrap:break-word; }
  .carta .tam{ font-size:16px; font-weight:bold; color:#FFC857; margin-top:4px; }
  .carta.ok{ border-color:#7CFFB2; background:#16282A; }
  .carta.sel{ border-color:#FF5470; background:#2A1325; }
  .carta .orden{ position:absolute; left:-8px; top:-8px; width:26px; height:26px; border-radius:50%; background:#7CFFB2; color:#110A1D; font-weight:bold; line-height:26px; font-size:13px; }
  .leyenda{ font-size:13px; color:#9D8DB8; margin-bottom:6px; }
  .toggle{ display:inline-block; font-size:12.5px; padding:6px 12px; border-radius:8px; border:1px solid #4A3B66; background:#110A1D; color:#DCD3EC; cursor:pointer; margin-bottom:8px; }
  .toggle.on{ border-color:#7CFFB2; color:#7CFFB2; }

  /* caños */
  .canos{ position:relative; display:inline-block; background:#0B0614; padding:10px 50px; border-radius:12px; margin:4px 0 8px; }
  .cfila{ height:64px; }
  .cano{ display:inline-block; width:64px; height:64px; cursor:pointer; vertical-align:top; }
  .cano svg{ display:block; }
  .extremo{ position:absolute; top:138px; width:40px; text-align:center; font-size:10px; color:#9D8DB8; font-weight:bold; }

  /* paquetes */
  .paquetes{ margin:8px 0; white-space:nowrap; }
  .paquete{ display:inline-block; width:104px; margin-right:10px; background:#0B0614; border:2px solid #2E2148; border-radius:12px; text-align:center; padding:12px 0; cursor:pointer; }
  .paquete .bin{ font-family:'Courier New',monospace; font-size:24px; font-weight:bold; color:#FFC857; letter-spacing:2px; }
  .paquete .txt{ font-size:12px; color:#6F5F8C; margin-top:4px; }
  .paquete.usado{ opacity:.25; cursor:default; }
  .mensaje{ font-family:'Courier New',monospace; font-size:24px; letter-spacing:3px; min-height:34px; background:#0B0614; border-radius:10px; padding:10px 14px; color:#7CFFB2; }

  /* final */
  table.arch{ border-collapse:collapse; width:100%; font-size:13.5px; margin:4px 0 8px; }
  table.arch th{ text-align:left; color:#9D8DB8; font-size:11px; letter-spacing:1px; padding:6px 8px; border-bottom:1px solid #2E2148; }
  table.arch td{ padding:7px 8px; border-bottom:1px solid #251A3B; }
  table.arch tr.f{ cursor:pointer; }
  table.arch tr.f:hover td{ background:#2A1E40; }
  table.arch tr.tachada td{ color:#4A3B66; text-decoration:line-through; }
  table.arch tr.elegida td{ background:#2A1325; }

  /* luces apagar */
  .lo{ display:inline-block; background:#0B0614; padding:8px; border-radius:10px; }
  .lo div{ height:62px; }
  .lo span{ display:inline-block; width:56px; height:56px; margin:3px; border-radius:10px; background:#2E2148; cursor:pointer; }
  .lo span.on{ background:#FFE27A; box-shadow:0 0 16px rgba(255,226,122,.6); }

  /* columna derecha */
  .panel{ background:#1C1330; border:1px solid #2E2148; border-radius:16px; padding:12px 14px; margin-bottom:10px; }
  .panel .t{ font-size:10.5px; letter-spacing:2px; color:#9D8DB8; font-weight:bold; margin-bottom:8px; }
  #polCaja{ text-align:center; position:relative; padding-top:14px; }
  #globo{ position:relative; display:inline-block; background:#EEE8F7; color:#110A1D; font-size:14px; font-weight:bold; padding:9px 14px; border-radius:14px;
          margin-bottom:6px; max-width:260px; min-height:18px; line-height:1.35; }
  #globo:after{ content:''; position:absolute; left:50%; bottom:-8px; margin-left:-8px; border-left:8px solid transparent; border-right:8px solid transparent; border-top:8px solid #EEE8F7; }
  .poder{ margin-top:4px; }
  .poder span{ display:inline-block; width:40px; height:10px; border-radius:5px; background:#B98CFF; margin:0 3px; }
  .poder span.no{ background:#2E2148; }
  .pista{ background:#110A1D; border-radius:10px; padding:7px 10px; margin-bottom:6px; font-size:12.5px; color:#DCD3EC; }
  .pista b{ color:#7CFFB2; }
  .pista.vacia{ color:#4A3B66; }
  #ayuda .una{ font-size:13px; line-height:1.45; margin-bottom:6px; color:#DCD3EC; }
  #ayuda .una b{ color:#FFC857; }
  #bPista{ width:100%; margin:4px 0 0; }

  /* Polilla */
  .pol{ display:block; margin:0 auto; overflow:visible; }
  .pol .ala{ transform-origin:60px 52px; animation:aleteo .22s ease-in-out infinite alternate; }
  .pol .ala.d{ animation-delay:.0s; }
  @keyframes aleteo{ from{ transform:scaleX(1); } to{ transform:scaleX(.82); } }
  .pol .ojoP{ animation:mirar 4s ease-in-out infinite; }
  @keyframes mirar{ 0%,40%{ transform:translateX(0); } 50%,70%{ transform:translateX(2px); } 80%,100%{ transform:translateX(-1px); } }
  .pol .parp{ transform-origin:60px 40px; animation:parpadeo 3.8s infinite; }
  @keyframes parpadeo{ 0%,94%,100%{ transform:scaleY(1); } 97%{ transform:scaleY(.1); } }
  .pol .ceja{ opacity:0; transition:opacity .2s; }
  .pol.enojada .ceja{ opacity:1; }
  .pol.enojada .ojoP{ fill:#FF3355; }
  .pol.jiji{ animation:rebote .35s ease 3; }
  @keyframes rebote{ 0%,100%{ transform:translateY(0); } 50%{ transform:translateY(-10px); } }
  .pol.derrotada{ opacity:.6; }
  .pol.derrotada .ala{ animation:none; transform:scaleX(.7) rotate(8deg); }
  .pol.mareada{ animation:mareo 1s ease-in-out infinite; }
  @keyframes mareo{ 0%,100%{ transform:rotate(-12deg); } 50%{ transform:rotate(12deg); } }
  #vuelo{ position:fixed; top:40%; left:-140px; z-index:40; pointer-events:none; display:none; }
  #vuelo.va{ display:block; animation:cruzar 1.6s ease-in-out forwards; }
  @keyframes cruzar{ 0%{ left:-140px; top:55%; } 25%{ top:30%; } 50%{ top:60%; } 75%{ top:35%; } 100%{ left:105%; top:50%; } }

  /* pantallas completas */
  .pantalla{ display:none; }
  .hoja{ background:#1C1330; border:1px solid #2E2148; border-radius:20px; padding:30px 36px; margin-top:16px; text-align:center; }
  .hoja h1{ font-size:40px; margin:6px 0 4px; }
  .hoja h1 span{ color:#B98CFF; }
  .hoja p{ font-size:17px; line-height:1.55; color:#DCD3EC; margin:6px 0; }
  input.nombre{ font-size:20px; padding:10px 14px; border-radius:12px; border:2px solid #4A3B66; background:#0B0614; color:#fff; width:280px; text-align:center; }
  .grande{ display:inline-block; border:0; border-radius:12px; padding:14px 28px; margin:14px 8px 0; cursor:pointer; font-size:17px; font-weight:bold;
           background:#FFC857; color:#110A1D; border-bottom:4px solid #B98A2C; }
  .grande.sec{ background:transparent; color:#9D8DB8; border:2px solid #2E2148; font-size:13px; padding:10px 16px; }
  .chips span{ display:inline-block; background:#110A1D; border-radius:10px; padding:7px 12px; margin:4px; font-size:13px; color:#DCD3EC; }
  .chips b{ color:#FFC857; }
  .diploma{ display:inline-block; background:#1C1330; border:2px solid #4A3B66; border-radius:18px; padding:20px 40px; margin-top:12px; }
  .diploma td{ padding:5px 14px; color:#9D8DB8; text-align:left; font-size:14px; }
  .diploma td.v{ color:#EEE8F7; font-weight:bold; text-align:right; font-size:17px; }
  .temblor{ animation:tiembla .35s linear; }
  @keyframes tiembla{ 0%,100%{ transform:translateX(0); } 20%{ transform:translateX(-7px); } 40%{ transform:translateX(7px); } 60%{ transform:translateX(-4px); } 80%{ transform:translateX(4px); } }
  .aparece{ animation:aparece .4s ease; }
  @keyframes aparece{ from{ opacity:0; transform:scale(.9); } to{ opacity:1; transform:none; } }
</style>
</head>
<body>
<div id="vuelo"></div>
<div id="caja">
  <div id="barra">
    <div id="titulo">La venganza de <span>Polilla</span></div>
    <div id="bateria"><div id="batTxt">BATERÍA <b id="batPct">100 %</b></div><div id="batMarco"><div id="batBarra"></div></div></div>
    <div id="quien"></div>
  </div>
  <div id="inicio" class="pantalla"></div>
  <div id="juego" class="pantalla">
    <div id="salas"></div>
    <div id="izq"></div>
    <div id="der">
      <div class="panel" id="polCaja"></div>
      <div class="panel"><div class="t">¿DÓNDE SE ESCONDE POLILLA?</div><div id="pistasP"></div></div>
      <div class="panel"><div class="t">AYUDA</div><div id="ayuda"></div><button class="btn sec" id="bPista" onclick="pedirPista()">Pedir ayuda</button></div>
    </div>
    <div class="limpiar"></div>
  </div>
  <div id="fin" class="pantalla"></div>
</div>
<script>
/* ════════════════════════════════════════════════════════════════
   LA VENGANZA DE POLILLA · sala de escape para 6.º
   Un solo archivo, sin internet, JavaScript ES5.
   ════════════════════════════════════════════════════════════════ */
function $(id){ return document.getElementById(id); }
function esc(t){ return String(t).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }
function norm(s){
  s = String(s || '').toUpperCase();
  s = s.replace(/[ÁÀÄ]/g, 'A').replace(/[ÉÈË]/g, 'E').replace(/[ÍÌÏ]/g, 'I').replace(/[ÓÒÖ]/g, 'O').replace(/[ÚÙÜ]/g, 'U');
  return s.replace(/[^A-Z0-9Ñ]/g, '');
}
function azar(a){ return a[Math.floor(Math.random() * a.length)]; }

/* ── sonido ─────────────────────────────────────────────────────── */
var AC = null, sonido = true;
function tono(f, dur, tipo, vol, hasta, demora){
  if (!sonido) return;
  try {
    if (!AC){ var C = window.AudioContext || window.webkitAudioContext; if (!C) return; AC = new C(); }
    if (AC.state === 'suspended' && AC.resume) AC.resume();
    var t = AC.currentTime + (demora || 0), o = AC.createOscillator(), g = AC.createGain();
    o.type = tipo; o.frequency.setValueAtTime(f, t);
    if (hasta) o.frequency.exponentialRampToValueAtTime(hasta, t + dur);
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + 0.01); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(AC.destination); o.start(t); o.stop(t + dur + 0.03);
  } catch(e){}
}
function sonClic(){ tono(520, 0.05, 'triangle', 0.08); }
function sonBien(){ tono(660, 0.12, 'sine', 0.16); tono(880, 0.2, 'sine', 0.14, 0, 0.1); }
function sonMal(){ tono(200, 0.25, 'square', 0.09, 120); }
function sonJiji(){ tono(1300, 0.07, 'square', 0.05, 900, 0); tono(1400, 0.07, 'square', 0.05, 950, 0.1); tono(1500, 0.09, 'square', 0.05, 1000, 0.2); }
function sonGrr(){ tono(110, 0.35, 'sawtooth', 0.10, 80); }
function sonPuerta(){ var n = [392, 523, 659, 784], i; for (i = 0; i < 4; i++) tono(n[i], i === 3 ? 0.35 : 0.12, 'sine', 0.16, 0, i * 0.11); }
var TONOS_SIMON = [330, 392, 494, 587];

/* ── estado y guardado ──────────────────────────────────────────── */
var CLAVE = 'venganza_polilla_v1', guardaOK = true, TOTAL = 45 * 60 * 1000;
var COSTO = {ayuda: 90000, error: 20000, chico: 10000, final: 60000};
var S = nuevo();
function nuevo(){ return {nombre:'', fase:'inicio', t:TOTAL, hecho:{}, ayudas:{}, errores:0, sala:0, p:{}, salida:null}; }
function guardar(){ try { window.localStorage.setItem(CLAVE, JSON.stringify(S)); } catch(e){ guardaOK = false; } }
function cargar(){
  try { var r = window.localStorage.getItem(CLAVE); if (r){ var o = JSON.parse(r); if (o && o.hecho) S = o; } } catch(e){ guardaOK = false; }
  try { window.localStorage.setItem('vp_prueba', '1'); window.localStorage.removeItem('vp_prueba'); } catch(e){ guardaOK = false; }
}
function P(id){ if (!S.p[id]) S.p[id] = {}; return S.p[id]; }

/* ── Polilla ────────────────────────────────────────────────────── */
function polSVG(w, id){
  return '<svg class="pol" ' + (id ? 'id="' + id + '" ' : '') + 'width="' + w + '" height="' + Math.round(w * 0.86) + '" viewBox="0 0 120 103">' +

  h += '<div class="simonCentro" id="simonPlay" onclick="verSimon()">&#9654;</div></div><div class="rondas">';

    if (S.sala !== 1 || S.hecho.M1){ simonOcupado = false; return; }

var CAMINO = {'2_0':9, '1_0':6, '1_1':10, '1_2':12, '2_2':5, '3_2':3, '3_3':9, '2_3':6, '2_4':10};
var SENUELO = [5, 3, 7, 10, 6, 12, 9, 11, 13, 14, 5, 3, 7, 6, 9, 12];
function rotar(m){ return ((m << 1) | (m >> 3)) & 15; }
function canoBase(r, c){ var k = r + '_' + c; return CAMINO[k] !== undefined ? CAMINO[k] : SENUELO[(r * 5 + c) % SENUELO.length]; }
function canoMask(st, r, c){ var m = canoBase(r, c), i; for (i = 0; i < st.rot[r * 5 + c]; i++) m = rotar(m); return m; }
function r1St(){
  var st = P('R1'), i;
  if (!st.rot){ st.rot = []; for (i = 0; i < 25; i++) st.rot.push(Math.floor(Math.random() * 4)); if (conectado(st).ok) st.rot[12] = (st.rot[12] + 1) % 4; }
  return st;
}
function conectado(st){
  var vis = {}, cola = [], ok = false, DIR = [[-1, 0, 1, 4], [0, 1, 2, 8], [1, 0, 4, 1], [0, -1, 8, 2]], cur, m, d, nr, nc;
  if (!(canoMask(st, 2, 0) & 8)) return {vis:vis, ok:false};
  vis['2_0'] = 1; cola.push([2, 0]);
  while (cola.length){
    cur = cola.shift(); m = canoMask(st, cur[0], cur[1]);
    if (cur[0] === 2 && cur[1] === 4 && (m & 2)) ok = true;
    for (d = 0; d < 4; d++){
      if (!(m & DIR[d][2])) continue;
      nr = cur[0] + DIR[d][0]; nc = cur[1] + DIR[d][1];
      if (nr < 0 || nr > 4 || nc < 0 || nc > 4 || vis[nr + '_' + nc]) continue;
      if (canoMask(st, nr, nc) & DIR[d][3]){ vis[nr + '_' + nc] = 1; cola.push([nr, nc]); }
    }
  }
  return {vis:vis, ok:ok};
}

}

/* X1 · apagá todo */
var LO_INICIO = [0, 1, 1, 1, 0, 1, 1, 1, 1];
CUERPO.X1 = function(){
  var st = P('X1'), on = st.on || LO_INICIO.slice(0), h = '<p class="linea">Apagá <b>todas</b> las luces.</p><div class="lo">', r, c;
  for (r = 0; r < 3; r++){ h += '<div>'; for (c = 0; c < 3; c++) h += '<span id="lo' + (r * 3 + c) + '" class="' + (on[r * 3 + c] ? 'on' : '') + '" onclick="tocarLO(' + (r * 3 + c) + ')"></span>'; h += '</div>'; }
  return h + '</div><div class="fila"><button class="btn sec" style="margin-left:0" onclick="reiniciarLO()">Empezar de nuevo</button></div><div class="msj" id="m_X1"></div>';
};
function tocarLO(i){
  var st = P('X1'), r = Math.floor(i / 3), c = i % 3, t = [i], k, todo = true;
  if (!st.on) st.on = LO_INICIO.slice(0);
  if (r > 0) t.push(i - 3); if (r < 2) t.push(i + 3); if (c > 0) t.push(i - 1); if (c < 2) t.push(i + 1);
  for (k = 0; k < t.length; k++) st.on[t[k]] = st.on[t[k]] ? 0 : 1;
  tono(600 + i * 40, 0.06, 'sine', 0.1);
  for (k = 0; k < 9; k++) if (st.on[k]) todo = false;
  guardar();
  if (todo){ resolver('X1'); return; }
  dibujarSala();
}
function reiniciarLO(){ P('X1').on = LO_INICIO.slice(0); guardar(); dibujarSala(); }

/* X2 · candado */
CUERPO.X2 = function(){
  var pistas = [['8 3 5', 'dos bien y en su lugar'], ['6 5 4', 'uno bien, en otro lugar'], ['9 2 8', 'uno bien, en otro lugar'], ['2 0 7', 'nada'], ['8 6 2', 'uno bien y en su lugar']], h = '<p class="linea">El candado tiene <b>3 números distintos</b>.</p><div class="codigo" style="font-size:15px;letter-spacing:1px;text-align:left;font-family:Verdana,Arial,sans-serif;color:#DCD3EC;line-height:2">', i;
  for (i = 0; i < pistas.length; i++) h += '<b style="font-family:Courier New,monospace;font-size:22px;letter-spacing:4px;color:#7CFFB2;display:inline-block;width:110px">' + pistas[i][0] + '</b>' + pistas[i][1] + '<br>';
  return h + '</div>' + cajaResp('X2', '3 números');
};

/* X3 · la rueda */
var ABC = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
CUERPO.X3 = function(){
  var st = P('X3'), k = st.k || 0, MSJ = 'HO PDV GLILFLO', h, a = '', b = '', i, c, dec = '';
  for (i = 0; i < MSJ.length; i++){ c = MSJ.charAt(i); dec += c === ' ' ? ' ' : ABC.charAt((ABC.indexOf(c) - k + 26) % 26); }
  for (i = 0; i < 26; i++){
    c = ABC.charAt(i);
    a += MSJ.indexOf(c) >= 0 ? '<b style="color:#FFC857;text-decoration:underline">' + c + '</b>' : c;
    b += ABC.charAt((i - k + 26) % 26);
  }
  h = '<p class="linea">Girá la rueda hasta que el mensaje <b>se lea</b>.</p><div class="codigo" style="font-size:28px">HO PDV GLILFLO</div>' +
      '<div style="text-align:center;margin:-4px 0 12px"><span style="font-size:11px;color:#6F5F8C;letter-spacing:2px">CON LA RUEDA EN ' + k + ' DICE</span><div style="font-family:Courier New,monospace;font-size:26px;letter-spacing:6px;color:' + (k === 3 ? '#7CFFB2' : '#9D8DB8') + '">' + dec + '</div></div>' +
      '<div style="background:#0B0614;border-radius:10px;padding:10px 14px;font-family:Courier New,monospace;font-size:16px;letter-spacing:4px;line-height:1.6;white-space:nowrap">' +
      '<span style="display:inline-block;width:70px;font-family:Verdana,Arial,sans-serif;font-size:10px;letter-spacing:1px;color:#6F5F8C">MENSAJE</span><span style="color:#9D8DB8">' + a + '</span><br>' +
      '<span style="display:inline-block;width:70px;font-family:Verdana,Arial,sans-serif;font-size:10px;letter-spacing:1px;color:#6F5F8C">SE LEE</span><span style="color:#7CFFB2">' + b + '</span></div>' +
      '<div class="fila"><button class="btn sec" style="margin-left:0" onclick="rueda(-1)">&#9664;</button><span style="display:inline-block;width:110px;text-align:center;color:#9D8DB8">rueda: ' + k + '</span><button class="btn sec" onclick="rueda(1)">&#9654;</button></div>';
  return h + cajaResp('X3', 'el mensaje');
};
function rueda(d){ var st = P('X3'); st.k = ((st.k || 0) + d + 26) % 26; sonClic(); guardar(); dibujarSala(); }

/* ── inicio y final ─────────────────────────────────────────────── */
function vistaInicio(){
  var h = '<div class="hoja">' + polSVG(190, 'polIni') + '<h1>La venganza de <span>Polilla</span></h1>' +
    '<p>Polilla volvió y te encerró <b style="color:#FFC857">adentro de la compu</b>.<br>Pasá las 5 salas, juntá las pistas y <b style="color:#7CFFB2">atrapala</b>.</p>' +
    '<div class="chips"><span><b>45 min</b> de batería</span><span>Ayudas y errores <b>gastan batería</b></span><span>Tu teclado es parte del juego</span></div>';
  if (!guardaOK) h += '<p style="color:#FF5470;font-size:13px">Este navegador no guarda el avance: no cierres la página.</p>';
  if (S.fase !== 'inicio' && S.nombre) h += '<button class="grande" onclick="continuar()">Continuar como ' + esc(S.nombre) + '</button><br><button class="grande sec" onclick="deCero()">Empezar de cero</button>';
  else h += '<p style="margin-top:18px">¿Cómo te llamás?</p><input class="nombre" id="nom" maxlength="24" onkeydown="if(event.keyCode===13)empezar()"><div id="nomAviso" style="color:#FF5470;font-size:13px;min-height:18px;margin-top:6px"></div><button class="grande" onclick="empezar()">Entrar &#9654;</button>';
  $('inicio').innerHTML = h + '</div>';
  mostrar('inicio'); dibujarBateria();
}
function empezar(){
  var v = String($('nom').value || '').replace(/^\s+|\s+$/g, '');
  if (!v){ $('nomAviso').innerHTML = 'Escribí tu nombre.'; return; }
  S = nuevo(); S.nombre = v; S.fase = 'juego'; guardar(); entrar(); sonJiji();
}
function continuar(){ if (S.salida && S.sala !== 6){ mostrarFin(); return; } entrar(); }
function deCero(){ if (!window.confirm('Se borra todo el avance de esta computadora. ¿Seguro?')) return; S = nuevo(); guardar(); vistaInicio(); }
function entrar(){ S.fase = 'juego'; guardar(); mostrar('juego'); render(); polilla(SALAS[S.sala].pol); }
function contarBonus(){ return (S.hecho.X1 ? 1 : 0) + (S.hecho.X2 ? 1 : 0) + (S.hecho.X3 ? 1 : 0); }
function mostrarFin(){
  var s = S.salida, na = 0, k;
  for (k in S.ayudas) if (S.ayudas.hasOwnProperty(k) && AX[k] && AX[k].sala < 6) na += S.ayudas[k];
  $('fin').innerHTML = '<div class="hoja">' + polSVG(120, 'polFin').replace('class="pol"', 'class="pol derrotada"') +
    '<h1 style="color:#7CFFB2">¡Atrapaste a Polilla!</h1><p>' + esc(S.nombre) + ', vaciaste la papelera y saliste de la compu.</p>' +
    '<div class="diploma"><table>' +
    '<tr><td>Batería que te quedó</td><td class="v" style="color:#7CFFB2;font-size:30px">' + s.bat + ' %</td></tr>' +
    '<tr><td>Ayudas pedidas</td><td class="v">' + na + '</td></tr>' +
    '<tr><td>Errores</td><td class="v">' + S.errores + '</td></tr>' +
    '<tr><td>Archivos secretos</td><td class="v">' + contarBonus() + ' de 3</td></tr></table></div>' +
    '<p style="color:#9D8DB8;margin-top:12px">Avisale al profe cuánta batería te quedó.</p>' +
    (contarBonus() < 3 ? '<button class="grande" onclick="irBonus()">Abrir los archivos secretos</button>' : '<p style="color:#B98CFF;font-weight:bold">Resolviste los archivos secretos. Sos leyenda.</p>') + '</div>';
  mostrar('fin');
}
function irBonus(){ S.sala = 6; S.fase = 'juego'; guardar(); mostrar('juego'); render(); polilla(SALAS[6].pol); }

function init(){
  cargar();
  setInterval(tic, 1000);
  vistaInicio();
}
init();

</script>
<script src="/volver.js" data-pos="bl"></script>
